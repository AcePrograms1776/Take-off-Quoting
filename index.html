<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remodel Quote Builder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#1b1b1b;
    --muted:#888;
    --paper:#fdfdfb;
    --page-bg:#1b2a4a;
    --accent:#f2b134;
    --line:#eee;
    --underline:#ccc;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:var(--page-bg);
    color:var(--ink);
    padding:24px 16px;
    display:flex;
    justify-content:center;
  }

  .sheet{
    width:100%; max-width:700px;
    background:var(--paper);
    border-radius:10px;
    padding:24px 26px 30px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
  }

  /* ---------- Letterhead fields (from the estimating pad) ---------- */
  .header-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:8px;}
  .header-grid.single{grid-template-columns:1fr;}

  .field-input{
    border:none; border-bottom:1px solid var(--underline);
    border-radius:0; padding:6px 2px; font-size:1rem; font-family:inherit;
    color:var(--ink); width:100%; background:transparent;
  }
  .field-input:focus{outline:none; border-bottom-color:var(--accent);}
  .field-input::placeholder{color:#3d3d3d; opacity:1;}
  .field-input::-webkit-input-placeholder{color:#3d3d3d;}
  .st-num::placeholder{color:#3d3d3d; opacity:1;}

  .header-gap{height:18px;}

  /* ---------- Trips / Permit rows ---------- */
  .item-row{
    display:flex; align-items:center; gap:12px;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .item-label{font-weight:600; min-width:3.75rem; color:var(--ink);}

  .qty-input{width:4rem; text-align:right;}

  .item-total{font-weight:600; min-width:5rem; text-align:right;}

  .permit-right{display:flex; align-items:center; gap:16px; margin-left:auto;}
  .toggle-group{display:flex; gap:8px;}
  .toggle-btn{
    border:1px solid var(--underline); background:transparent; color:var(--muted);
    padding:7px 18px; border-radius:4px; cursor:pointer; font-weight:600;
    font-size:0.85rem; font-family:inherit;
  }
  .toggle-btn:hover{border-color:var(--ink);}
  .toggle-btn.active{background:var(--accent); color:#1b1b1b; border-color:var(--accent);}

  /* ---------- Rooms ---------- */
  .room-block{
    border:1px solid var(--underline); border-radius:6px;
    padding:12px 14px; margin-top:14px;
  }
  .room-head{
    display:flex; align-items:center; gap:10px;
    padding-bottom:8px; border-bottom:1px solid var(--line);
  }
  .room-name{
    font-weight:700; font-size:1rem; font-family:inherit; color:var(--ink);
    border:none; border-bottom:1px dashed var(--underline); background:transparent;
    padding:2px 2px; min-width:0; flex:1;
  }
  .room-name:focus{outline:none; border-bottom:1px solid var(--accent);}
  .room-subtotal{margin-left:auto; font-weight:600;}
  .room-remove{
    background:none; border:none; color:var(--muted); cursor:pointer;
    font-size:0.95rem; padding:2px 4px;
  }
  .room-remove:hover{color:#b23;}
  .room-empty{color:var(--muted); font-size:0.85rem; padding:10px 0 4px;}

  .task-row{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:9px 0; border-bottom:1px solid var(--line);
  }
  .qty-unit{font-size:0.78rem; color:var(--muted);}
  /* Add-on footage boxes. Deliberately identical on every service task. */
  .addon-wrap{
    flex-basis:100%; display:flex; flex-wrap:wrap; gap:8px;
    padding:8px 0 2px;
  }
  .addon-cell{
    display:flex; align-items:center; gap:6px;
    border:1px solid #e2dfd6; border-radius:6px;
    padding:5px 8px; background:#faf9f5;
  }
  .addon-label{font-size:0.78rem; color:var(--ink); white-space:nowrap;}
  .addon-input{
    -webkit-appearance:none; appearance:none;
    width:46px; min-width:46px; flex:none;
    border:none; border-bottom:1px dashed #cfcbc1; background:transparent;
    font-family:inherit; font-size:0.85rem; color:var(--ink);
    text-align:right; padding:1px 2px; margin:0;
    font-variant-numeric:tabular-nums;
  }
  .addon-input:focus{outline:none; border-bottom:1px solid var(--accent);}
  .addon-unit{font-size:0.72rem; color:var(--muted);}
  .addon-money{
    font-size:0.78rem; font-weight:600; color:var(--ink);
    font-variant-numeric:tabular-nums; min-width:58px; text-align:right;
  }

  .task-note{
    flex-basis:100%; font-size:0.78rem; color:var(--muted); padding-top:4px;
  }
  .task-note.warn{color:#b23;}
  .task-note:empty{display:none;}
  /* Short names sit inline where the dropdown was. Once the text gets long
     the box takes the whole line, pushing qty and price down rather than
     squeezing them out of reach. */
  .custom-name{flex:1 1 130px; min-width:110px; font-size:0.9rem;}
  .custom-name.is-long{flex-basis:100%;}
  .custom-back{
    border:1px solid var(--underline); background:transparent; color:var(--muted);
    font-family:inherit; font-size:0.75rem; font-weight:600;
    padding:6px 8px; border-radius:4px; cursor:pointer; white-space:nowrap;
  }
  .custom-back:hover{border-color:var(--ink); color:var(--ink);}
  .scope-prompt{
    flex-basis:100%; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:8px 0 2px; font-size:0.78rem;
  }
  .scope-text{color:var(--muted); margin-right:auto;}
  .scope-btn{font-size:0.75rem; padding:6px 10px;}

  .task-select{flex:1; min-width:0; font-size:0.9rem;}
  .unit-price{
    font-size:0.78rem; color:var(--muted); white-space:nowrap;
    display:flex; align-items:center; gap:1px;
  }
  .price-input{
    width:3rem; border:none; border-bottom:1px dashed var(--underline);
    background:transparent; font-family:inherit; font-size:0.78rem;
    color:var(--ink); padding:2px 1px; text-align:right;
  }
  .price-input:focus{outline:none; border-bottom:1px solid var(--accent);}
  .each-label{margin-left:3px;}
  .add-task-bar{display:flex; margin-top:10px;}

  .add-room-bar{display:flex; align-items:center; gap:10px; margin-top:16px;}
  .room-picker{max-width:260px;}
  .btn-add{
    background:none; border:1px solid var(--underline); color:var(--ink);
    font-weight:600; font-size:0.85rem; font-family:inherit;
    padding:8px 14px; border-radius:4px; cursor:pointer; white-space:nowrap;
  }
  .btn-add:hover{border-color:var(--ink); background:#f4f2ec;}

  /* ---------- Summary ---------- */
  .divider{border-top:1px solid var(--line); margin:18px 0;}
  .summary-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0; border-bottom:1px solid var(--line); font-size:0.95rem;
  }
  .summary-row span:first-child{color:var(--ink);}
  .summary-row.total{border-bottom:none; border-top:2px solid var(--ink); margin-top:4px; padding-top:12px;}
  .summary-row.total span:first-child{font-weight:700; color:var(--ink); font-size:1rem;}
  .summary-row.total span:last-child{font-size:1.3rem; font-weight:700; color:var(--accent);}

  /* ---------- Actions ---------- */
  /* ---------- Dictation ---------- */
  .dictate-panel{
    border:1px solid var(--underline); border-radius:8px;
    padding:12px; margin-top:8px; background:#fbfaf6;
  }
  .dictate-input{
    width:100%; border:1px solid #d8d8d2; border-radius:6px;
    padding:10px; font-family:inherit; font-size:0.95rem; color:var(--ink);
    background:#fff; resize:vertical; min-height:70px;
  }
  .dictate-input:focus{outline:none; border-color:var(--accent);}
  .dictate-actions{display:flex; gap:8px; margin-top:10px;}
  .dictate-actions button{flex:1; min-height:40px;}
  .dictate-preview{
    margin-top:12px; border-top:1px solid var(--line); padding-top:10px;
  }
  .dictate-line{
    font-size:0.85rem; color:var(--ink); padding:4px 0;
    border-bottom:1px solid var(--line);
  }
  .dictate-line.bad{color:#b23;}
  .dictate-help{
    font-size:0.75rem; color:var(--muted); margin-top:10px; line-height:1.45;
  }

  .signature-line{
    display:flex; align-items:center; gap:10px;
    margin-top:16px; padding-top:12px; border-top:1px solid var(--line);
  }
  .sig-input{
    flex:1; min-width:0; font-size:1rem;
    font-style:italic; color:var(--ink);
  }

  .actions{display:flex; align-items:center; gap:18px; margin-top:22px; flex-wrap:wrap;}
  .btn-primary{
    background:var(--accent); color:#1b1b1b; border:none; font-weight:700;
    padding:11px 20px; border-radius:5px; cursor:pointer; font-size:0.9rem; font-family:inherit;
  }
  .btn-primary:hover{background:#e0a02a;}
  .btn-secondary{
    background:transparent; color:var(--ink);
    border:1px solid var(--accent);
  }
  .btn-secondary:hover{background:#fdf4e2;}
  .btn-text{
    background:none; border:none; color:var(--muted); font-weight:600;
    cursor:pointer; font-size:0.9rem; font-family:inherit;
  }
  .btn-text:hover{color:var(--ink); text-decoration:underline;}

  /* Sized in px on purpose. If the stamp controls scaled with the text size
     setting, the -/+ buttons would move out from under your finger. */
  .stamp-block{
    margin-top:14px; padding-top:12px; border-top:1px solid var(--line);
    display:flex; flex-direction:column;
  }
  .stamp-line{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    padding:7px 0; border-bottom:1px solid var(--line);
  }
  .stamp-line:last-child{border-bottom:none;}
  .st-label{font-size:13px; color:var(--ink); font-weight:600; white-space:nowrap;}
  .st-label-r{margin-left:auto;}
  .st-num{
    -webkit-appearance:none; appearance:none;
    width:44px; min-width:44px; flex:none; height:34px;
    border:1px solid #d8d8d2; border-radius:6px; background:#fff;
    font-family:inherit; font-size:14px; color:var(--ink);
    text-align:center; padding:0; margin:0;
    font-variant-numeric:tabular-nums;
  }
  .st-num:focus{outline:none; border-color:var(--accent);}

  .st-money{
    font-size:12px; font-weight:600; color:var(--ink);
    font-variant-numeric:tabular-nums; white-space:nowrap; margin-right:4px;
  }

  .yn-group{display:flex; flex:none; gap:4px;}
  .yn-btn{
    -webkit-appearance:none; appearance:none;
    border:1px solid #d8d8d2; background:#fff; color:var(--ink);
    font-family:inherit; font-size:13px; font-weight:600;
    width:36px; min-width:36px; flex:none; height:34px;
    padding:0; margin:0; border-radius:6px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .yn-btn:hover{border-color:var(--ink);}
  .yn-btn.active{background:var(--accent); border-color:var(--accent); color:#1b1b1b;}

  .st-select, .st-text{
    padding:6px 8px; font-size:14px; font-family:inherit; height:34px;
    border:1px solid #d8d8d2; border-radius:6px;
    background:#fff; color:var(--ink); min-width:110px; flex:1;
  }
  .st-select:focus, .st-text:focus{outline:none; border-color:var(--accent);}

  .st-select.is-placeholder{color:#9a968c;}
  .terms-split{
    display:inline-flex; align-items:center; gap:3px; flex:none;
    border:1px solid #d8d8d2; border-radius:6px; background:#fff;
    height:34px; padding:0 6px;
  }
  .terms-part{
    -webkit-appearance:none; appearance:none;
    width:30px; min-width:30px; flex:none;
    border:none; background:transparent; color:var(--ink);
    font-family:inherit; font-size:14px; text-align:center;
    padding:2px 0; margin:0; font-variant-numeric:tabular-nums;
    border-bottom:1px dashed #cfcbc1;
  }
  .terms-part:focus{outline:none; border-bottom:1px solid var(--accent);}
  .terms-part::placeholder{color:#8d8a82; opacity:1;}
  .terms-slash{font-size:14px; color:#9a968c;}

  .stepper, .undo-pair{
    display:inline-flex; flex:none; align-items:stretch;
    border:1px solid #d8d8d2; border-radius:6px;
    background:#fff; height:34px;
  }
  .undo-pair{margin-left:auto;}
  .step-btn{
    -webkit-appearance:none; appearance:none;
    width:34px; min-width:34px; flex:none; height:100%;
    border:none; background:transparent; color:var(--ink);
    font-family:inherit; font-size:16px; line-height:1; cursor:pointer;
    padding:0; margin:0; text-align:center;
    display:flex; align-items:center; justify-content:center;
  }
  .stepper .step-btn:first-child, .undo-pair .step-btn:first-child{
    border-radius:5px 0 0 5px;
  }
  .stepper .step-btn:last-child, .undo-pair .step-btn:last-child{
    border-radius:0 5px 5px 0;
  }
  .step-btn:hover{background:#f4f2ec;}
  .step-btn:disabled{color:#c4c0b6; background:#f8f7f3; cursor:default;}
  .step-readout{
    width:34px; min-width:34px; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-variant-numeric:tabular-nums; color:var(--ink);
    border-left:1px solid #e4e1d8; border-right:1px solid #e4e1d8;
  }
  .undo-pair .step-btn:first-child{border-right:1px solid #e4e1d8;}


  /* ---------- Section labels ---------- */
  .block-label, .section-label{
    font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--ink); font-weight:700;
  }
  .block-label{margin:0 0 4px;}
  .block-label + .header-grid{margin-bottom:8px;}
  .header-grid + .block-label{margin-top:16px;}

  /* ---------- Saved estimates ---------- */
  .saved-head{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-bottom:10px;
  }
  .save-row{
    display:flex; gap:8px; margin:8px 0 4px;
  }
  .save-row .btn-add{
    flex:1; min-height:42px; padding:11px 8px; white-space:nowrap;
  }
  .save-row .btn-add:disabled{
    color:#b0aca3; border-color:#e6e3da; background:#faf9f5; cursor:default;
  }
  .save-row .btn-add:disabled:hover{border-color:#e6e3da; background:#faf9f5;}
  .btn-wide{
    display:block; width:100%; margin-top:4px;
    padding:11px 14px; font-size:0.9rem;
  }
  .open-notice{
    font-size:0.8rem; color:var(--accent); font-weight:600;
    padding:2px 0 10px;
  }
  .saved-row{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .saved-row .btn-add{min-height:40px;}
  .btn-delete{
    display:block; width:100%; margin-top:12px;
    border:1px solid #d9b0b0; background:transparent; color:#b23;
    font-family:inherit; font-weight:600; font-size:0.85rem;
    padding:11px 14px; border-radius:4px; cursor:pointer;
  }
  .btn-delete:hover{background:#fbf1f1;}
  .btn-delete.armed{background:#b23; border-color:#b23; color:#fff;}
  .saved-info{flex:1; min-width:0;}
  .saved-name{
    font-weight:600; font-size:0.95rem;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .saved-meta{font-size:0.75rem; color:var(--muted); margin-top:2px;}
  .saved-total{font-weight:600; white-space:nowrap;}
  .saved-empty{font-size:0.85rem; color:var(--muted); padding:4px 0 8px;}
  .saved-detail{
    padding:8px 0 14px; border-bottom:1px solid var(--line);
    font-size:0.82rem;
  }
  .detail-line{
    display:flex; justify-content:space-between; gap:12px;
    color:var(--muted); padding:3px 0; white-space:pre;
  }
  .detail-line span:first-child{overflow:hidden; text-overflow:ellipsis;}
  .detail-room{
    display:flex; justify-content:space-between; gap:12px;
    font-weight:700; color:var(--ink); padding:8px 0 2px;
  }

  @media (max-width:560px){
    .header-grid{grid-template-columns:1fr;}
    .item-row{flex-wrap:wrap;}
    .permit-right{margin-left:0; width:100%; justify-content:space-between;}
  }

  @media print{
    body{background:#fff; padding:0;}
    .sheet{box-shadow:none; max-width:100%;}
    .actions, #addRoomBtn, .remove-row, .foot-note, .stamp-block{display:none !important;}
  }
</style>
</head>
<body>

<div class="sheet">

  <!-- Heading: same letterhead block as the estimating pad -->
  <div class="block-label">Contractor</div>
  <div class="header-grid">
    <input type="text" id="contractorName"  class="field-input" placeholder="Contractor name">
    <input type="tel"  id="contractorPhone" class="field-input" placeholder="Phone number">
  </div>
  <div class="header-grid single">
    <input type="email" id="contractorEmail" class="field-input" placeholder="Email address">
  </div>

  <div class="block-label">Customer</div>
  <div class="header-grid single">
    <input type="text" id="custName" class="field-input" placeholder="Customer name">
  </div>
  <div class="header-grid single">
    <input type="text" id="custStreet" class="field-input" placeholder="Street address &amp; house number">
  </div>
  <div class="header-grid single">
    <input type="text" id="custCityStateZip" class="field-input" placeholder="City, State ZIP">
  </div>
  <div class="stamp-block">
    <div class="stamp-line">
      <span class="st-label">Permit</span>
      <div class="yn-group" id="permitGroup">
        <button type="button" class="yn-btn" data-v="Y">Y</button>
        <button type="button" class="yn-btn" data-v="N">N</button>
      </div>
      <span class="st-money" id="permitMoney">$0.00</span>

      <span class="st-label">3%</span>
      <div class="yn-group" id="threeGroup">
        <button type="button" class="yn-btn" data-v="Y">Y</button>
        <button type="button" class="yn-btn" data-v="N">N</button>
      </div>

      <span class="st-label">FPL</span>
      <div class="yn-group" id="fplGroup">
        <button type="button" class="yn-btn" data-v="Y">Y</button>
        <button type="button" class="yn-btn" data-v="N">N</button>
      </div>

      <span class="st-label">Travel</span>
      <input type="text" inputmode="numeric" id="stTravel" class="st-num" value="" placeholder="0">
      <span class="st-money" id="travelMoney">$0.00</span>

      <input type="hidden" id="stPermit" value="">
      <input type="hidden" id="stFpl" value="">
      <input type="hidden" id="stThree" value="">
    </div>

    <div class="stamp-line">
      <span class="st-label">Terms</span>
      <select id="stTerms" class="st-select">
        <option value=""></option>
        <option>50/50</option>
        <option>25/50/25</option>
        <option value="Other">Other</option>
      </select>
      <span class="terms-split" id="termsSplit" style="display:none">
        <input type="text" inputmode="numeric" id="termsA" class="terms-part" placeholder="0" aria-label="First payment">
        <span class="terms-slash">/</span>
        <input type="text" inputmode="numeric" id="termsB" class="terms-part" placeholder="0" aria-label="Second payment">
        <span class="terms-slash">/</span>
        <input type="text" inputmode="numeric" id="termsC" class="terms-part" placeholder="0" aria-label="Third payment">
      </span>
      <input type="hidden" id="stTermsOther" value="">
    </div>

    <div class="stamp-line">
      <span class="st-label">Size</span>
      <div class="stepper">
        <button type="button" class="step-btn" id="textSmaller" aria-label="Smaller text">&minus;</button>
        <span class="step-readout" id="textLevel">16</span>
        <button type="button" class="step-btn" id="textBigger" aria-label="Bigger text">+</button>
      </div>

      <span class="st-label">Rev</span>
      <div class="stepper">
        <button type="button" class="step-btn" id="revMinus">&minus;</button>
        <span class="step-readout" id="revisionsReadout">0</span>
        <button type="button" class="step-btn" id="revPlus">+</button>
      </div>

      <div class="undo-pair">
        <button type="button" class="step-btn" id="undoBtn" title="Undo" aria-label="Undo">&#8630;</button>
        <button type="button" class="step-btn" id="redoBtn" title="Redo" aria-label="Redo">&#8631;</button>
      </div>
      <input type="hidden" id="stRevisions" value="0">
    </div>
  </div>

  <div class="header-gap"></div>

  <button type="button" id="dictateToggle" class="btn-add btn-wide">Dictate a quote</button>

  <div id="dictatePanel" class="dictate-panel" style="display:none">
    <textarea id="dictateInput" class="dictate-input" rows="3"
      placeholder="Tap the mic and speak. For example: bedroom one, six outlets, four switches, two ceiling fans"></textarea>
    <div class="dictate-actions">
      <button type="button" id="dictateReadBtn" class="btn-add">Read it back</button>
      <button type="button" id="dictateClearBtn" class="btn-add">Clear</button>
    </div>
    <div id="dictatePreview" class="dictate-preview" style="display:none"></div>
    <div id="dictateApplyRow" class="dictate-actions" style="display:none">
      <button type="button" id="dictateApplyBtn" class="btn-primary">Add these</button>
      <button type="button" id="dictateCancelBtn" class="btn-add">Cancel</button>
    </div>
    <div class="dictate-help">
      Say the room, then the items. "Price 225" sets the price of the item
      just before it. Nothing is added until you tap Add these.
    </div>
  </div>

  <div id="roomsContainer"></div>

  <div class="add-room-bar">

<script>
(function(){

  /* ==========================================================================
     LETTERHEAD FIELDS — reused from the estimating pad.
     Formatting runs on "blur"/"change" (when you LEAVE a field), never on
     "input", so it doesn't interrupt voice dictation mid-word.
     ========================================================================== */

  function onFinish(el, formatter) {
    function apply() {
      var before = el.value;
      var after = formatter(before);
      if (after !== before) { el.value = after; }
    }
    el.addEventListener('blur', apply);
    el.addEventListener('change', apply);
  }

  function capitalizeWords(text) {
    return text.replace(/(^|\s)([a-z])/g, function (m, sep, letter) {
      return sep + letter.toUpperCase();
    });
  }

  function capitalizeFirst(text) {
    if (!text.length) { return text; }
    return text.charAt(0).toUpperCase() + text.slice(1);
  }

  function forceCaps(text) {
    return text.replace(/\bsrq\b/gi, 'SRQ').replace(/\bfl\b/gi, 'FL');
  }

  function formatEmail(text) {
    var t = text.trim().toLowerCase();
    t = t.replace(/\s*\b(at sign|at symbol|at)\b\s*/gi, '@');
    t = t.replace(/\s*\b(dot|period|point)\b\s*/gi, '.');
    t = t.replace(/\s*\b(underscore|under score)\b\s*/gi, '_');
    t = t.replace(/\s*\b(dash|hyphen|minus)\b\s*/gi, '-');
    t = t.replace(/\s*\b(plus)\b\s*/gi, '+');
    t = t.replace(/\s*@\s*/g, '@');
    t = t.replace(/\s*\.\s*/g, '.');
    t = t.replace(/\s+/g, '');
    t = t.replace(/[.,;:]+$/, '');
    t = t.replace(/\.{2,}/g, '.').replace(/@{2,}/g, '@');
    return capitalizeFirst(t);
  }

  function formatPhone(text) {
    var digits = text.replace(/\D/g, '');
    if (digits.length === 11 && digits.charAt(0) === '1') { digits = digits.slice(1); }
    digits = digits.slice(0, 10);
    if (digits.length > 6) { return digits.slice(0,3) + '-' + digits.slice(3,6) + '-' + digits.slice(6); }
    if (digits.length > 3) { return digits.slice(0,3) + '-' + digits.slice(3); }
    return digits;
  }

  /* Converts dictated number words into digits — e.g. "one two three" -> "123",
     "twenty three" -> "23", "four oh one" -> "401" — so a house number reads
     as an actual number, not the words that spell it out. */
  function wordsToNumber(text) {
    var ONES = {zero:0, oh:0, one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9};
    var TEENS = {ten:10, eleven:11, twelve:12, thirteen:13, fourteen:14, fifteen:15, sixteen:16, seventeen:17, eighteen:18, nineteen:19};
    var TENS = {twenty:20, thirty:30, forty:40, fifty:50, sixty:60, seventy:70, eighty:80, ninety:90};

    function clean(w) { return w.toLowerCase().replace(/[^a-z]/g, ''); }
    function isNumberWord(w) {
      var c = clean(w);
      return ONES.hasOwnProperty(c) || TEENS.hasOwnProperty(c) || TENS.hasOwnProperty(c) || c === 'hundred';
    }

    var words = text.split(/\s+/);
    var out = [];
    var i = 0;
    while (i < words.length) {
      if (words[i] && isNumberWord(words[i])) {
        var run = [];
        var j = i;
        while (j < words.length && words[j] && isNumberWord(words[j])) {
          run.push(clean(words[j]));
          j++;
        }
        var hasTensOrHundred = run.some(function (w) { return TENS.hasOwnProperty(w) || w === 'hundred'; });
        if (hasTensOrHundred) {
          var runningTotal = 0, current = 0;
          run.forEach(function (w) {
            if (ONES.hasOwnProperty(w)) { current += ONES[w]; }
            else if (TEENS.hasOwnProperty(w)) { current += TEENS[w]; }
            else if (TENS.hasOwnProperty(w)) { current += TENS[w]; }
            else if (w === 'hundred') { current = (current || 1) * 100; runningTotal += current; current = 0; }
          });
          out.push(String(runningTotal + current));
        } else if (run.length === 1) {
          var w0 = run[0];
          out.push(String(ONES.hasOwnProperty(w0) ? ONES[w0] : TEENS[w0]));
        } else {
          out.push(run.map(function (w) {
            return String(ONES.hasOwnProperty(w) ? ONES[w] : TEENS[w]);
          }).join(''));
        }
        i = j;
      } else {
        out.push(words[i]);
        i++;
      }
    }
    return out.join(' ');
  }

  var STATE_NAMES = {
    'alabama':'AL','alaska':'AK','arizona':'AZ','arkansas':'AR','california':'CA',
    'colorado':'CO','connecticut':'CT','delaware':'DE','florida':'FL','georgia':'GA',
    'hawaii':'HI','idaho':'ID','illinois':'IL','indiana':'IN','iowa':'IA','kansas':'KS',
    'kentucky':'KY','louisiana':'LA','maine':'ME','maryland':'MD','massachusetts':'MA',
    'michigan':'MI','minnesota':'MN','mississippi':'MS','missouri':'MO','montana':'MT',
    'nebraska':'NE','nevada':'NV','new hampshire':'NH','new jersey':'NJ','new mexico':'NM',
    'new york':'NY','north carolina':'NC','north dakota':'ND','ohio':'OH','oklahoma':'OK',
    'oregon':'OR','pennsylvania':'PA','rhode island':'RI','south carolina':'SC',
    'south dakota':'SD','tennessee':'TN','texas':'TX','utah':'UT','vermont':'VT',
    'virginia':'VA','washington':'WA','west virginia':'WV','wisconsin':'WI',
    'wyoming':'WY','district of columbia':'DC'
  };

  var STATE_CODES = ['AL','AK','AZ','AR','CA','CO','CT','DE','FL','GA','HI','ID','IL',
    'IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ',
    'NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA',
    'WV','WI','WY','DC'];

  function formatCityStateZip(text) {
    var t = text.trim();
    if (!t) { return t; }
    t = t.replace(/(\d)\s+(?=\d)/g, '$1');
    Object.keys(STATE_NAMES).forEach(function (name) {
      var re = new RegExp('(^|[\\s,])' + name + '(?=[\\s,]|$)', 'i');
      t = t.replace(re, '$1' + STATE_NAMES[name]);
    });
    t = forceCaps(t);
    var m = t.match(/^(.*?)[\s,]+([A-Za-z]{2})[\s,]+(\d{5}(?:-\d{4})?)\s*$/);
    if (m && STATE_CODES.indexOf(m[2].toUpperCase()) !== -1) {
      var cityRaw = m[1].trim();
      // Sarasota always displays as its SRQ shorthand; every other city just
      // gets its first letter (and each word) capitalized as normal.
      var cityOut = /^sarasota$/i.test(cityRaw) ? 'SRQ' : capitalizeWords(cityRaw);
      return cityOut + ', ' + m[2].toUpperCase() + '  ' + m[3];
    }
    return capitalizeFirst(t);
  }

  function advanceOnRightArrow(fromEl, toEl) {
    fromEl.addEventListener('keydown', function (e) {
      var atEnd = fromEl.selectionStart === fromEl.value.length &&
                  fromEl.selectionEnd === fromEl.value.length;
      if (e.key === 'ArrowRight' && atEnd) {
        e.preventDefault();
        toEl.focus();
        var len = toEl.value.length;
        if (typeof toEl.setSelectionRange === 'function') { toEl.setSelectionRange(len, len); }
      }
    });
  }

  function tidyLetterhead() {
    ['contractorName','contractorPhone','contractorEmail','custName','custStreet','custCityStateZip'].forEach(function (id) {
      document.getElementById(id).dispatchEvent(new Event('change'));
    });
  }

  var elName         = document.getElementById('custName');
  var elContractorEmail = document.getElementById('contractorEmail');
  var elStreet       = document.getElementById('custStreet');
  var elCityStateZip = document.getElementById('custCityStateZip');

  var elContractorName  = document.getElementById('contractorName');
  var elContractorPhone = document.getElementById('contractorPhone');

  onFinish(elContractorName,  capitalizeWords);
  onFinish(elContractorPhone, formatPhone);
  onFinish(elContractorEmail, formatEmail);
  advanceOnRightArrow(elContractorName, elContractorPhone);
  advanceOnRightArrow(elContractorPhone, elContractorEmail);
  advanceOnRightArrow(elContractorEmail, elName);

  onFinish(elName,         capitalizeWords);
  onFinish(elStreet,       function (t) { return forceCaps(capitalizeWords(wordsToNumber(t))); });
  onFinish(elCityStateZip, formatCityStateZip);

  advanceOnRightArrow(elName,   elStreet);
  advanceOnRightArrow(elStreet, elCityStateZip);

  /* ==========================================================================
     TRIPS ($90 each) / PERMIT (Yes = $500, No = $0) / SUMMARY
     ========================================================================== */

  var TRIP_RATE = 90;
  var PERMIT_FEE = 500;
  var THREE_PCT = 0.03;

  /* Accepts what people actually type: 1,200 or $1,200.50 or 1200.
     A plain type="number" field rejects a comma outright and reads as empty,
     which is how a priced line could silently come out at zero. */
  function parseMoney(text) {
    if (typeof text !== 'string') { text = String(text == null ? '' : text); }
    var cleaned = text.replace(/[^0-9.\-]/g, '');
    if (cleaned === '' || cleaned === '.' || cleaned === '-') { return NaN; }
    return parseFloat(cleaned);
  }

  function fmt(n) {
    if (isNaN(n)) n = 0;
    return '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  /* Travel days and the Permit toggle live in the stamp block now, so the
     money reads straight from those fields. */
  function travelDays() {
    return parseInt(document.getElementById('stTravel').value, 10) || 0;
  }

  function permitCharged() {
    return document.getElementById('stPermit').value === 'Y';
  }

  function computeTotals() {
    var tripsQty = travelDays();
    var tripsTotal = tripsQty * TRIP_RATE;
    var permitCharge = permitCharged() ? PERMIT_FEE : 0;
    var rooms = roomsTotal();
    var subtotal = tripsTotal + permitCharge + rooms;
    var threePct = threePctApplies() ? subtotal * THREE_PCT : 0;

    return {
      tripsQty: tripsQty,
      tripsTotal: tripsTotal,
      permitCharge: permitCharge,
      rooms: rooms,
      subtotal: subtotal,
      threePct: threePct,
      total: subtotal + threePct
    };
  }

  function updateAll() {
    var t = computeTotals();
    document.getElementById('permitMoney').textContent = fmt(t.permitCharge);
    document.getElementById('travelMoney').textContent = fmt(t.tripsTotal);
    document.getElementById('sumSubtotal').textContent = fmt(t.subtotal);
    document.getElementById('sumThreePct').textContent = fmt(t.threePct);
    document.getElementById('sumTotal').textContent = fmt(t.total);
  }

  updateAll();

  /* ==========================================================================
     ROOMS

     Sorted by FIRST WORD, so every "Primary ..." sits together, every
     "Guest ..." sits together, and so on. Add or rename rooms here.
     ========================================================================== */

  var ROOM_LIST = [

    'Bathroom',
    'Bedroom 1',
    'Bedroom 2',
    'Bedroom 3',
    'Bedroom 4',
    'Den',

  /* ---- Task lists -------------------------------------------------------
     Price is per unit; null means no price set yet, so the line shows
     "price TBD" and adds nothing to the total.
     ---------------------------------------------------------------------- */

  /* Recessed cans - available in EVERY room that has recessed cans. */

    {name:'4" Regressed Style Recessed Can', price:225},
    {name:'4" Flat Recessed Can',            price:215},
    {name:'6" Regressed Style Recessed Can', price:250},
    {name:'6" Flat Recessed Can',            price:215}
  ];

  /* Ceiling fan goes in every room. */
  var CEILING_FAN = {name:'Ceiling Fan', price:350};

  /* Standard interior rooms: bedrooms, baths, living areas, and so on. */
  var STANDARD_TASKS = [
    {name:'Outlet',            price:150},
    {name:'Switch',            price:150},
    {name:'TV Outlet',         price:135},
    {name:'Smoke Detector',    price:145},
    {name:'Smoke/CO Detector', price:185},
    {name:'Cove Lighting',     price:null, type:'length'},

  ].concat(RECESSED_TASKS);

  /* Kitchen only. */
  var KITCHEN_TASKS = [
    {name:'Fridge',                    price:350},
    {name:'Freezer',                   price:350},
    {name:'Microwave',                 price:350},
    {name:'Wine Cooler',               price:350},
    {name:'Small Appliance Circuit',   price:350},

    {name:'Disposal',                  price:350},
    {name:'Countertop Outlets',        price:160},
    {name:'Kitchen Island Outlets',    price:300},

    {name:'Kitchen Peninsula Pop-Up Outlet', price:525},
    {name:'Kitchen Island Microwave',  price:550},
    {name:'Kitchen Island Dishwasher', price:550},
    {name:'Kitchen Island Disposal',   price:550},
    {name:'Outlet',                    price:150},
    {name:'GFI Protected Outlet',      price:160},
    {name:'TV Outlet',                 price:135},
    {name:'Switch',                    price:150},
    {name:'Smoke Detector',            price:145},

    CEILING_FAN
  ].concat(RECESSED_TASKS);

  /* Outdoor and utility spaces: Balcony, Exterior, Garage, Outdoor Kitchen,
     Outdoor Sitting Area, Patio. Note the switch here is $165, not $125. */
  var OUTDOOR_TASKS = [
    {name:'Outlet',               price:150},

  ].concat(RECESSED_TASKS);

  var EV_CHARGER_TASK = {name:'50 Amp EV Charger Outlet', price:650};

  /* Exterior only. */
  var SOFFIT_TASKS = [
    {name:'1" Soffit Recessed Can', price:225},

  /* Garage and Mechanical Closet. A/C lives on the Exterior instead. */
  var GAS_TANKLESS_TASK = {name:'Gas Tankless Water Heater', price:450};

  var MECHANICAL_TASKS = [

  ];

  /* Mechanical Closet only. */
  var LAUNDRY_TASKS = [

  /* 6. Every room gets a dedicated circuit option. */
  var DEDICATED_CIRCUIT_TASK = {name:'Dedicated Circuit', price:450};

  /* The GFI device itself, as opposed to an outlet protected downstream. */
  var GFI_OUTLET_TASK = {name:'GFI Outlet', price:185};

  /* 12. Fireplace: exterior plus the two main living spaces. */
  var FIREPLACE_TASK = {name:'Fireplace', price:450};
  var FIREPLACE_ROOMS = ['Dining Room', 'Exterior', 'Living Room'];

  var AC_TASK = {name:'A/C', price:1350};

  /* Exterior service work. Both the description and the price change every
     time, so it behaves like a custom task rather than a fixed line item. */
  var EXTERIOR_SERVICE_TASK = {
    name: 'Service',
    price: null,

  };

  var PANEL_TASK = {

  };

  /* Mechanical Closet: same outlet, switch and recessed can pricing as a
     standard bedroom, plus the mechanical equipment. */
  var MECHANICAL_ROOM_TASKS = [

    {name:'Switch', price:150},

  ].concat(RECESSED_TASKS).concat(MECHANICAL_TASKS).concat(LAUNDRY_TASKS);

  /* 200 amp services. Each carries a base price plus optional footage that
     gets added on. Conduit is the odd one: it is sold in 10 ft sticks, so one
     foot costs a whole stick and eleven feet costs two. */
  var SERVICE_INCLUDES = ' - (includes meter, disconnect, panel, surge protection, grounding)';

  var BORING_ADDON  = {key:'boring',  label:'Underground boring', rate:18,    per:'foot'};
  var WIRE_ADDON    = {key:'wire',    label:'Wire',               rate:9.70,  per:'foot'};
  var CONDUIT_ADDON = {key:'conduit', label:'Conduit',            rate:28.53, per:'stick', stick:10};

  var AMP200_TASKS = [

      name: '200 Amp Overhead Service' + SERVICE_INCLUDES,

    }
  ];

  /* Charge for one add-on box. Per-foot is straight multiplication; per-stick
     rounds up to the next whole stick. */
  function addonCharge(addon, feet) {
    var f = parseMoney(feet) || 0;
    if (f <= 0) { return 0; }
    if (addon.per === 'stick') {
      return Math.ceil(f / addon.stick) * addon.rate;
    }
    return f * addon.rate;
  }

  var SERVICE_TASKS = [
    CEILING_FAN,
    PANEL_TASK,
    {name:'T-Pole',                   price:3000},
    {name:'Full Service Replacement', price:4500}
  ].concat(AMP200_TASKS).concat(RECESSED_TASKS);

  var TV_OUTLET_TASK = {name:'TV Outlet', price:135};
  var EXTRA_TV_ROOMS = ['Outdoor Kitchen', 'Patio'];

  var OUTDOOR_ROOMS = [
    'Balcony',
    'Outdoor Kitchen',
    'Outdoor Sitting Area',
    'Patio'
  ];

  /* Under cabinet lighting is priced by LENGTH, not by count:
       1 ft ................ $830
       every ft after ...... +$20/ft
       every extra 5 ft .... +$40 (crossing into 6 ft, 11 ft, 16 ft)
       at 10 ft ............ +$50 one time, for the 60W to 96W transformer
     Past 17 ft a second 96W transformer is needed, so the math stops there. */
  var UC_MAX_FEET = 17;
  var UC_BASE_FIRST_FOOT = 830;
  var UC_PER_FOOT = 20;
  var UC_SECTION_FEET = 5;
  var UC_PER_EXTRA_SECTION = 40;
  var UC_TRANSFORMER_UPGRADE = 50;
  var UC_UPGRADE_AT_FEET = 10;

  function underCabinetPrice(feet) {
    var f = Math.ceil(feet);
    if (!f || f <= 0) {
      return {price:0, capped:false, upgraded:false, extraSections:0};
    }

    var capped = false;
    if (f > UC_MAX_FEET) { f = UC_MAX_FEET; capped = true; }

    var price = UC_BASE_FIRST_FOOT + UC_PER_FOOT * (f - 1);

    var extraSections = Math.ceil(f / UC_SECTION_FEET) - 1;
    price += extraSections * UC_PER_EXTRA_SECTION;

    var upgraded = f >= UC_UPGRADE_AT_FEET;
    if (upgraded) { price += UC_TRANSFORMER_UPGRADE; }

    return {
      price: price,
      capped: capped,
      upgraded: upgraded,
      extraSections: extraSections
    };
  }

  var UNDER_CABINET_TASK = {name:'Under Cabinet Lighting', price:null, type:'length'};

  /* Under cabinet lighting goes in every room except the Garage. */
  function withUC(list) { return list.concat([UNDER_CABINET_TASK]); }

  var STANDARD_PLUS_UC   = withUC(STANDARD_TASKS);

      .concat(SOFFIT_TASKS));
  var SERVICE_PLUS_UC    = withUC(SERVICE_TASKS);
  var MECH_ROOM_PLUS_UC  = withUC(MECHANICAL_ROOM_TASKS);

  /* Garage gets the outdoor list plus the EV charger and mechanical gear,
     and is the one room with no under cabinet lighting. */
  var GARAGE_TASKS = OUTDOOR_TASKS.concat([EV_CHARGER_TASK]).concat(MECHANICAL_TASKS);

  /* Laundry Room: a normal interior room plus the washer and dryer. */
  var LAUNDRY_ROOM_TASKS = withUC(STANDARD_TASKS).concat(LAUNDRY_TASKS);

  /* Exterior prices some shared items differently. Cached so each room keeps
     handing back the same object, which is what lets a price change find
     every line using it. */
  var ROOM_PRICE_OVERRIDES = {
    'Exterior': {'Sconce Light': 225, 'GFI Protected Outlet': 225}
  };
  var overrideCache = {};

  function applyPriceOverrides(list, room) {
    var map = ROOM_PRICE_OVERRIDES[room];
    if (!map) { return list; }

    return list.map(function (t) {
      var base = t.name.replace(/\s*\((?:O\/S|Ace Supplied)\)\s*$/, '');
      if (!map.hasOwnProperty(base)) { return t; }
      var key = room + '|' + base;
      if (!overrideCache[key]) {
        var copy = {};
        Object.keys(t).forEach(function (k) { copy[k] = t[k]; });
        copy.price = map[t.name];
        overrideCache[key] = copy;
      }
      return overrideCache[key];
    });
  }

  function baseTasksForRoom(name) {
    if (name === 'Garage')            { return GARAGE_TASKS; }
    if (name === 'Exterior')          { return EXTERIOR_PLUS_UC; }
    if (name === 'Kitchen')           { return KITCHEN_PLUS_UC; }
    if (name === 'Service')           { return SERVICE_PLUS_UC; }
    if (name === 'Mechanical Closet') { return MECH_ROOM_PLUS_UC; }
    if (name === 'Laundry Room')      { return LAUNDRY_ROOM_TASKS; }
    if (name === 'Gym')               { return STANDARD_PLUS_UC; }
    if (name === 'Attic')             { return STANDARD_TASKS; }
    if (name === 'Pool')              { return OUTDOOR_PLUS_UC; }
    if (OUTDOOR_ROOMS.indexOf(name) !== -1) { return OUTDOOR_PLUS_UC; }
    return STANDARD_PLUS_UC;
  }

  /* Occupancy sensor and dimmers, for rooms that have a switch. The outdoor
     spaces are left out of both. */
  var OCCUPANCY_SENSOR_TASK = {name:'Occupancy Sensor', price:185};

  var DIMMER_TASKS = [
    {name:'CL Dimmer',  price:50},
    {name:'ELV Dimmer', price:110}
  ];

  var NO_OCCUPANCY_SENSOR_ROOMS = [];

  /* Rooms that get dimmers even though they carry no Switch line. */
  var EXTRA_DIMMER_ROOMS = [];

  function withSwitchGroup(list, name) {
    if (NO_OCCUPANCY_SENSOR_ROOMS.indexOf(name) !== -1) { return list; }

    var hasSwitch = false;
    for (var i = 0; i < list.length; i++) {
      if (list[i].name === 'Switch') { hasSwitch = true; break; }
    }

    var additions = [];
    if (hasSwitch) { additions.push(OCCUPANCY_SENSOR_TASK); }
    if (hasSwitch || EXTRA_DIMMER_ROOMS.indexOf(name) !== -1) {
      additions = additions.concat(DIMMER_TASKS);
    }

    return additions.length ? list.concat(additions) : list;
  }

  /* Chandeliers and pendants - specific rooms only. */
  var CHANDELIER_TASK = {name:'Chandelier', price:750};

  /* Chandelier goes everywhere except these two. */
  var NO_CHANDELIER_ROOMS = ['Exterior', 'Mechanical Closet'];

  var PENDANT_TASK = {name:'Pendant', price:240};

  var PENDANT_ROOMS = [
    'Den',
    'Gym',
    'Dining Room',
    'Entry',
    'Entry/Foyer',
    'Hallway',
    'Kitchen',
    'Laundry Room',
    'Living Room',
    'Office',
    'Outdoor Sitting Area',
    'Patio',
    'Pool',
    'Powder Bath',
    'Primary Bathroom',
    'Primary Bedroom',
    'Primary Suite',
    'Sitting Room',
    'Sunroom/Florida Room',
    'TV Room'

  var DOORBELL_TASK = {name:'Doorbell', price:300};

  var NO_DOORBELL_ROOMS = [
    'Balcony', 'Exterior', 'Outdoor Kitchen', 'Outdoor Sitting Area', 'Patio', 'Service'
  ];

  var DOORBELL_ROOMS_UNUSED = [
    'Den',
    'Gym',
    'Dining Room',
    'Entry',
    'Entry/Foyer',
    'Hallway',
    'Kitchen',
    'Laundry Room',
    'Living Room',
    'Office',
    'Sitting Room',
    'Sunroom/Florida Room',
