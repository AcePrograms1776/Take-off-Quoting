<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remodel Quote Builder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#1b1b1b;
    --muted:#888;
    --paper:#fdfdfb;
    --page-bg:#1b2a4a;
    --accent:#f2b134;
    --line:#eee;
    --underline:#ccc;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:var(--page-bg);
    color:var(--ink);
    padding:24px 16px;
    display:flex;
    justify-content:center;
  }

  .sheet{
    width:100%; max-width:700px;
    background:var(--paper);
    border-radius:10px;
    padding:24px 26px 30px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
  }

  /* ---------- Letterhead fields (from the estimating pad) ---------- */
  .header-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:8px;}
  .header-grid.single{grid-template-columns:1fr;}

  .field-input{
    border:none; border-bottom:1px solid var(--underline);
    border-radius:0; padding:6px 2px; font-size:1rem; font-family:inherit;
    color:var(--ink); width:100%; background:transparent;
  }
  .field-input:focus{outline:none; border-bottom-color:var(--accent);}

  .header-gap{height:18px;}

  /* ---------- Trips / Permit rows ---------- */
  .item-row{
    display:flex; align-items:center; gap:12px;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .item-label{font-weight:600; min-width:60px; color:var(--ink);}

  .qty-input{width:64px; text-align:right;}

  .item-total{font-weight:600; min-width:80px; text-align:right;}

  .permit-right{display:flex; align-items:center; gap:16px; margin-left:auto;}
  .toggle-group{display:flex; gap:8px;}
  .toggle-btn{
    border:1px solid var(--underline); background:transparent; color:var(--muted);
    padding:7px 18px; border-radius:4px; cursor:pointer; font-weight:600;
    font-size:0.85rem; font-family:inherit;
  }
  .toggle-btn:hover{border-color:var(--ink);}
  .toggle-btn.active{background:var(--accent); color:#1b1b1b; border-color:var(--accent);}

  /* ---------- Rooms ---------- */
  .room-block{
    border:1px solid var(--underline); border-radius:6px;
    padding:12px 14px; margin-top:14px;
  }
  .room-head{
    display:flex; align-items:center; gap:10px;
    padding-bottom:8px; border-bottom:1px solid var(--line);
  }
  .room-name{font-weight:700; font-size:1rem;}
  .room-subtotal{margin-left:auto; font-weight:600;}
  .room-remove{
    background:none; border:none; color:var(--muted); cursor:pointer;
    font-size:15px; padding:2px 4px;
  }
  .room-remove:hover{color:#b23;}
  .room-empty{color:var(--muted); font-size:0.85rem; padding:10px 0 4px;}

  .task-row{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:9px 0; border-bottom:1px solid var(--line);
  }
  .qty-unit{font-size:0.78rem; color:var(--muted);}
  .task-note{
    flex-basis:100%; font-size:0.78rem; color:var(--muted); padding-top:4px;
  }
  .task-note.warn{color:#b23;}
  .task-note:empty{display:none;}
  .task-select{flex:1; min-width:0; font-size:0.9rem;}
  .unit-price{
    font-size:0.78rem; color:var(--muted); white-space:nowrap;
    display:flex; align-items:center; gap:1px;
  }
  .price-input{
    width:44px; border:none; border-bottom:1px dashed var(--underline);
    background:transparent; font-family:inherit; font-size:0.78rem;
    color:var(--ink); padding:2px 1px; text-align:right;
  }
  .price-input:focus{outline:none; border-bottom:1px solid var(--accent);}
  .each-label{margin-left:3px;}
  .add-task-bar{display:flex; margin-top:10px;}

  .add-room-bar{display:flex; align-items:center; gap:10px; margin-top:16px;}
  .room-picker{max-width:260px;}
  .btn-add{
    background:none; border:1px solid var(--underline); color:var(--ink);
    font-weight:600; font-size:0.85rem; font-family:inherit;
    padding:8px 14px; border-radius:4px; cursor:pointer; white-space:nowrap;
  }
  .btn-add:hover{border-color:var(--ink); background:#f4f2ec;}

  /* ---------- Summary ---------- */
  .divider{border-top:1px solid var(--line); margin:18px 0;}
  .summary-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0; border-bottom:1px solid var(--line); font-size:0.95rem;
  }
  .summary-row span:first-child{color:var(--muted);}
  .summary-row.total{border-bottom:none; border-top:2px solid var(--ink); margin-top:4px; padding-top:12px;}
  .summary-row.total span:first-child{font-weight:700; color:var(--ink); font-size:1rem;}
  .summary-row.total span:last-child{font-size:1.3rem; font-weight:700; color:var(--accent);}

  /* ---------- Actions ---------- */
  .actions{display:flex; align-items:center; gap:18px; margin-top:22px; flex-wrap:wrap;}
  .btn-primary{
    background:var(--accent); color:#1b1b1b; border:none; font-weight:700;
    padding:11px 20px; border-radius:5px; cursor:pointer; font-size:0.9rem; font-family:inherit;
  }
  .btn-primary:hover{background:#e0a02a;}
  .btn-text{
    background:none; border:none; color:var(--muted); font-weight:600;
    cursor:pointer; font-size:0.9rem; font-family:inherit;
  }
  .btn-text:hover{color:var(--ink); text-decoration:underline;}

  @media (max-width:560px){
    .header-grid{grid-template-columns:1fr;}
    .item-row{flex-wrap:wrap;}
    .permit-right{margin-left:0; width:100%; justify-content:space-between;}
  }

  @media print{
    body{background:#fff; padding:0;}
    .sheet{box-shadow:none; max-width:100%;}
    .actions{display:none !important;}
  }
</style>
</head>
<body>

<div class="sheet">

  <!-- Heading: same letterhead block as the estimating pad -->
  <div class="header-grid">
    <input type="text"  id="custName"  class="field-input" placeholder="Customer name">
    <input type="email" id="custEmail" class="field-input" placeholder="Email address">
  </div>
  <div class="header-grid">
    <input type="text" id="custStreet" class="field-input" placeholder="Street address &amp; house number">
    <input type="tel"  id="custPhone"  class="field-input" placeholder="Phone number">
  </div>
  <div class="header-grid single">
    <input type="text" id="custCityStateZip" class="field-input" placeholder="City, State ZIP">
  </div>
  <div class="header-gap"></div>

  <div class="item-row">
    <span class="item-label">Trips</span>
    <input type="number" id="tripsQty" class="field-input qty-input" placeholder="0" min="0" step="1">
    <span class="item-total" id="tripsTotal">$0.00</span>
  </div>

  <div class="item-row">
    <span class="item-label">Permit</span>
    <div class="permit-right">
      <div class="toggle-group">
        <button type="button" class="toggle-btn" id="permitYes">Yes</button>
        <button type="button" class="toggle-btn" id="permitNo">No</button>
      </div>
      <span class="item-total" id="permitTotal">$0.00</span>
    </div>
  </div>

  <div id="roomsContainer"></div>

  <div class="add-room-bar">
    <select id="roomPicker" class="field-input room-picker"></select>
    <button type="button" id="addRoomBtn" class="btn-add">+ Add Room</button>
  </div>

  <div class="divider"></div>

  <div class="summary-row">
    <span>Subtotal</span>
    <span id="sumSubtotal">$0.00</span>
  </div>
  <div class="summary-row">
    <span>3% of Subtotal</span>
    <span id="sumThreePct">$0.00</span>
  </div>
  <div class="summary-row total">
    <span>Total</span>
    <span id="sumTotal">$0.00</span>
  </div>

  <div class="actions">
    <button type="button" id="downloadBtn" class="btn-primary">Download PDF</button>
    <button type="button" id="printBtn" class="btn-text">Print</button>
    <button type="button" id="resetBtn" class="btn-text">Reset form</button>
  </div>

</div>

<script>
(function(){

  /* ==========================================================================
     LETTERHEAD FIELDS — reused from the estimating pad.
     Formatting runs on "blur"/"change" (when you LEAVE a field), never on
     "input", so it doesn't interrupt voice dictation mid-word.
     ========================================================================== */

  function onFinish(el, formatter) {
    function apply() {
      var before = el.value;
      var after = formatter(before);
      if (after !== before) { el.value = after; }
    }
    el.addEventListener('blur', apply);
    el.addEventListener('change', apply);
  }

  function capitalizeWords(text) {
    return text.replace(/(^|\s)([a-z])/g, function (m, sep, letter) {
      return sep + letter.toUpperCase();
    });
  }

  function capitalizeFirst(text) {
    if (!text.length) { return text; }
    return text.charAt(0).toUpperCase() + text.slice(1);
  }

  function forceCaps(text) {
    return text.replace(/\bsrq\b/gi, 'SRQ').replace(/\bfl\b/gi, 'FL');
  }

  function formatEmail(text) {
    var t = text.trim().toLowerCase();
    t = t.replace(/\s*\b(at sign|at symbol|at)\b\s*/gi, '@');
    t = t.replace(/\s*\b(dot|period|point)\b\s*/gi, '.');
    t = t.replace(/\s*\b(underscore|under score)\b\s*/gi, '_');
    t = t.replace(/\s*\b(dash|hyphen|minus)\b\s*/gi, '-');
    t = t.replace(/\s*\b(plus)\b\s*/gi, '+');
    t = t.replace(/\s*@\s*/g, '@');
    t = t.replace(/\s*\.\s*/g, '.');
    t = t.replace(/\s+/g, '');
    t = t.replace(/[.,;:]+$/, '');
    t = t.replace(/\.{2,}/g, '.').replace(/@{2,}/g, '@');
    return capitalizeFirst(t);
  }

  function formatPhone(text) {
    var digits = text.replace(/\D/g, '');
    if (digits.length === 11 && digits.charAt(0) === '1') { digits = digits.slice(1); }
    digits = digits.slice(0, 10);
    if (digits.length > 6) { return digits.slice(0,3) + '-' + digits.slice(3,6) + '-' + digits.slice(6); }
    if (digits.length > 3) { return digits.slice(0,3) + '-' + digits.slice(3); }
    return digits;
  }

  /* Converts dictated number words into digits — e.g. "one two three" -> "123",
     "twenty three" -> "23", "four oh one" -> "401" — so a house number reads
     as an actual number, not the words that spell it out. */
  function wordsToNumber(text) {
    var ONES = {zero:0, oh:0, one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9};
    var TEENS = {ten:10, eleven:11, twelve:12, thirteen:13, fourteen:14, fifteen:15, sixteen:16, seventeen:17, eighteen:18, nineteen:19};
    var TENS = {twenty:20, thirty:30, forty:40, fifty:50, sixty:60, seventy:70, eighty:80, ninety:90};

    function clean(w) { return w.toLowerCase().replace(/[^a-z]/g, ''); }
    function isNumberWord(w) {
      var c = clean(w);
      return ONES.hasOwnProperty(c) || TEENS.hasOwnProperty(c) || TENS.hasOwnProperty(c) || c === 'hundred';
    }

    var words = text.split(/\s+/);
    var out = [];
    var i = 0;
    while (i < words.length) {
      if (words[i] && isNumberWord(words[i])) {
        var run = [];
        var j = i;
        while (j < words.length && words[j] && isNumberWord(words[j])) {
          run.push(clean(words[j]));
          j++;
        }
        var hasTensOrHundred = run.some(function (w) { return TENS.hasOwnProperty(w) || w === 'hundred'; });
        if (hasTensOrHundred) {
          var runningTotal = 0, current = 0;
          run.forEach(function (w) {
            if (ONES.hasOwnProperty(w)) { current += ONES[w]; }
            else if (TEENS.hasOwnProperty(w)) { current += TEENS[w]; }
            else if (TENS.hasOwnProperty(w)) { current += TENS[w]; }
            else if (w === 'hundred') { current = (current || 1) * 100; runningTotal += current; current = 0; }
          });
          out.push(String(runningTotal + current));
        } else if (run.length === 1) {
          var w0 = run[0];
          out.push(String(ONES.hasOwnProperty(w0) ? ONES[w0] : TEENS[w0]));
        } else {
          out.push(run.map(function (w) {
            return String(ONES.hasOwnProperty(w) ? ONES[w] : TEENS[w]);
          }).join(''));
        }
        i = j;
      } else {
        out.push(words[i]);
        i++;
      }
    }
    return out.join(' ');
  }

  var STATE_NAMES = {
    'alabama':'AL','alaska':'AK','arizona':'AZ','arkansas':'AR','california':'CA',
    'colorado':'CO','connecticut':'CT','delaware':'DE','florida':'FL','georgia':'GA',
    'hawaii':'HI','idaho':'ID','illinois':'IL','indiana':'IN','iowa':'IA','kansas':'KS',
    'kentucky':'KY','louisiana':'LA','maine':'ME','maryland':'MD','massachusetts':'MA',
    'michigan':'MI','minnesota':'MN','mississippi':'MS','missouri':'MO','montana':'MT',
    'nebraska':'NE','nevada':'NV','new hampshire':'NH','new jersey':'NJ','new mexico':'NM',
    'new york':'NY','north carolina':'NC','north dakota':'ND','ohio':'OH','oklahoma':'OK',
    'oregon':'OR','pennsylvania':'PA','rhode island':'RI','south carolina':'SC',
    'south dakota':'SD','tennessee':'TN','texas':'TX','utah':'UT','vermont':'VT',
    'virginia':'VA','washington':'WA','west virginia':'WV','wisconsin':'WI',
    'wyoming':'WY','district of columbia':'DC'
  };

  var STATE_CODES = ['AL','AK','AZ','AR','CA','CO','CT','DE','FL','GA','HI','ID','IL',
    'IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ',
    'NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA',
    'WV','WI','WY','DC'];

  function formatCityStateZip(text) {
    var t = text.trim();
    if (!t) { return t; }
    t = t.replace(/(\d)\s+(?=\d)/g, '$1');
    Object.keys(STATE_NAMES).forEach(function (name) {
      var re = new RegExp('(^|[\\s,])' + name + '(?=[\\s,]|$)', 'i');
      t = t.replace(re, '$1' + STATE_NAMES[name]);
    });
    t = forceCaps(t);
    var m = t.match(/^(.*?)[\s,]+([A-Za-z]{2})[\s,]+(\d{5}(?:-\d{4})?)\s*$/);
    if (m && STATE_CODES.indexOf(m[2].toUpperCase()) !== -1) {
      var cityRaw = m[1].trim();
      // Sarasota always displays as its SRQ shorthand; every other city just
      // gets its first letter (and each word) capitalized as normal.
      var cityOut = /^sarasota$/i.test(cityRaw) ? 'SRQ' : capitalizeWords(cityRaw);
      return cityOut + ', ' + m[2].toUpperCase() + '  ' + m[3];
    }
    return capitalizeFirst(t);
  }

  function advanceOnRightArrow(fromEl, toEl) {
    fromEl.addEventListener('keydown', function (e) {
      var atEnd = fromEl.selectionStart === fromEl.value.length &&
                  fromEl.selectionEnd === fromEl.value.length;
      if (e.key === 'ArrowRight' && atEnd) {
        e.preventDefault();
        toEl.focus();
        var len = toEl.value.length;
        if (typeof toEl.setSelectionRange === 'function') { toEl.setSelectionRange(len, len); }
      }
    });
  }

  function tidyLetterhead() {
    ['custName','custEmail','custStreet','custPhone','custCityStateZip'].forEach(function (id) {
      document.getElementById(id).dispatchEvent(new Event('change'));
    });
  }

  var elName         = document.getElementById('custName');
  var elEmail        = document.getElementById('custEmail');
  var elStreet       = document.getElementById('custStreet');
  var elPhone        = document.getElementById('custPhone');
  var elCityStateZip = document.getElementById('custCityStateZip');

  onFinish(elName,         capitalizeWords);
  onFinish(elEmail,        formatEmail);
  onFinish(elStreet,       function (t) { return forceCaps(capitalizeWords(wordsToNumber(t))); });
  onFinish(elPhone,        formatPhone);
  onFinish(elCityStateZip, formatCityStateZip);

  advanceOnRightArrow(elName,   elEmail);
  advanceOnRightArrow(elEmail,  elStreet);
  advanceOnRightArrow(elStreet, elPhone);
  advanceOnRightArrow(elPhone,  elCityStateZip);

  /* ==========================================================================
     TRIPS ($90 each) / PERMIT (Yes = $500, No = $0) / SUMMARY
     ========================================================================== */

  var TRIP_RATE = 90;
  var PERMIT_FEE = 500;
  var THREE_PCT = 0.03;
  var permitSelection = null; // 'yes' | 'no' | null

  function fmt(n) {
    if (isNaN(n)) n = 0;
    return '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  var tripsQtyEl = document.getElementById('tripsQty');
  var tripsTotalEl = document.getElementById('tripsTotal');
  var permitTotalEl = document.getElementById('permitTotal');
  var permitYesBtn = document.getElementById('permitYes');
  var permitNoBtn = document.getElementById('permitNo');

  /* Single source of truth for the money. Both the on-screen summary and the
     PDF read from this, so the two can never disagree. */
  function computeTotals() {
    var tripsQty = parseFloat(tripsQtyEl.value) || 0;
    var tripsTotal = tripsQty * TRIP_RATE;
    var permitCharge = permitSelection === 'yes' ? PERMIT_FEE : 0;
    var rooms = roomsTotal();
    var subtotal = tripsTotal + permitCharge + rooms;
    var threePct = subtotal * THREE_PCT;

    return {
      tripsQty: tripsQty,
      tripsTotal: tripsTotal,
      permitCharge: permitCharge,
      rooms: rooms,
      subtotal: subtotal,
      threePct: threePct,
      total: subtotal + threePct
    };
  }

  function updateAll() {
    var t = computeTotals();

    tripsTotalEl.textContent = fmt(t.tripsTotal);
    permitTotalEl.textContent = fmt(t.permitCharge);

    document.getElementById('sumSubtotal').textContent = fmt(t.subtotal);
    document.getElementById('sumThreePct').textContent = fmt(t.threePct);
    document.getElementById('sumTotal').textContent = fmt(t.total);
  }

  function setPermit(value) {
    permitSelection = value;
    permitYesBtn.classList.toggle('active', value === 'yes');
    permitNoBtn.classList.toggle('active', value === 'no');
    updateAll();
  }

  tripsQtyEl.addEventListener('input', updateAll);
  permitYesBtn.addEventListener('click', function () { setPermit('yes'); });
  permitNoBtn.addEventListener('click', function () { setPermit('no'); });

  updateAll();

  /* ==========================================================================
     ROOMS

     Sorted by FIRST WORD, so every "Primary ..." sits together, every
     "Guest ..." sits together, and so on. Add or rename rooms here.
     ========================================================================== */

  var ROOM_LIST = [
    'Balcony',
    'Bedroom 1',
    'Bedroom 2',
    'Bedroom 3',
    'Bedroom 4',
    'Den',
    'Dining Room',
    'Entry',
    'Entry/Foyer',
    'Exterior',
    'Garage',
    'Guest 1 Suite',
    'Guest 2 Suite',
    'Guest 3 Suite',
    'Guest Bath 1',
    'Guest Bath 2',
    'Guest Bath 3',
    'Guest Bath 4',
    'Hallway',
    'Kitchen',
    'Living Room',
    'Mechanical Closet',
    'Office',
    'Outdoor Kitchen',
    'Outdoor Sitting Area',
    'Patio',
    'Powder Bath',
    'Primary Bathroom',
    'Primary Bedroom Closet - Hers',
    'Primary Bedroom Closet - His',
    'Primary Suite',
    'Service',
    'Sitting Room',
    'Sunroom/Florida Room',
    'TV Room'
  ];

  /* ---- Task lists -------------------------------------------------------
     Price is per unit; null means no price set yet, so the line shows
     "price TBD" and adds nothing to the total.
     ---------------------------------------------------------------------- */

  /* Recessed cans - available in EVERY room. */
  var RECESSED_TASKS = [
    {name:'6" Recessed Can',                 price:225},
    {name:'4" Regressed Style Recessed Can', price:225},
    {name:'4" Flat Recessed Can',            price:215},
    {name:'6" Flat Recessed Can',            price:215}
  ];

  /* Ceiling fan goes in every room. */
  var CEILING_FAN = {name:'Ceiling Fan', price:350};

  /* Standard interior rooms: bedrooms, baths, living areas, and so on. */
  var STANDARD_TASKS = [
    {name:'Outlet',            price:135},
    {name:'Switch',            price:125},
    {name:'TV Outlet',         price:135},
    {name:'Smoke Detector',    price:145},
    {name:'Smoke/CO Detector', price:185},
    {name:'Cove Lighting',     price:null},
    CEILING_FAN
  ].concat(RECESSED_TASKS);

  /* Kitchen only. */
  var KITCHEN_TASKS = [
    {name:'Fridge',                    price:350},
    {name:'Freezer',                   price:350},
    {name:'Microwave',                 price:350},
    {name:'Wine Cooler',               price:350},
    {name:'Small Appliance Circuit',   price:350},
    {name:'Vent Hood',                 price:350},
    {name:'Dishwasher',                price:350},
    {name:'Disposal',                  price:350},
    {name:'Countertop Outlets',        price:160},
    {name:'Kitchen Island Receptacles',price:300},
    {name:'Kitchen Island Microwave',  price:550},
    {name:'Kitchen Island Dishwasher', price:550},
    {name:'Kitchen Island Disposal',   price:550},
    {name:'TV Outlet',                 price:135},
    {name:'Switch',                    price:125},
    {name:'Smoke Detector',            price:145},
    {name:'Smoke/CO Detector',         price:185},
    CEILING_FAN
  ].concat(RECESSED_TASKS);

  /* Outdoor and utility spaces: Balcony, Exterior, Garage, Outdoor Kitchen,
     Outdoor Sitting Area, Patio. Note the switch here is $165, not $125. */
  var OUTDOOR_TASKS = [
    {name:'GFI Protected Outlet', price:175},
    {name:'WR GFI Outlet',        price:200},
    {name:'Switch',               price:165},
    CEILING_FAN
  ].concat(RECESSED_TASKS);

  var EV_CHARGER_TASK = {name:'50 Amp EV Charger Outlet', price:650};

  /* Garage and Mechanical Closet. */
  var MECHANICAL_TASKS = [
    {name:'A/H',                     price:1150},
    {name:'Tank Style Water Heater', price:950},
    {name:'A/C',                     price:1350}
  ];

  /* Service. "description" is what prints on the PDF instead of the label. */
  var PANEL_TASK = {
    name: 'Panel',
    price: 3500,
    description: 'Square D QO panel w/ surge protection'
  };

  /* Mechanical Closet: same outlet, switch and recessed can pricing as a
     standard bedroom, plus the mechanical equipment. */
  var MECHANICAL_ROOM_TASKS = [
    {name:'Outlet', price:135},
    {name:'Switch', price:125},
    CEILING_FAN
  ].concat(RECESSED_TASKS).concat(MECHANICAL_TASKS);

  var SERVICE_TASKS = [
    CEILING_FAN,
    PANEL_TASK,
    {name:'T-Pole',                   price:3000},
    {name:'Full Service Replacement', price:4500}
  ].concat(RECESSED_TASKS);

  var OUTDOOR_ROOMS = [
    'Balcony',
    'Outdoor Kitchen',
    'Outdoor Sitting Area',
    'Patio'
  ];

  /* Under cabinet lighting is priced by LENGTH, not by count:
       1 ft ................ $830
       every ft after ...... +$20/ft
       every extra 5 ft .... +$40 (crossing into 6 ft, 11 ft, 16 ft)
       at 10 ft ............ +$50 one time, for the 60W to 96W transformer
     Past 17 ft a second 96W transformer is needed, so the math stops there. */
  var UC_MAX_FEET = 17;
  var UC_BASE_FIRST_FOOT = 830;
  var UC_PER_FOOT = 20;
  var UC_SECTION_FEET = 5;
  var UC_PER_EXTRA_SECTION = 40;
  var UC_TRANSFORMER_UPGRADE = 50;
  var UC_UPGRADE_AT_FEET = 10;

  function underCabinetPrice(feet) {
    var f = Math.ceil(feet);
    if (!f || f <= 0) {
      return {price:0, capped:false, upgraded:false, extraSections:0};
    }

    var capped = false;
    if (f > UC_MAX_FEET) { f = UC_MAX_FEET; capped = true; }

    var price = UC_BASE_FIRST_FOOT + UC_PER_FOOT * (f - 1);

    var extraSections = Math.ceil(f / UC_SECTION_FEET) - 1;
    price += extraSections * UC_PER_EXTRA_SECTION;

    var upgraded = f >= UC_UPGRADE_AT_FEET;
    if (upgraded) { price += UC_TRANSFORMER_UPGRADE; }

    return {
      price: price,
      capped: capped,
      upgraded: upgraded,
      extraSections: extraSections
    };
  }

  var UNDER_CABINET_TASK = {name:'Under Cabinet Lighting', price:null, type:'length'};

  /* Toe kick lighting uses the same by-the-foot pricing as under cabinet. */
  var TOE_LIGHTING_TASK = {name:'Toe Kick Lighting', price:null, type:'length'};

  /* Bathrooms get toe kick lighting in place of under cabinet lighting. */
  var TOE_LIGHTING_ROOMS = [
    'Guest Bath 1',
    'Guest Bath 2',
    'Guest Bath 3',
    'Guest Bath 4',
    'Powder Bath',
    'Primary Bathroom'
  ];

  /* Tasks pulled out of specific rooms. */
  var ALL_RECESSED_NAMES = RECESSED_TASKS.map(function (t) { return t.name; });

  var ROOM_REMOVALS = {
    'Balcony':                        ['Under Cabinet Lighting'],
    'Bedroom 1':                      ['Under Cabinet Lighting'],
    'Bedroom 2':                      ['Under Cabinet Lighting'],
    'Bedroom 3':                      ['Under Cabinet Lighting'],
    'Bedroom 4':                      ['Under Cabinet Lighting'],
    'Exterior':                       ['Under Cabinet Lighting'],
    'Guest 1 Suite':                  ['Under Cabinet Lighting'],
    'Guest 2 Suite':                  ['Under Cabinet Lighting'],
    'Guest 3 Suite':                  ['Under Cabinet Lighting'],
    'Hallway':                        ['Under Cabinet Lighting'],
    'Mechanical Closet':              ['Under Cabinet Lighting'],
    'Primary Bedroom Closet - Hers':  ['Under Cabinet Lighting', 'Cove Lighting'],
    'Primary Bedroom Closet - His':   ['Under Cabinet Lighting', 'Cove Lighting'],
    'Service':                        ['Under Cabinet Lighting', 'Ceiling Fan'].concat(ALL_RECESSED_NAMES)
  };

  /* Under cabinet lighting goes in every room except the Garage. */
  function withUC(list) { return list.concat([UNDER_CABINET_TASK]); }

  var STANDARD_PLUS_UC   = withUC(STANDARD_TASKS);
  var KITCHEN_PLUS_UC    = withUC(KITCHEN_TASKS);
  var OUTDOOR_PLUS_UC    = withUC(OUTDOOR_TASKS);
  var EXTERIOR_PLUS_UC   = withUC(OUTDOOR_TASKS.concat([EV_CHARGER_TASK]));
  var SERVICE_PLUS_UC    = withUC(SERVICE_TASKS);
  var MECH_ROOM_PLUS_UC  = withUC(MECHANICAL_ROOM_TASKS);

  /* Garage gets the outdoor list plus the EV charger and mechanical gear,
     and is the one room with no under cabinet lighting. */
  var GARAGE_TASKS = OUTDOOR_TASKS.concat([EV_CHARGER_TASK]).concat(MECHANICAL_TASKS);

  function baseTasksForRoom(name) {
    if (name === 'Garage')            { return GARAGE_TASKS; }
    if (name === 'Exterior')          { return EXTERIOR_PLUS_UC; }
    if (name === 'Kitchen')           { return KITCHEN_PLUS_UC; }
    if (name === 'Service')           { return SERVICE_PLUS_UC; }
    if (name === 'Mechanical Closet') { return MECH_ROOM_PLUS_UC; }
    if (OUTDOOR_ROOMS.indexOf(name) !== -1) { return OUTDOOR_PLUS_UC; }
    return STANDARD_PLUS_UC;
  }

  /* Occupancy sensor and dimmers, for rooms that have a switch. The outdoor
     spaces are left out of both. */
  var OCCUPANCY_SENSOR_TASK = {name:'Occupancy Sensor', price:185};

  var DIMMER_TASKS = [
    {name:'CL Dimmer',  price:50},
    {name:'ELV Dimmer', price:110}
  ];

  var NO_OCCUPANCY_SENSOR_ROOMS = [
    'Balcony',
    'Exterior',
    'Outdoor Kitchen',
    'Outdoor Sitting Area',
    'Patio'
  ];

  /* Rooms that get dimmers even though they carry no Switch line. */
  var EXTRA_DIMMER_ROOMS = [];

  function withSwitchGroup(list, name) {
    if (NO_OCCUPANCY_SENSOR_ROOMS.indexOf(name) !== -1) { return list; }

    var hasSwitch = false;
    for (var i = 0; i < list.length; i++) {
      if (list[i].name === 'Switch') { hasSwitch = true; break; }
    }

    var additions = [];
    if (hasSwitch) { additions.push(OCCUPANCY_SENSOR_TASK); }
    if (hasSwitch || EXTRA_DIMMER_ROOMS.indexOf(name) !== -1) {
      additions = additions.concat(DIMMER_TASKS);
    }

    return additions.length ? list.concat(additions) : list;
  }

  /* Bathrooms - also the rooms that get toe kick lighting. */
  var BATHROOM_ROOMS = [
    'Guest Bath 1',
    'Guest Bath 2',
    'Guest Bath 3',
    'Guest Bath 4',
    'Powder Bath',
    'Primary Bathroom'
  ];

  var EXHAUST_FAN_TASKS = [
    {name:'Exhaust Fan (Fan Only)', price:375},
    {name:'Exhaust Fan w/Light',    price:415}
  ];

  /* Sconce lights go in every room except these. */
  var SCONCE_TASK = {name:'Sconce Light', price:200};

  var NO_SCONCE_ROOMS = [
    'Garage',
    'Mechanical Closet',
    'Primary Bedroom Closet - Hers',
    'Primary Bedroom Closet - His'
  ];

  function tasksForRoom(name) {
    var list = baseTasksForRoom(name);

    var removals = ROOM_REMOVALS[name];
    if (removals) {
      list = list.filter(function (t) { return removals.indexOf(t.name) === -1; });
    }

    if (TOE_LIGHTING_ROOMS.indexOf(name) !== -1) {
      list = list.map(function (t) {
        return t.name === 'Under Cabinet Lighting' ? TOE_LIGHTING_TASK : t;
      });
    }

    list = withSwitchGroup(list, name);

    if (BATHROOM_ROOMS.indexOf(name) !== -1) {
      list = list.concat(EXHAUST_FAN_TASKS);
    }

    if (NO_SCONCE_ROOMS.indexOf(name) === -1) {
      list = list.concat([SCONCE_TASK]);
    }

    /* Alphabetical. "numeric" keeps 4" and 6" cans in size order rather than
       splitting them around 50 Amp. */
    return list.slice().sort(function (a, b) {
      return a.name.localeCompare(b.name, 'en', {numeric:true, sensitivity:'base'});
    });
  }

  var roomsContainer = document.getElementById('roomsContainer');
  var roomPicker = document.getElementById('roomPicker');

  ROOM_LIST.forEach(function (room) {
    var opt = document.createElement('option');
    opt.value = room;
    opt.textContent = room;
    roomPicker.appendChild(opt);
  });

  function addRoom(name) {
    var block = document.createElement('div');
    block.className = 'room-block';

    var head = document.createElement('div');
    head.className = 'room-head';

    var title = document.createElement('span');
    title.className = 'room-name';
    title.textContent = name;

    var sub = document.createElement('span');
    sub.className = 'room-subtotal';
    sub.textContent = fmt(0);

    var removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'room-remove';
    removeBtn.setAttribute('aria-label', 'Remove ' + name);
    removeBtn.innerHTML = '&#10005;';
    removeBtn.addEventListener('click', function () {
      block.remove();
      updateAll();
    });

    head.appendChild(title);
    head.appendChild(sub);
    head.appendChild(removeBtn);
    block.appendChild(head);

    var taskArea = document.createElement('div');
    taskArea.className = 'task-area';
    block.appendChild(taskArea);

    var roomTasks = tasksForRoom(name);

    var bar = document.createElement('div');
    bar.className = 'add-task-bar';

    var addTaskBtn = document.createElement('button');
    addTaskBtn.type = 'button';
    addTaskBtn.className = 'btn-add';
    addTaskBtn.textContent = '+ Add Task';
    addTaskBtn.addEventListener('click', function () {
      addTask(block, taskArea, roomTasks);
    });

    bar.appendChild(addTaskBtn);
    block.appendChild(bar);

    block.dataset.roomTotal = '0';
    roomsContainer.appendChild(block);
    updateAll();
  }

  document.getElementById('addRoomBtn').addEventListener('click', function () {
    addRoom(roomPicker.value);
  });

  function addTask(block, taskArea, taskList) {
    var row = document.createElement('div');
    row.className = 'task-row';
    row.dataset.taskTotal = '0';

    var picker = document.createElement('select');
    picker.className = 'field-input task-select';
    taskList.forEach(function (t, i) {
      var opt = document.createElement('option');
      opt.value = String(i);
      opt.textContent = t.name;
      picker.appendChild(opt);
    });

    var qty = document.createElement('input');
    qty.type = 'number';
    qty.className = 'field-input qty-input';
    qty.placeholder = '0';
    qty.min = '0';
    qty.step = '1';

    var qtyUnit = document.createElement('span');
    qtyUnit.className = 'qty-unit';

    var priceWrap = document.createElement('span');
    priceWrap.className = 'unit-price';

    var priceInput = document.createElement('input');
    priceInput.type = 'number';
    priceInput.className = 'price-input';
    priceInput.min = '0';
    priceInput.step = '1';
    priceInput.placeholder = '0';
    priceInput.setAttribute('aria-label', 'Price each');

    var eachLabel = document.createElement('span');
    eachLabel.className = 'each-label';
    eachLabel.textContent = 'each';

    priceWrap.appendChild(document.createTextNode('$'));
    priceWrap.appendChild(priceInput);
    priceWrap.appendChild(eachLabel);

    var total = document.createElement('span');
    total.className = 'item-total';

    var removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'room-remove';
    removeBtn.setAttribute('aria-label', 'Remove task');
    removeBtn.innerHTML = '&#10005;';
    removeBtn.addEventListener('click', function () {
      row.remove();
      recalcRoom(block);
    });

    var noteEl = document.createElement('div');
    noteEl.className = 'task-note';

    /* Recalculates this line from whatever price is currently in the box,
       so a one-off override only affects this line, not the saved price.
       Length-priced tasks use their own table instead. */
    function recalcTask() {
      var task = taskList[parseInt(picker.value, 10)];
      row.dataset.printName = task.description || task.name;

      if (task.type === 'length') {
        var feet = parseFloat(qty.value) || 0;
        var result = underCabinetPrice(feet);
        row.dataset.printQty = feet ? feet + ' ft' : '';
        row.dataset.taskTotal = String(result.price);
        total.textContent = fmt(result.price);

        if (result.capped) {
          noteEl.className = 'task-note warn';
          noteEl.textContent = 'Over ' + UC_MAX_FEET + ' ft needs a second 96W transformer - price this run by hand.';
        } else {
          var bits = [];
          if (result.extraSections > 0) {
            bits.push(result.extraSections + ' extra ' + UC_SECTION_FEET + ' ft section' +
              (result.extraSections > 1 ? 's' : '') + ' at ' + fmt(UC_PER_EXTRA_SECTION));
          }
          if (result.upgraded) {
            bits.push(fmt(UC_TRANSFORMER_UPGRADE) + ' for the 96W transformer');
          }
          noteEl.className = 'task-note';
          noteEl.textContent = bits.length ? 'Includes ' + bits.join(' + ') : '';
        }
      } else {
        var price = parseFloat(priceInput.value);
        var n = parseFloat(qty.value) || 0;
        row.dataset.printQty = n ? String(n) : '';
        if (isNaN(price)) {
          row.dataset.taskTotal = '0';
          total.textContent = fmt(0);
        } else {
          var lineTotal = n * price;
          row.dataset.taskTotal = String(lineTotal);
          total.textContent = fmt(lineTotal);
        }
        noteEl.className = 'task-note';
        noteEl.textContent = '';
      }
      recalcRoom(block);
    }

    /* Switching the task resets the price box back to that task's set price,
       and swaps the row between "per each" and "per foot" mode. */
    function loadTaskPrice() {
      var task = taskList[parseInt(picker.value, 10)];
      var isLength = task.type === 'length';

      priceWrap.style.display = isLength ? 'none' : 'flex';
      qtyUnit.textContent = isLength ? 'ft' : '';
      qty.setAttribute('aria-label', isLength ? 'Length in feet' : 'Quantity');

      if (!isLength) {
        priceInput.value = task.price === null ? '' : task.price;
      }
      recalcTask();
    }

    picker.addEventListener('change', loadTaskPrice);
    priceInput.addEventListener('input', recalcTask);
    qty.addEventListener('input', recalcTask);

    row.appendChild(picker);
    row.appendChild(qty);
    row.appendChild(qtyUnit);
    row.appendChild(priceWrap);
    row.appendChild(total);
    row.appendChild(removeBtn);
    row.appendChild(noteEl);
    taskArea.appendChild(row);
    loadTaskPrice();
  }

  function recalcRoom(block) {
    var sum = 0;
    block.querySelectorAll('.task-row').forEach(function (r) {
      sum += parseFloat(r.dataset.taskTotal) || 0;
    });
    block.dataset.roomTotal = String(sum);
    block.querySelector('.room-subtotal').textContent = fmt(sum);
    updateAll();
  }

  function roomsTotal() {
    if (!roomsContainer) { return 0; }
    var sum = 0;
    roomsContainer.querySelectorAll('.room-block').forEach(function (b) {
      sum += parseFloat(b.dataset.roomTotal) || 0;
    });
    return sum;
  }

  /* ==========================================================================
     PDF GENERATION
     ========================================================================== */

  document.getElementById('downloadBtn').addEventListener('click', function () {
    tidyLetterhead();

    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({unit:'pt', format:'letter'});
    var marginX = 40;
    var y = 50;

    var custName = elName.value;
    var custEmail = elEmail.value;
    var custStreet = elStreet.value;
    var custPhone = elPhone.value;
    var custCityStateZip = elCityStateZip.value;

    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    if (custName) { doc.text(custName, marginX, y); y += 14; }
    if (custStreet) { doc.text(custStreet, marginX, y); y += 14; }
    if (custCityStateZip) { doc.text(custCityStateZip, marginX, y); y += 14; }
    if (custPhone) { doc.text(custPhone, marginX, y); y += 14; }
    if (custEmail) { doc.text(custEmail, marginX, y); y += 14; }
    y += 16;

    var t = computeTotals();

    doc.text('Trips: ' + t.tripsQty + ' x ' + fmt(TRIP_RATE) + ' = ' + fmt(t.tripsTotal), marginX, y);
    y += 16;

    var permitLabel = permitSelection === 'yes' ? 'Yes' : (permitSelection === 'no' ? 'No' : 'Not selected');
    doc.text('Permit: ' + permitLabel + ' - ' + fmt(t.permitCharge), marginX, y);
    y += 24;

    var pageBottom = doc.internal.pageSize.getHeight() - 60;
    function newPageIfNeeded(needed) {
      if (y + (needed || 0) > pageBottom) {
        doc.addPage();
        y = 50;
      }
    }

    var pageRight = doc.internal.pageSize.getWidth() - marginX;

    roomsContainer.querySelectorAll('.room-block').forEach(function (b) {
      var rows = b.querySelectorAll('.task-row');
      if (!rows.length) { return; }

      newPageIfNeeded(40);
      doc.setFont('helvetica', 'bold');
      doc.text(b.querySelector('.room-name').textContent, marginX, y);
      doc.text(fmt(parseFloat(b.dataset.roomTotal) || 0), pageRight, y, {align:'right'});
      doc.setFont('helvetica', 'normal');
      y += 15;

      rows.forEach(function (r) {
        newPageIfNeeded(0);
        var qtyText = r.dataset.printQty ? r.dataset.printQty + '  x  ' : '';
        doc.text('   ' + qtyText + (r.dataset.printName || ''), marginX, y);
        doc.text(fmt(parseFloat(r.dataset.taskTotal) || 0), pageRight, y, {align:'right'});
        y += 14;
      });
      y += 10;
    });

    newPageIfNeeded(80);

    doc.text('Subtotal: ' + fmt(t.subtotal), marginX, y);
    y += 16;
    doc.text('3% of Subtotal: ' + fmt(t.threePct), marginX, y);
    y += 20;
    doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text('Total: ' + fmt(t.total), marginX, y);

    var safeClient = (custName || 'quote').replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g,'');
    doc.save(safeClient + '.pdf');
  });

  document.getElementById('printBtn').addEventListener('click', function () {
    tidyLetterhead();
    window.print();
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    if (confirm('Clear all fields and start over?')) { location.reload(); }
  });

})();
</script>

</body>
