  /* Bathrooms - also the rooms that get toe kick lighting. */
  var BATHROOM_ROOMS = [
    'Bathroom',
    'Office Bath',
    'Guest Bath 1',
    'Guest Bath 2',
    'Guest Bath 3',
    'Guest Bath 4',
    'Powder Bath',
    'Primary Bathroom'
  ];

  var EXHAUST_FAN_TASKS = [
    {name:'Exhaust Fan (Fan Only)', price:375},
    {name:'Exhaust Fan w/Light',    price:415}
  ];

  /* Bathroom GFI is $160. The outdoor one is $175. */
  var BATHROOM_GFI_TASK = {name:'GFI Protected Outlet', price:160};

  /* Smoke detectors do not belong in a bathroom. */
  var BATHROOM_REMOVALS = ['Smoke Detector', 'Smoke/CO Detector'];

  /* Sconce lights go in every room except these. */
  var SCONCE_TASK = {name:'Sconce Light', price:200};

  var NO_SCONCE_ROOMS = [
    'Garage',
    'Mechanical Closet',
    'Primary Bedroom Closet - Hers',
    'Primary Bedroom Closet - His',
    'Service'
  ];

  /* Attic. */
  var ATTIC_LIGHT_TASK = {name:'Attic Light', price:150};

  /* Pool and Exterior share these. */
  var POOL_TASKS = [
    {name:'Pool/Spa Equipment, Panel and Pipe Only, No Wiring', price:1200},
    {name:'Pool Bonding',                                       price:1500}
  ];
  var POOL_ROOMS = ['Exterior', 'Pool'];

  /* Low voltage drops, every room, all the same price. */
  var LOW_VOLTAGE_TASKS = [
    {name:'Low Voltage Drop',      price:200},
    {name:'Shade Wiring Drop',     price:200},
    {name:'Speaker Drop',          price:200},
    {name:'Camera Drop',           price:200},
    {name:'TV Drop',               price:200},
    {name:'Cat6 Drop',             price:200},
    {name:'Coax Drop',             price:200},
    {name:'Tape Light Drop',       price:200},
    {name:'Recessed Can Drop',     price:200}
  ];

  /* Floodlights on anything outside. */
  var FLOODLIGHT_TASKS = [
    {name:'Motion Floodlight', price:450},
    {name:'Floodlight',        price:450}
  ];
  var FLOODLIGHT_ROOMS = [
    'Balcony', 'Exterior', 'Outdoor Kitchen', 'Outdoor Sitting Area', 'Patio', 'Pool'
  ];

  /* Panel and wrap fixtures, every room. */
  var PANEL_LIGHT_TASKS = [
    {name:'4\' x 6" LED Flat Panel Light', price:450},
    {name:'4\' LED Wrap',                  price:325}
  ];

  /* Trim swap, every room. */
  var RETROFIT_TRIM_TASK = {name:'Retrofit Recessed Can Trim Replacement', price:105};

  /* Cooktops, both kitchens, priced to match the oven. */
  var COOKTOP_TASKS = [
    {name:'Cooktop',               price:1350},
    {name:'Kitchen Island Cooktop', price:1350}
  ];
  var COOKTOP_ROOMS = ['Kitchen', 'Outdoor Kitchen'];

  /* Emergency lighting goes in every room, no exceptions. */
  var EMERGENCY_TASKS = [
    {name:'Emergency Light',              price:160},
    {name:'Exit Sign',                    price:190},
    {name:'Exit Sign w/Emergency Light',  price:190}
  ];

  /* Sits at the top of every task dropdown, for anything not on the list. */
  var CUSTOM_TASK = {name:'Custom task...', price:null, custom:true};

  function tasksForRoom(name) {
    var list = baseTasksForRoom(name);

    var removals = ROOM_REMOVALS[name];
    if (removals) {
      list = list.filter(function (t) { return removals.indexOf(t.name) === -1; });
    }

    if (TOE_LIGHTING_ROOMS.indexOf(name) !== -1) {
      /* Compare by identity, not by name. Names carry a supplier label now,
         so a string comparison here would silently stop matching. */
      list = list.map(function (t) {
        return t === UNDER_CABINET_TASK ? TOE_LIGHTING_TASK : t;
      });
    }

    list = withSwitchGroup(list, name);

    if (EXTRA_TV_ROOMS.indexOf(name) !== -1) {
      list = list.concat([TV_OUTLET_TASK]);
    }

    if (BATHROOM_ROOMS.indexOf(name) !== -1) {
      list = list.filter(function (t) {
        return BATHROOM_REMOVALS.indexOf(t.name) === -1;
      });
      list = list.concat(EXHAUST_FAN_TASKS)
                 .concat([BATHROOM_GFI_TASK, UNDER_CABINET_TASK, PENDANT_TASK]);
    }

    if (NO_SCONCE_ROOMS.indexOf(name) === -1) {
      list = list.concat([SCONCE_TASK]);
    }

    if (NO_CHANDELIER_ROOMS.indexOf(name) === -1) {
      list = list.concat([CHANDELIER_TASK]);
    }

    if (PENDANT_ROOMS.indexOf(name) !== -1) {
      list = list.concat([PENDANT_TASK]);
    }

    if (NO_DOORBELL_ROOMS.indexOf(name) === -1) {
      list = list.concat([DOORBELL_TASK]);
    }

    list = list.concat(EMERGENCY_TASKS)
               .concat([DEDICATED_CIRCUIT_TASK, RETROFIT_TRIM_TASK, GFI_OUTLET_TASK])
               .concat(LOW_VOLTAGE_TASKS)
               .concat(PANEL_LIGHT_TASKS);

    if (name === 'Attic') { list = list.concat([ATTIC_LIGHT_TASK]); }
    if (POOL_ROOMS.indexOf(name) !== -1) { list = list.concat(POOL_TASKS); }
    if (FLOODLIGHT_ROOMS.indexOf(name) !== -1) { list = list.concat(FLOODLIGHT_TASKS); }
    if (COOKTOP_ROOMS.indexOf(name) !== -1) { list = list.concat(COOKTOP_TASKS); }

    /* A task can legitimately be added by more than one rule, so drop repeats
       by name and keep the first, which is the one with the room's price. */
    var seenNames = {};
    list = list.filter(function (t) {
      if (seenNames[t.name]) { return false; }
      seenNames[t.name] = true;
      return true;
    });

    if (FIREPLACE_ROOMS.indexOf(name) !== -1) {
      list = list.concat([FIREPLACE_TASK]);
    }

    list = applyPriceOverrides(list, name);

    /* Alphabetical. "numeric" keeps 4" and 6" cans in size order rather than
       splitting them around 50 Amp. Custom task is pinned to the top. */
    var sorted = list.slice().sort(function (a, b) {
      return a.name.localeCompare(b.name, 'en', {numeric:true, sensitivity:'base'});
    });
    return [CUSTOM_TASK].concat(sorted);
  }

  /* Every distinct task object in the tool. The same task can exist as more
     than one object (Outlet is defined separately for the Mechanical Closet),
     so "change everywhere" has to walk this rather than one array. */
  var ALL_TASK_OBJECTS = (function () {
    var seen = [];
    ROOM_LIST.forEach(function (r) {
      tasksForRoom(r).forEach(function (t) {
        if (seen.indexOf(t) === -1) { seen.push(t); }
      });
    });
    return seen;
  })();

  /* ==========================================================================
     WHO SUPPLIES THE FIXTURE

     The label is appended in brackets so it prints on the quote, and because
     keyWords strips bracketed text the dictation matcher never has to hear it.
     ========================================================================== */

  var OWNER_SUPPLIED = ['Chandelier', 'Pendant', 'Sconce Light', 'Ceiling Fan'];

  var ACE_SUPPLIED = [
    '4" Flat Recessed Can', '4" Regressed Style Recessed Can',
    '6" Flat Recessed Can', '6" Regressed Style Recessed Can',
    '1" Soffit Recessed Can', '2" Soffit Recessed Can',
    'Retrofit Recessed Can Trim Replacement',
    '4\' x 6" LED Flat Panel Light', '4\' LED Wrap',
    'Floodlight', 'Motion Floodlight', 'Attic Light',
    'Exhaust Fan (Fan Only)', 'Exhaust Fan w/Light',
    'Cove Lighting', 'Toe Kick Lighting', 'Under Cabinet Lighting',
    'Emergency Light', 'Exit Sign', 'Exit Sign w/Emergency Light'
  ];

  ALL_TASK_OBJECTS.forEach(function (t) {
    if (OWNER_SUPPLIED.indexOf(t.name) !== -1) {
      t.name += ' (O/S)';
    } else if (ACE_SUPPLIED.indexOf(t.name) !== -1) {
      t.name += ' (Ace Supplied)';
    }
  });

  var roomsContainer = document.getElementById('roomsContainer');
  var roomPicker = document.getElementById('roomPicker');

  ROOM_LIST.forEach(function (room) {
    var opt = document.createElement('option');
    opt.value = room;
    opt.textContent = room;
    roomPicker.appendChild(opt);
  });

  function addRoom(name) {
    var block = document.createElement('div');
    block.className = 'room-block';

    var head = document.createElement('div');
    head.className = 'room-head';

    var title = document.createElement('input');
    title.type = 'text';
    title.className = 'room-name';
    title.value = name;
    title.setAttribute('aria-label', 'Room name');
    title.addEventListener('blur', function () {
      if (!title.value.trim()) { title.value = name; }
    });

    var sub = document.createElement('span');
    sub.className = 'room-subtotal';
    sub.textContent = fmt(0);

    var removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'room-remove';
    removeBtn.setAttribute('aria-label', 'Remove ' + name);
    removeBtn.innerHTML = '&#10005;';
    removeBtn.addEventListener('click', function () {
      block.remove();
      updateAll();
    });

    head.appendChild(title);
    head.appendChild(sub);
    head.appendChild(removeBtn);
    block.appendChild(head);

    var taskArea = document.createElement('div');
    taskArea.className = 'task-area';
    block.appendChild(taskArea);

    var roomTasks = tasksForRoom(name);

    var bar = document.createElement('div');
    bar.className = 'add-task-bar';

    var addTaskBtn = document.createElement('button');
    addTaskBtn.type = 'button';
    addTaskBtn.className = 'btn-add';
    addTaskBtn.textContent = '+ Add Task';
    addTaskBtn.addEventListener('click', function () {
      addTask(block, taskArea, roomTasks);
    });

    bar.appendChild(addTaskBtn);
    block.appendChild(bar);

    block.dataset.roomTotal = '0';
    block.dataset.roomType = name;
    roomsContainer.appendChild(block);
    updateAll();
    return block;
  }

  document.getElementById('addRoomBtn').addEventListener('click', function () {
    addRoom(roomPicker.value);
  });

  function addTask(block, taskArea, taskList) {
    var row = document.createElement('div');
    row.className = 'task-row';
    row.dataset.taskTotal = '0';

    var picker = document.createElement('select');
    picker.className = 'field-input task-select';
    taskList.forEach(function (t, i) {
      var opt = document.createElement('option');
      opt.value = String(i);
      opt.textContent = t.name;
      picker.appendChild(opt);
    });

    var customName = document.createElement('input');
    customName.type = 'text';
    customName.className = 'field-input custom-name';
    customName.placeholder = 'Name this task';
    customName.style.display = 'none';
    customName.setAttribute('aria-label', 'Custom task name');

    var customBack = document.createElement('button');
    customBack.type = 'button';
    customBack.className = 'custom-back';
    customBack.textContent = 'List';
    customBack.style.display = 'none';
    customBack.setAttribute('aria-label', 'Back to the task list');
    customBack.addEventListener('click', function () {
      picker.selectedIndex = taskList.length > 1 ? 1 : 0;
      customName.value = '';
      loadTaskPrice();
    });

    var qty = document.createElement('input');
    qty.type = 'text';
    qty.setAttribute('inputmode', 'decimal');
    qty.className = 'field-input qty-input';
    qty.placeholder = '0';

    var qtyUnit = document.createElement('span');
    qtyUnit.className = 'qty-unit';

    var priceWrap = document.createElement('span');
    priceWrap.className = 'unit-price';

    var priceInput = document.createElement('input');
    priceInput.type = 'text';
    priceInput.setAttribute('inputmode', 'decimal');
    priceInput.className = 'price-input';
    priceInput.placeholder = '0';
    priceInput.setAttribute('aria-label', 'Price each');

    var eachLabel = document.createElement('span');
    eachLabel.className = 'each-label';
    eachLabel.textContent = 'each';

    priceWrap.appendChild(document.createTextNode('$'));
    priceWrap.appendChild(priceInput);
    priceWrap.appendChild(eachLabel);

    var total = document.createElement('span');
    total.className = 'item-total';

    var removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'room-remove';
    removeBtn.setAttribute('aria-label', 'Remove task');
    removeBtn.innerHTML = '&#10005;';
    removeBtn.addEventListener('click', function () {
      row.remove();
      recalcRoom(block);
    });

    var noteEl = document.createElement('div');
    noteEl.className = 'task-note';

    /* Shown only when a price is typed that differs from the set price. */
    var scopeEl = document.createElement('div');
    scopeEl.className = 'scope-prompt';
    scopeEl.style.display = 'none';

    var scopeText = document.createElement('span');
    scopeText.className = 'scope-text';

    var scopeAll = document.createElement('button');
    scopeAll.type = 'button';
    scopeAll.className = 'btn-add scope-btn';
    scopeAll.textContent = 'Change everywhere';

    var scopeOne = document.createElement('button');
    scopeOne.type = 'button';
    scopeOne.className = 'btn-add scope-btn';
    scopeOne.textContent = 'Only here';

    scopeEl.appendChild(scopeText);
    scopeEl.appendChild(scopeAll);
    scopeEl.appendChild(scopeOne);

    /* Recalculates this line from whatever price is currently in the box,
       so a one-off override only affects this line, not the saved price.
       Length-priced tasks use their own table instead. */
    function recalcTask() {
      var task = taskList[parseInt(picker.value, 10)];
      row.dataset.taskName = task.name;
      row.dataset.printName = task.custom
        ? (customName.value.trim() || task.name.replace(/\.\.\.$/, ''))
        : (task.description || task.name);

      if (task.type === 'length') {
        var feet = parseMoney(qty.value) || 0;
        var result = underCabinetPrice(feet);
        row.dataset.printQty = feet ? feet + ' ft' : '';
        row.dataset.taskTotal = String(result.price);
        total.textContent = fmt(result.price);

        if (result.capped) {
          noteEl.className = 'task-note warn';
          noteEl.textContent = 'Over ' + UC_MAX_FEET + ' ft needs a second 96W transformer - price this run by hand.';
        } else {
          var bits = [];
          if (result.extraSections > 0) {
            bits.push(result.extraSections + ' extra ' + UC_SECTION_FEET + ' ft section' +
              (result.extraSections > 1 ? 's' : '') + ' at ' + fmt(UC_PER_EXTRA_SECTION));
          }
          if (result.upgraded) {
            bits.push(fmt(UC_TRANSFORMER_UPGRADE) + ' for the 96W transformer');
          }
          noteEl.className = 'task-note';
          noteEl.textContent = bits.length ? 'Includes ' + bits.join(' + ') : '';
        }
      } else if (task.type === 'service') {
        var base = parseMoney(priceInput.value);
        if (isNaN(base)) { base = 0; }
        var extras = addonTotal();
        var svcQty = parseMoney(qty.value) || 0;
        var svcTotal = (base + extras) * svcQty;

        row.dataset.printQty = svcQty ? String(svcQty) : '';
        row.dataset.taskTotal = String(svcTotal);
        row.dataset.addons = JSON.stringify(readAddonValues());
        total.textContent = fmt(svcTotal);

        noteEl.className = 'task-note';
        noteEl.textContent = extras ? 'Base ' + fmt(base) + ' + ' + fmt(extras) + ' added footage' : '';
        scopeEl.style.display = 'none';
      } else {
        var price = parseMoney(priceInput.value);
        var n = parseMoney(qty.value) || 0;
        row.dataset.printQty = n ? String(n) : '';
        if (isNaN(price)) {
          row.dataset.taskTotal = '0';
          total.textContent = fmt(0);
        } else {
          var lineTotal = n * price;
          row.dataset.taskTotal = String(lineTotal);
          total.textContent = fmt(lineTotal);
        }
        noteEl.className = 'task-note';
        noteEl.textContent = '';
        updateScopePrompt(task);
      }
      recalcRoom(block);
    }

    /* Offers to push a changed price out to every other line using the same
       task, or keep it to this one line only. */
    function updateScopePrompt(task) {
      if (suppressScopePrompt || task.custom || task.type === 'length' || task.price === null) {
        scopeEl.style.display = 'none';
        return;
      }
      var typed = parseMoney(priceInput.value);
      if (isNaN(typed) || typed === task.price) {
        scopeEl.style.display = 'none';
        return;
      }
      scopeText.textContent = task.name + ' is set to ' + fmt(task.price) + '.';
      scopeEl.style.display = 'flex';
    }

    scopeAll.addEventListener('click', function () {
      var task = taskList[parseInt(picker.value, 10)];
      var typed = parseMoney(priceInput.value);
      if (isNaN(typed)) { return; }
      applyPriceEverywhere(task, typed);
      scopeEl.style.display = 'none';
    });

    scopeOne.addEventListener('click', function () {
      scopeEl.style.display = 'none';
    });

    /* Switching the task resets the price box back to that task's set price,
       and swaps the row between "per each" and "per foot" mode. */
    function loadTaskPrice() {
      var task = taskList[parseInt(picker.value, 10)];
      var isLength = task.type === 'length';

      customName.style.display = task.custom ? 'block' : 'none';
      customBack.style.display = task.custom ? 'inline-block' : 'none';
      picker.style.display = task.custom ? 'none' : 'block';
      if (task.custom) {
        customName.placeholder = task.placeholder || 'Name this task';
      }
      priceWrap.style.display = isLength ? 'none' : 'flex';
      qtyUnit.textContent = isLength ? 'ft' : '';
      qty.setAttribute('aria-label', isLength ? 'Length in feet' : 'Quantity');

      if (!isLength) {
        priceInput.value = task.price === null ? '' : task.price;
      }

      buildAddons(task);

      /* A service is one job, so start it at 1 rather than a blank that would
         zero out the base price the moment it is picked. */
      if (task.type === 'service' && !qty.value) { qty.value = '1'; }

      fitCustomName();
      scopeEl.style.display = 'none';
      recalcTask();
    }

    /* Past this many characters the name gets its own line. */
    var CUSTOM_NAME_INLINE_MAX = 16;

    function fitCustomName() {
      customName.classList.toggle('is-long',
        customName.value.length > CUSTOM_NAME_INLINE_MAX);
    }

    customName.addEventListener('input', function () {
      fitCustomName();
      recalcTask();
    });

    picker.addEventListener('change', function () {
      loadTaskPrice();
      var task = taskList[parseInt(picker.value, 10)];
      if (task.custom && !isLoadingEstimate) { customName.focus(); }
    });
    priceInput.addEventListener('input', recalcTask);
    qty.addEventListener('input', recalcTask);

    /* Extra footage boxes for service tasks. Same look on every one. */
    var addonWrap = document.createElement('div');
    addonWrap.className = 'addon-wrap';
    addonWrap.style.display = 'none';
    var addonInputs = {};

    function buildAddons(task) {
      addonWrap.innerHTML = '';
      addonInputs = {};

      if (task.type !== 'service' || !task.addons.length) {
        addonWrap.style.display = 'none';
        return;
      }

      task.addons.forEach(function (addon) {
        var cell = document.createElement('div');
        cell.className = 'addon-cell';

        var label = document.createElement('span');
        label.className = 'addon-label';
        label.textContent = addon.label;

        var input = document.createElement('input');
        input.type = 'text';
        input.setAttribute('inputmode', 'decimal');
        input.className = 'addon-input';
        input.placeholder = '0';
        input.setAttribute('aria-label', addon.label + ' in feet');

        var unit = document.createElement('span');
        unit.className = 'addon-unit';
        unit.textContent = 'ft';

        var money = document.createElement('span');
        money.className = 'addon-money';
        money.textContent = fmt(0);

        input.addEventListener('input', function () {
          var cleaned = input.value.replace(/[^0-9.]/g, '');
          if (cleaned !== input.value) { input.value = cleaned; }
          recalcTask();
        });

        cell.appendChild(label);
        cell.appendChild(input);
        cell.appendChild(unit);
        cell.appendChild(money);
        addonWrap.appendChild(cell);

        addonInputs[addon.key] = {addon: addon, input: input, money: money};
      });

      addonWrap.style.display = 'flex';
    }

    function readAddonValues() {
      var out = {};
      Object.keys(addonInputs).forEach(function (key) {
        out[key] = addonInputs[key].input.value;
      });
      return out;
    }

    function writeAddonValues(values) {
      if (!values) { return; }
      Object.keys(addonInputs).forEach(function (key) {
        if (values[key] !== undefined) { addonInputs[key].input.value = values[key]; }
      });
    }

    row.writeAddonValues = writeAddonValues;

    /* Total of every add-on box, and refresh each box's own figure. */
    function addonTotal() {
      var sum = 0;
      Object.keys(addonInputs).forEach(function (key) {
        var a = addonInputs[key];
        var charge = addonCharge(a.addon, a.input.value);
        a.money.textContent = fmt(charge);
        sum += charge;
      });
      return sum;
    }

    row.appendChild(picker);
    row.appendChild(customName);
    row.appendChild(customBack);
    row.appendChild(qty);
    row.appendChild(qtyUnit);
    row.appendChild(priceWrap);
    row.appendChild(total);
    row.appendChild(removeBtn);
    row.appendChild(noteEl);
    row.appendChild(scopeEl);
    row.appendChild(addonWrap);
    taskArea.appendChild(row);

    /* Start on the first real task, not on "Custom task...". */
    picker.selectedIndex = taskList.length > 1 ? 1 : 0;
    loadTaskPrice();
    return row;
  }

  /* Pushes a price change out to every line using this same task, and makes
     it the new set price so tasks added later pick it up too. */
  var suppressScopePrompt = false;
  var isLoadingEstimate = false;

  function applyPriceEverywhere(task, newPrice) {
    var oldPrice = task.price;

    /* Update every task object with this name that was on the old price.
       A same-named task at a different price (outdoor Switch at $165 versus
       interior at $125) is deliberately left alone. */
    ALL_TASK_OBJECTS.forEach(function (t) {
      if (t.name === task.name && t.price === oldPrice) { t.price = newPrice; }
    });

    suppressScopePrompt = true;
    document.querySelectorAll('.task-row').forEach(function (r) {
      if (r.dataset.taskName !== task.name) { return; }
      var pi = r.querySelector('.price-input');
      if (!pi) { return; }
      var current = parseMoney(pi.value);
      /* Leave alone any line you deliberately set to something else. */
      if (pi.value === '' || current === oldPrice) {
        pi.value = newPrice;
        pi.dispatchEvent(new Event('input'));
      }
    });
    suppressScopePrompt = false;
  }

  function recalcRoom(block) {
    var sum = 0;
    block.querySelectorAll('.task-row').forEach(function (r) {
      sum += parseFloat(r.dataset.taskTotal) || 0;
    });
    block.dataset.roomTotal = String(sum);
    block.querySelector('.room-subtotal').textContent = fmt(sum);
    updateAll();
  }

  function roomsTotal() {
    if (!roomsContainer) { return 0; }
    var sum = 0;
    roomsContainer.querySelectorAll('.room-block').forEach(function (b) {
      sum += parseFloat(b.dataset.roomTotal) || 0;
    });
    return sum;
  }

  /* ==========================================================================
     TEXT SIZE

     Every size in the stylesheet is in rem, so changing the root font size
     scales the whole page at once. Remembered between visits.
     ========================================================================== */

  var TEXT_SIZES = [10, 12, 14, 16, 18];
  var TEXT_SIZE_KEY = 'remodelQuoteTextSize';
  var textSizeIndex = 3;   // 16px

  function applyTextSize() {
    document.documentElement.style.fontSize = TEXT_SIZES[textSizeIndex] + 'px';

    document.getElementById('textLevel').textContent = TEXT_SIZES[textSizeIndex];
    document.getElementById('textSmaller').disabled = textSizeIndex === 0;
    document.getElementById('textBigger').disabled = textSizeIndex === TEXT_SIZES.length - 1;

    try {
      window.localStorage.setItem(TEXT_SIZE_KEY, String(textSizeIndex));
    } catch (e) { /* fine, it just will not be remembered */ }
  }

  try {
    var storedSize = parseInt(window.localStorage.getItem(TEXT_SIZE_KEY), 10);
    if (!isNaN(storedSize) && storedSize >= 0 && storedSize < TEXT_SIZES.length) {
      textSizeIndex = storedSize;
    }
  } catch (e) { /* no stored preference */ }

  applyTextSize();

  document.getElementById('textSmaller').addEventListener('click', function () {
    if (textSizeIndex > 0) { textSizeIndex--; applyTextSize(); }
  });

  document.getElementById('textBigger').addEventListener('click', function () {
    if (textSizeIndex < TEXT_SIZES.length - 1) { textSizeIndex++; applyTextSize(); }
  });

  /* ==========================================================================
     SAVED ESTIMATES

     Stored in this browser only, on this device. Saving on your phone does
     not put it on your boss's phone. The PDF is still the shareable copy.
     ========================================================================== */

  var STORAGE_KEY = 'remodelQuoteEstimates';
  var savedListEl = document.getElementById('savedList');

  function storageAvailable() {
    try {
      var probe = '__probe__';
      window.localStorage.setItem(probe, '1');
      window.localStorage.removeItem(probe);
      return true;
    } catch (e) {
      return false;
    }
  }

  function readSaved() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function writeSaved(list) {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      return true;
    } catch (e) {
      return false;
    }
  }

  /* Reads the whole form into a plain object. */
  function collectEstimate() {
    var rooms = [];
    roomsContainer.querySelectorAll('.room-block').forEach(function (b) {
      var tasks = [];
      b.querySelectorAll('.task-row').forEach(function (r) {
        var picker = r.querySelector('.task-select');
        var priceInput = r.querySelector('.price-input');
        var customEl = r.querySelector('.custom-name');
        var addons = null;
        try { addons = r.dataset.addons ? JSON.parse(r.dataset.addons) : null; } catch (e) {}
        tasks.push({
          task: picker.options[picker.selectedIndex].textContent,
          customName: customEl ? customEl.value : '',
          addons: addons,
          qty: r.querySelector('.qty-input').value,
          price: priceInput ? priceInput.value : '',
          lineTotal: parseFloat(r.dataset.taskTotal) || 0
        });
      });
      rooms.push({
        name: b.querySelector('.room-name').value,
        type: b.dataset.roomType || b.querySelector('.room-name').value,
        tasks: tasks,
        roomTotal: parseFloat(b.dataset.roomTotal) || 0
      });
    });

    var stamp = {};
    STAMP_FIELDS.forEach(function (id) {
      stamp[id] = document.getElementById(id).value;
    });

    return {
      id: String(Date.now()),
      savedAt: new Date().toISOString(),
      stamp: stamp,
      contractorName: document.getElementById('contractorName').value,
      contractorPhone: document.getElementById('contractorPhone').value,
      contractorEmail: elContractorEmail.value,
      custName: elName.value,
      custStreet: elStreet.value,
      custCityStateZip: elCityStateZip.value,
      trips: String(travelDays()),
      permit: permitCharged() ? 'yes' : (document.getElementById('stPermit').value === 'N' ? 'no' : null),
      rooms: rooms,
      total: computeTotals().total
    };
  }

  /* Rebuilds the whole form from a saved object. */
  function applyEstimate(e) {
    isLoadingEstimate = true;

    STAMP_FIELDS.forEach(function (id) {
      document.getElementById(id).value = (e.stamp && e.stamp[id]) || (id === 'stTravel' || id === 'stRevisions' ? '0' : '');
    });
    refreshStampReadouts();
    document.getElementById('contractorName').value = e.contractorName || '';
    document.getElementById('contractorPhone').value = e.contractorPhone || '';
    elContractorEmail.value = e.contractorEmail || e.custEmail || '';
    elName.value = e.custName || '';
    elStreet.value = e.custStreet || '';
    elCityStateZip.value = e.custCityStateZip || '';

    /* Older saves kept trips and permit outside the stamp block. If the stamp
       fields did not carry them, fall back to those values. */
    if (!(e.stamp && e.stamp.stTravel) && e.trips) {
      document.getElementById('stTravel').value = e.trips;
    }
    if (!(e.stamp && e.stamp.stPermit) && e.permit) {
      document.getElementById('stPermit').value = e.permit === 'yes' ? 'Y' : 'N';
    }
    refreshStampReadouts();

    roomsContainer.innerHTML = '';

    (e.rooms || []).forEach(function (r) {
      var roomType = r.type || r.name;
      var block = addRoom(roomType);
      block.querySelector('.room-name').value = r.name;
      var taskArea = block.querySelector('.task-area');
      var roomTasks = tasksForRoom(roomType);

      (r.tasks || []).forEach(function (t) {
        var row = addTask(block, taskArea, roomTasks);
        var picker = row.querySelector('.task-select');

        for (var i = 0; i < picker.options.length; i++) {
          if (picker.options[i].textContent === t.task) {
            picker.selectedIndex = i;
            break;
          }
        }
        /* Changing the task resets the price, so set the price afterwards. */
        picker.dispatchEvent(new Event('change'));

        var customEl = row.querySelector('.custom-name');
        if (customEl && t.customName) {
          customEl.value = t.customName;
          customEl.dispatchEvent(new Event('input'));
        }

        var priceInput = row.querySelector('.price-input');
        if (priceInput && t.price !== '') { priceInput.value = t.price; }

        if (t.addons && typeof row.writeAddonValues === 'function') {
          row.writeAddonValues(t.addons);
        }

        var qtyInput = row.querySelector('.qty-input');
        qtyInput.value = t.qty;
        qtyInput.dispatchEvent(new Event('input'));
      });
    });

    isLoadingEstimate = false;
    updateAll();
    window.scrollTo(0, 0);
  }

  function renderSavedList() {
    savedListEl.innerHTML = '';

    if (!storageAvailable()) {
      var warn = document.createElement('div');
      warn.className = 'saved-empty';
      warn.textContent = 'Saving is not available in this browser view. It works on the live site.';
      savedListEl.appendChild(warn);
      return;
    }

    var list = readSaved();
    if (!list.length) {
      var empty = document.createElement('div');
      empty.className = 'saved-empty';
      empty.textContent = 'No saved estimates yet.';
      savedListEl.appendChild(empty);
      return;
    }

    list.forEach(function (e) {
      var wrap = document.createElement('div');

      var row = document.createElement('div');
      row.className = 'saved-row';

      var info = document.createElement('div');
      info.className = 'saved-info';

      var nameEl = document.createElement('div');
      nameEl.className = 'saved-name';
      nameEl.textContent = e.custName || 'Untitled estimate';

      var roomCount = (e.rooms || []).length;
      var taskCount = (e.rooms || []).reduce(function (n, r) {
        return n + (r.tasks || []).length;
      }, 0);

      var meta = document.createElement('div');
      meta.className = 'saved-meta';
      var when = new Date(e.savedAt);
      meta.textContent = when.toLocaleDateString() + '  ' +
        when.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) +
        '  -  ' + roomCount + ' room' + (roomCount === 1 ? '' : 's') +
        ', ' + taskCount + ' task' + (taskCount === 1 ? '' : 's');

      info.appendChild(nameEl);
      info.appendChild(meta);

      var totalEl = document.createElement('span');
      totalEl.className = 'saved-total';
      totalEl.textContent = fmt(e.total || 0);

      /* Tap to see everything the save is holding. */
      var detail = document.createElement('div');
      detail.className = 'saved-detail';
      detail.style.display = 'none';

      var detailBtn = document.createElement('button');
      detailBtn.type = 'button';
      detailBtn.className = 'btn-add';
      detailBtn.textContent = 'Details';
      detailBtn.addEventListener('click', function () {
        var open = detail.style.display !== 'none';
        detail.style.display = open ? 'none' : 'block';
        detailBtn.textContent = open ? 'Details' : 'Hide';
      });

      var openBtn = document.createElement('button');
      openBtn.type = 'button';
      openBtn.className = 'btn-add';
      openBtn.textContent = 'Open';
      openBtn.addEventListener('click', function () {
        if (confirm('Open "' + (e.custName || 'Untitled') + '"? This replaces what is on screen now.')) {
          applyEstimate(e);
          setOpenEstimate(e.id, e.custName);
        }
      });

      var delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'btn-delete';
      delBtn.textContent = 'Delete this estimate';

      var armed = false;
      var armTimer = null;
      delBtn.addEventListener('click', function () {
        if (!armed) {
          armed = true;
          delBtn.textContent = 'Tap again to confirm';
          delBtn.classList.add('armed');
          armTimer = setTimeout(function () {
            armed = false;
            delBtn.textContent = 'Delete this estimate';
            delBtn.classList.remove('armed');
          }, 4000);
          return;
        }
        clearTimeout(armTimer);
        writeSaved(readSaved().filter(function (x) { return x.id !== e.id; }));
        if (openEstimateId === e.id) { setOpenEstimate(null); }
        renderSavedList();
        refreshToggleLabel();
      });

      /* Build the detail body: trips, permit, then every room and task. */
      function detailLine(label, value, cls) {
        var d = document.createElement('div');
        d.className = cls || 'detail-line';
        var l = document.createElement('span');
        l.textContent = label;
        var v = document.createElement('span');
        v.textContent = value;
        d.appendChild(l);
        d.appendChild(v);
        return d;
      }

      var trips = parseFloat(e.trips) || 0;
      detail.appendChild(detailLine('Trips  x' + trips, fmt(trips * TRIP_RATE)));
      detail.appendChild(detailLine(
        'Permit  ' + (e.permit === 'yes' ? 'Yes' : e.permit === 'no' ? 'No' : '-'),
        fmt(e.permit === 'yes' ? PERMIT_FEE : 0)
      ));

      (e.rooms || []).forEach(function (r) {
        detail.appendChild(detailLine(r.name, fmt(r.roomTotal || 0), 'detail-room'));
        (r.tasks || []).forEach(function (t) {
          var qtyText = t.qty ? t.qty + ' x ' : '';
          detail.appendChild(detailLine('    ' + qtyText + t.task, fmt(t.lineTotal || 0)));
        });
      });

      if (!(e.rooms || []).length) {
        var none = document.createElement('div');
        none.className = 'detail-line';
        none.textContent = 'No rooms in this estimate.';
        detail.appendChild(none);
      }

      detail.appendChild(delBtn);

      row.appendChild(info);
      row.appendChild(totalEl);
      row.appendChild(detailBtn);
      row.appendChild(openBtn);

      wrap.appendChild(row);
      wrap.appendChild(detail);
      savedListEl.appendChild(wrap);
    });
  }

  /* Which saved estimate is on screen, so Update overwrites that one instead
     of piling up a new copy every time. Null means this is fresh work. */
  var openEstimateId = null;

  function setOpenEstimate(id, name) {
    openEstimateId = id;
    var btn = document.getElementById('updateBtn');
    var notice = document.getElementById('openNotice');

    btn.disabled = !id;

    if (id) {
      notice.style.display = 'block';
      notice.textContent = 'Editing "' + (name || 'Untitled') + '"';
    } else {
      notice.style.display = 'none';
    }
  }

  /* The list is hidden by default so a long history does not push the
     working part of the page out of reach. */
  var savedListOpen = false;

  function savedCount() {
    return storageAvailable() ? readSaved().length : 0;
  }

  function refreshToggleLabel() {
    var n = savedCount();
    var btn = document.getElementById('toggleSavedBtn');
    btn.textContent = (savedListOpen ? 'Hide' : 'View') +
      ' saved estimates' + (n ? ' (' + n + ')' : '');
  }

  function setSavedListOpen(open) {
    savedListOpen = open;
    document.getElementById('savedList').style.display = open ? 'block' : 'none';
    if (open) { renderSavedList(); }
    refreshToggleLabel();
  }

  document.getElementById('toggleSavedBtn').addEventListener('click', function () {
    setSavedListOpen(!savedListOpen);
  });

  document.getElementById('updateBtn').addEventListener('click', function () {
    tidyLetterhead();
    if (!openEstimateId) { return; }

    var list = readSaved();
    var idx = -1;
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === openEstimateId) { idx = i; break; }
    }
    if (idx === -1) {
      alert('That estimate is no longer in the list. Use "Save as new" instead.');
      setOpenEstimate(null);
      return;
    }

    var updated = collectEstimate();
    updated.id = openEstimateId;          // keep its place in the list
    updated.savedAt = new Date().toISOString();
    list[idx] = updated;

    if (writeSaved(list)) {
      setSavedListOpen(true);
      setOpenEstimate(openEstimateId, updated.custName);
      flashButton(this, 'Updated');
    } else {
      alert('Could not save - storage may be full. Try deleting an old estimate.');
    }
  });

  function flashButton(btn, message) {
    var original = btn.textContent;
    btn.textContent = message;
    setTimeout(function () { btn.textContent = original; }, 1400);
  }

  document.getElementById('saveBtn').addEventListener('click', function () {
    tidyLetterhead();

    if (!storageAvailable()) {
      alert('This browser will not let the page save. Try the live site, or download the PDF instead.');
      return;
    }

    var list = readSaved();
    var fresh = collectEstimate();
    list.unshift(fresh);
    if (list.length > 50) { list = list.slice(0, 50); }

    if (writeSaved(list)) {
      setSavedListOpen(true);
      setOpenEstimate(fresh.id, fresh.custName);
      flashButton(this, 'Saved');
    } else {
      alert('Could not save - storage may be full. Try deleting an old estimate.');
    }
  });

  refreshToggleLabel();

  /* ==========================================================================
     AUTO-SAVE OF WORK IN PROGRESS

     Separate from the Saved Estimates list below. This quietly keeps whatever
     is on screen, so closing the tab, switching apps, or the phone going to
     sleep does not lose the estimate. Restored automatically next visit.
     ========================================================================== */

  var DRAFT_KEY = 'remodelQuoteDraft';
  var draftTimer = null;

  function hasAnyContent(d) {
    return !!(d.custName || d.custStreet || d.contractorName ||
      (d.trips && d.trips !== '0') || d.permit ||
      (d.rooms && d.rooms.length));
  }

  var isResetting = false;

  function saveDraft() {
    if (isLoadingEstimate || isResetting) { return; }
    try {
      var d = collectEstimate();
      if (!hasAnyContent(d)) { return; }
      d.openId = openEstimateId;
      window.localStorage.setItem(DRAFT_KEY, JSON.stringify(d));
    } catch (e) { /* storage blocked or full - nothing else to do */ }
  }

  /* Batched so typing does not write on every keystroke. */
  function queueDraftSave() {
    clearTimeout(draftTimer);
    draftTimer = setTimeout(saveDraft, 600);
  }

  document.addEventListener('input', queueDraftSave);
  document.addEventListener('change', queueDraftSave);
  document.addEventListener('click', queueDraftSave);

  /* Write immediately when the app is backgrounded or closed, since a
     pending timer would never get the chance to fire. */
  window.addEventListener('pagehide', saveDraft);
  window.addEventListener('beforeunload', saveDraft);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') { saveDraft(); }
  });

  function restoreDraft() {
    var raw;
    try {
      raw = window.localStorage.getItem(DRAFT_KEY);
    } catch (e) { return; }
    if (!raw) { return; }
    try {
      var d = JSON.parse(raw);
      if (hasAnyContent(d)) {
        applyEstimate(d);
        if (d.openId) { setOpenEstimate(d.openId, d.custName); }
      }
    } catch (e) { /* unreadable draft, leave the form blank */ }
  }

  /* Draft restore and history init run at the very end of the script, once
     STAMP_FIELDS and the history variables actually exist. */

  /* ==========================================================================
     STAMP FIELDS

     What used to get stamped on a paper estimate. Blank ones are left off the
     printed page so the block stays tight.

     Note: PERMIT and 3% are NOT inputs here. This tool already has a Permit
     Yes/No control that drives the $500, and always charges the 3%, so those
     two print from the real numbers rather than from a second set of boxes
     that could disagree with them.
     ========================================================================== */

  var STAMP_FIELDS = ['stPermit', 'stFpl', 'stThree', 'stTerms', 'stTermsOther', 'stTravel', 'stRevisions'];

  /* Y/N toggles. Tapping the button already lit clears it back to blank, so a
     field can still be left off the printed stamp. */
  function wireToggle(groupId, fieldId, onChange) {
    var group = document.getElementById(groupId);
    var field = document.getElementById(fieldId);

    group.querySelectorAll('.yn-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        field.value = field.value === btn.dataset.v ? '' : btn.dataset.v;
        paintToggle(groupId, fieldId);
        if (onChange) { onChange(field.value); }
        queueDraftSave();
        commitHistory();
      });
    });
  }

  function paintToggle(groupId, fieldId) {
    var v = document.getElementById(fieldId).value;
    document.getElementById(groupId).querySelectorAll('.yn-btn').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.v === v && v !== '');
    });
  }

  function paintAllToggles() {
    paintToggle('permitGroup', 'stPermit');
    paintToggle('fplGroup', 'stFpl');
    paintToggle('threeGroup', 'stThree');
  }

  /* The Permit toggle and the Permit Yes/No row are the same setting shown
     twice, so each updates the other. The 3% toggle really does control the
     charge: blank or Y charges it, N leaves it off. */
  wireToggle('permitGroup', 'stPermit', updateAll);
  wireToggle('fplGroup', 'stFpl');
  wireToggle('threeGroup', 'stThree', updateAll);

  function threePctApplies() {
    return document.getElementById('stThree').value !== 'N';
  }

  /* Picking "Other" is not a terms value, it is a prompt to type one. The
     select greys out to show it is a placeholder, and three tappable boxes
     appear reading 0 / 0 / 0. Leave the third blank for a two-part split.
     The combined value lives in the hidden stTermsOther so saving, loading
     and printing all keep working unchanged. */
  var TERMS_PARTS = ['termsA', 'termsB', 'termsC'];

  function toggleTermsOther() {
    var sel = document.getElementById('stTerms');
    var other = sel.value === 'Other';

    sel.classList.toggle('is-placeholder', other);
    document.getElementById('termsSplit').style.display = other ? 'inline-flex' : 'none';
  }

  /* Boxes -> "40/40/20", skipping any left empty. */
  function rebuildTerms() {
    var parts = [];
    TERMS_PARTS.forEach(function (id) {
      var v = document.getElementById(id).value.trim();
      if (v !== '') { parts.push(v); }
    });
    document.getElementById('stTermsOther').value = parts.join('/');
  }

  /* "40/40/20" -> boxes, for reloading a saved estimate. */
  function fillTermsParts() {
    var parts = (document.getElementById('stTermsOther').value || '').split('/');
    TERMS_PARTS.forEach(function (id, i) {
      document.getElementById(id).value = (parts[i] || '').trim();
    });
  }

  TERMS_PARTS.forEach(function (id, i) {
    var el = document.getElementById(id);
    el.addEventListener('input', function () {
      var cleaned = el.value.replace(/[^0-9]/g, '').slice(0, 3);
      if (cleaned !== el.value) { el.value = cleaned; }
      rebuildTerms();
      queueDraftSave();

      /* Jump to the next box once a two digit share is in. */
      if (cleaned.length === 2 && i < TERMS_PARTS.length - 1) {
        document.getElementById(TERMS_PARTS[i + 1]).focus();
      }
    });
    el.addEventListener('change', commitHistory);
  });

  function stepNum(id, direction) {
    var el = document.getElementById(id);
    var v = parseInt(el.value, 10);
    if (isNaN(v)) { v = 0; }
    v += direction;
    if (v < 0) { v = 0; }
    if (v > 99) { v = 99; }
    el.value = v;
    refreshStampReadouts();
    updateAll();
    queueDraftSave();
    commitHistory();
  }

  function refreshStampReadouts() {
    fillTermsParts();
    document.getElementById('revisionsReadout').textContent =
      document.getElementById('stRevisions').value || '0';
    paintAllToggles();
    toggleTermsOther();
  }

  /* Travel days is typed. Keep it to digits and refresh the money as you go. */
  document.getElementById('stTravel').addEventListener('input', function () {
    var cleaned = this.value.replace(/[^0-9]/g, '');
    if (cleaned !== this.value) { this.value = cleaned; }
    updateAll();
  });
  document.getElementById('revMinus').addEventListener('click', function () { stepNum('stRevisions', -1); });
  document.getElementById('revPlus').addEventListener('click', function () { stepNum('stRevisions', 1); });
  document.getElementById('stTerms').addEventListener('change', toggleTermsOther);

  /* Label/value pairs for the printed page, skipping anything left blank. */
  function stampLines() {
    var out = [];

    [['stPermit', 'PERMIT'], ['stFpl', 'FPL'], ['stThree', '3%']]
      .forEach(function (pair) {
        var v = document.getElementById(pair[0]).value;
        if (v) { out.push([pair[1], v]); }
      });

    var terms = document.getElementById('stTerms').value;
    if (terms === 'Other') {
      var custom = document.getElementById('stTermsOther').value.trim();
      if (custom) { out.push(['TERMS', custom]); }
    } else if (terms) {
      out.push(['TERMS', terms]);
    }

    var travel = parseInt(document.getElementById('stTravel').value, 10) || 0;
    if (travel > 0) { out.push(['TRAVEL DAYS', String(travel)]); }

    var revs = parseInt(document.getElementById('stRevisions').value, 10) || 0;
    if (revs > 0) { out.push(['REVISIONS', String(revs)]); }

    return out;
  }

  /* ==========================================================================
     UNDO / REDO

     A snapshot is the whole estimate, not one field, so undo restores every
     room, task, price and letterhead field together. collectEstimate and
     applyEstimate already do exactly that, so history rides on top of them.
     ========================================================================== */

  var UNDO_LIMIT = 60;
  var undoStack = [];
  var redoStack = [];
  var lastState = null;
  var historyTimer = null;
  var historyReady = false;

  function snapshot() {
    var s = collectEstimate();
    delete s.id;
    delete s.savedAt;
    return s;
  }

  function sameState(a, b) {
    if (!a || !b) { return false; }
    return JSON.stringify(a) === JSON.stringify(b);
  }

  function commitHistory() {
    if (!historyReady || isLoadingEstimate) { return; }
    if (historyTimer) { clearTimeout(historyTimer); historyTimer = null; }

    var now = snapshot();
    if (lastState && !sameState(lastState, now)) {
      undoStack.push(lastState);
      if (undoStack.length > UNDO_LIMIT) { undoStack.shift(); }
      redoStack = [];
    }
    lastState = now;
    refreshUndoButtons();
  }

  /* Waits for a pause so a burst of typing is one step, not twenty. */
  function scheduleHistory() {
    if (!historyReady || isLoadingEstimate) { return; }
    if (historyTimer) { clearTimeout(historyTimer); }
    historyTimer = setTimeout(commitHistory, 600);
  }

  function undo() {
    commitHistory();
    if (!undoStack.length) { return; }
    redoStack.push(snapshot());
    var previous = undoStack.pop();
    applyEstimate(previous);
    refreshStampReadouts();
    lastState = previous;
    saveDraft();
    refreshUndoButtons();
  }

  function redo() {
    if (!redoStack.length) { return; }
    undoStack.push(snapshot());
    var next = redoStack.pop();
    applyEstimate(next);
    refreshStampReadouts();
    lastState = next;
    saveDraft();
    refreshUndoButtons();
  }

  function refreshUndoButtons() {
    document.getElementById('undoBtn').disabled = !undoStack.length;
    document.getElementById('redoBtn').disabled = !redoStack.length;
  }

  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('redoBtn').addEventListener('click', redo);

  document.addEventListener('input', scheduleHistory);
  document.addEventListener('change', scheduleHistory);
  document.addEventListener('click', function (e) {
    /* A button press is a finished action, so close the step at once. */
    if (e.target.closest('button') && !e.target.closest('.undo-pair')) {
      setTimeout(commitHistory, 0);
    }
  });

  /* ==========================================================================
     DICTATION

     Not an AI. It matches spoken words against the room and task lists you
     already have, then shows you what it understood before anything is added.
     Nothing lands on the quote until you approve it.
     ========================================================================== */

  var dictateParsed = [];

  /* iOS transcribes "to", "too" and "two" interchangeably, so a bare one of
     those sitting immediately before a number is dropped. "Price to 225"
     and "price two 225" both become "price 225". A real quantity like
     "two outlets" is untouched because a word follows, not a number. */
  function stripFillerBeforeNumbers(text) {
    return text
      /* "two" before a number is only filler right after the word price.
         Everywhere else it is a real quantity - "two 4 inch cans" is two
         cans, not one. "to" and "too" are never quantities, so they go
         wherever they appear before a number. */
      .replace(/\bprice\s+(?:to|too|two)\s+(?=\d)/g, 'price ')
      .replace(/\b(to|too)\s+(?=\d)/g, '')
      .replace(/\b(for|four)\s+(?=\$)/g, '')
      .replace(/\bat\s+(?=\d)/g, '')
      .replace(/\bdollars?\b/g, '')
      .replace(/\$\s*/g, '');
  }

  /* wordsToNumber joins runs of digits, which is right for a house number
     but wrong here: "bedroom one six outlets" must not become "bedroom 16".
     This converts each spoken number on its own, only joining a genuine
     compound like "twenty three". */
  var DICT_ONES = {zero:0, one:1, two:2, three:3, four:4, five:5, six:6,
                   seven:7, eight:8, nine:9};
  var DICT_TEENS = {ten:10, eleven:11, twelve:12, thirteen:13, fourteen:14,
                    fifteen:15, sixteen:16, seventeen:17, eighteen:18, nineteen:19};
  var DICT_TENS = {twenty:20, thirty:30, forty:40, fifty:50, sixty:60,
                   seventy:70, eighty:80, ninety:90};

  function dictationNumbers(text) {
    var words = text.split(/\s+/);
    var out = [];

    /* Trailing punctuation must not hide the word: "bedroom one," has to
       still read as one. Split it off, convert, then put it back. */
    function bare(s) { return (s || '').replace(/[^a-z]/g, ''); }
    function tail(s) { return (s || '').replace(/^[a-z]*/, ''); }

    for (var i = 0; i < words.length; i++) {
      var raw = words[i];
      var w = bare(raw);
      var suffix = tail(raw);
      var next = bare(words[i + 1]);

      /* "two hundred twenty five" -> 225, and "one hundred" -> 100. */
      if ((DICT_ONES.hasOwnProperty(w) || DICT_TEENS.hasOwnProperty(w)) && next === 'hundred') {
        var base = (DICT_ONES.hasOwnProperty(w) ? DICT_ONES[w] : DICT_TEENS[w]) * 100;
        var j = i + 2;
        var t1 = bare(words[j]);

        if (DICT_TENS.hasOwnProperty(t1)) {
          base += DICT_TENS[t1];
          j++;
          var t2 = bare(words[j]);
          if (DICT_ONES.hasOwnProperty(t2) && t2 !== 'zero') { base += DICT_ONES[t2]; j++; }
        } else if (DICT_TEENS.hasOwnProperty(t1)) {
          base += DICT_TEENS[t1];
          j++;
        } else if (DICT_ONES.hasOwnProperty(t1) && t1 !== 'zero') {
          base += DICT_ONES[t1];
          j++;
        }

        out.push(String(base) + tail(words[j - 1]));
        i = j - 1;
        continue;
      }

      if (DICT_TENS.hasOwnProperty(w)) {
        /* "twenty three" is one number; "twenty outlets" is just twenty. */
        if (next && DICT_ONES.hasOwnProperty(next) && next !== 'zero') {
          out.push(String(DICT_TENS[w] + DICT_ONES[next]) + tail(words[i + 1]));
          i++;
        } else {
          out.push(String(DICT_TENS[w]) + suffix);
        }
      } else if (DICT_TEENS.hasOwnProperty(w)) {
        out.push(String(DICT_TEENS[w]) + suffix);
      } else if (DICT_ONES.hasOwnProperty(w)) {
        out.push(String(DICT_ONES[w]) + suffix);
      } else {
        out.push(raw);
      }
    }
    return out.join(' ');
  }

  /* Short names you actually say on a job, mapped to the written room name.
     Longest phrases first so "primary bath" is not eaten by "primary". */
  var ROOM_ALIASES = [
    ['primary bathroom', 'Primary Bathroom'],
    ['master bathroom',  'Primary Bathroom'],
    ['primary bath',     'Primary Bathroom'],
    ['master bath',      'Primary Bathroom'],
    ['primary bedroom',  'Primary Bedroom'],
    ['master bedroom',   'Primary Bedroom'],
    ['primary suite',    'Primary Suite'],
    ['master suite',     'Primary Suite'],
    ['master closet',    'Primary Bedroom Closet - Hers'],
    ['her closet',       'Primary Bedroom Closet - Hers'],
    ['hers closet',      'Primary Bedroom Closet - Hers'],
    ['his closet',       'Primary Bedroom Closet - His'],
    ['mechanical closet','Mechanical Closet'],
    ['mech closet',      'Mechanical Closet'],
    ['mechanical',       'Mechanical Closet'],
    ['powder room',      'Powder Bath'],
    ['powder',           'Powder Bath'],
    ['office bathroom',  'Office Bath'],
    ['outdoor sitting',  'Outdoor Sitting Area'],
    ['lanai',            'Patio'],
    ['master',           'Primary Bedroom'],
    ['primary',          'Primary Bedroom']
  ];

  function applyRoomAliases(text) {
    var t = ' ' + text + ' ';
    ROOM_ALIASES.forEach(function (pair) {
      var re = new RegExp('(^|[\\s,])' + pair[0] + '(?=[\\s,]|$)', 'g');
      t = t.replace(re, '$1' + pair[1].toLowerCase());
    });
    return t.trim();
  }

  function normalizeDictation(text) {
    var t = ' ' + text.toLowerCase() + ' ';
    t = t.replace(/\b(to|too|two)\s+(?=(?:one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety)\b)/g, '');
    t = stripFillerBeforeNumbers(t);
    t = dictationNumbers(t);
    t = t.replace(/\bw\s*\/\s*/g, 'with ');
    t = t.replace(/(\d)\s*(?:inch|in\b|")/g, '$1inch');

    /* Dictation drops a dash between two spoken numbers, so "two 4 inch"
       arrives as "2-4 inch". Split it back apart or the quantity is lost. */
    t = t.replace(/(\d)\s*[-\u2010-\u2015]\s*(\d)/g, '$1 $2');

    /* Fixture shorthand. These expand to the full written name, because the
       matcher needs the size tokens: "wraps" alone cannot find 4' LED Wrap.
       Runs before the can rules so "flat panel" is not read as a flat can. */
    t = t.replace(/\bflat\s+panel(?:\s+light)?s?\b/g, '4 x 6inch led flat panel light');
    t = t.replace(/\b(?:led\s+)?wraps?\b/g, '4 led wrap');

    /* Job shorthand for the can types. These run first, before the general
       can/light rules below, because they are more specific. */
    t = t.replace(/\bregressed\s+(?:style\s+)?(?:recessed\s+)?(?:cans?|lights?)\b/g,
                  'regressed style recessed can');
    t = t.replace(/\bflat\s+(?:recessed\s+)?(?:cans?|lights?)\b/g, 'flat recessed can');
    t = t.replace(/\bsoffit\s+(?:recessed\s+)?(?:cans?|lights?)\b/g, 'soffit recessed can');

    /* The plain recessed can was removed, so a size with no style named -
       "4 inch can", "4 inch recessed can", "4 inch recess can" - means the
       regressed style. Flat, soffit and regressed were already rewritten
       above, so a word sits between the size and "can" in those and this
       rule leaves them alone. */
    t = t.replace(/(\d+inch)\s+(?:recess(?:ed)?\s+)?(?:cans?|lights?)\b/g,
                  '$1 regressed style recessed can');

    /* "cat six" or "cat 6" means the Cat6 drop. */
    t = t.replace(/\bcat\s*6\b/g, 'cat6');
    t = t.replace(/\bcat6\b(?!\s+drop)/g, 'cat6 drop');

    /* "sconce" or "sconces" on its own means a sconce light. */
    t = t.replace(/\bsconces?\b(?!\s+light)/g, 'sconce light');

    /* "shade drops" is enough, no need to say "shade wiring drops". */
    t = t.replace(/\bshade\s+drops?\b/g, 'shade wiring drop');

    /* "can light" and "recessed light" both mean a recessed can. The optional
       leading "recessed" stops "recessed can light" doubling up. */
    t = t.replace(/\b(?:recessed\s+)?cans?\s+lights?\b/g, 'recessed can');
    t = t.replace(/\brecessed\s+lights?\b/g, 'recessed can');
    t = t.replace(/\brecessed\s+cans\b/g, 'recessed can');

    /* "12 feet of under cabinet lighting" reads the same as "12 under cabinet". */
    t = t.replace(/\b(\d+(?:\.\d+)?)\s*(?:feet|foot|ft)\s+of\s+/g, '$1 ');
    t = t.replace(/\b(\d+(?:\.\d+)?)\s*(?:feet|foot|ft)\b/g, '$1');

    t = applyRoomAliases(t);
    t = stripFillerBeforeNumbers(t);
    t = t.replace(/[^a-z0-9\/,.\s-]/g, ' ');
    return t.replace(/\s+/g, ' ').trim();
  }

  /* Words that carry meaning when matching a name. */
  function keyWords(name) {
    return name.toLowerCase()
      .replace(/\(.*?\)/g, '')
      .replace(/\bw\s*\/\s*/g, 'with ')
      .replace(/(\d)\s*"/g, '$1inch')
      .replace(/\//g, ' ')
      .replace(/[^a-z0-9\s-]/g, ' ')
      .split(/\s+/)
      /* Drop anything with no letters or digits, such as the lone dash in
         "200 Amp Overhead Service - (includes ...)", which would otherwise
         become a word the spoken phrase has to contain. */
      .filter(function (w) {
        return w && /[a-z0-9]/.test(w) && w !== 'and' && w !== 'the';
      });
  }

  /* Best match is the candidate with the most words, all of which appear in
     the segment. That is what keeps "4 inch flat recessed can" from being
     mistaken for the plain "4 inch recessed can". */
  /* A name with a slash can be said either way round, so "Entry/Foyer" has
     to answer to "entry", to "foyer", and to both together. */
  function nameVariants(name) {
    var whole = keyWords(name);
    var out = [whole];

    /* Ignore anything in brackets, so the slash in "(O/S)" does not split
       the name into meaningless fragments. */
    var bare = name.replace(/\(.*?\)/g, '');

    if (bare.indexOf('/') !== -1) {
      bare.split('/').forEach(function (part) {
        var w = keyWords(part);
        if (w.length) { out.push(w); }
      });
    }
    return out;
  }

  function bestMatch(segment, candidates, nameOf) {
    var seg = ' ' + segment + ' ';
    var winner = null;
    var winnerScore = 0;
    var winnerLength = 999;

    candidates.forEach(function (c) {
      var name = nameOf ? nameOf(c) : c;
      var fullLength = keyWords(name).length;

      nameVariants(name).forEach(function (words) {
        if (!words.length) { return; }

        var allPresent = words.every(function (w) {
          return seg.indexOf(' ' + w + ' ') !== -1 ||
                 seg.indexOf(' ' + w + 's ') !== -1 ||
                 seg.indexOf(' ' + w) !== -1;
        });
        if (!allPresent) { return; }

        /* More words matched wins. On a tie the shorter, more exact name
           wins, so plain "entry" picks Entry rather than Entry/Foyer. */
        if (words.length > winnerScore ||
           (words.length === winnerScore && fullLength < winnerLength)) {
          winnerScore = words.length;
          winnerLength = fullLength;
          winner = c;
        }
      });
    });

    lastMatchScore = winnerScore;
    return winner;
  }

  var lastMatchScore = 0;

  function matchWithScore(segment, candidates, nameOf) {
    var item = bestMatch(segment, candidates, nameOf);
    return {item: item, score: item ? lastMatchScore : 0};
  }

  function parseDictation(raw) {
    var text = normalizeDictation(raw);
    if (!text) { return []; }

    /* Commas and full stops always split. "and" only splits when there is a
       quantity on both sides, so a task name like "Panel and Pipe Only" stays
       in one piece while "six outlets and four switches" still separates. */
    var segments = [];
    text.split(/\s*[,.]\s*/).forEach(function (chunk) {
      if (!chunk.trim()) { return; }

      var parts = chunk.split(/\s+and\s+/);
      if (parts.length === 1) { segments.push(chunk); return; }

      var rebuilt = parts[0];
      for (var i = 1; i < parts.length; i++) {
        if (/\d/.test(rebuilt) && /\d/.test(parts[i])) {
          segments.push(rebuilt);
          rebuilt = parts[i];
        } else {
          rebuilt += ' and ' + parts[i];
        }
      }
      segments.push(rebuilt);
    });
    segments = segments.filter(function (s) { return s.trim(); });
    var commands = [];
    var currentRoom = null;

    segments.forEach(function (seg) {
      seg = seg.trim();

      /* "price 225" adjusts whatever was named just before it. */
      var priceIdx = seg.search(/\bprice\b/);
      if (priceIdx !== -1 && commands.length) {
        var tail = seg.slice(priceIdx);
        var nums = tail.match(/\d+(?:\.\d+)?/g);
        if (nums && nums.length) {
          commands[commands.length - 1].price = parseFloat(nums[nums.length - 1]);
          seg = seg.slice(0, priceIdx).trim();
          if (!seg) { return; }
        }
      }

      var roomHit = matchWithScore(seg, ROOM_LIST);

      /* A room name can also appear inside a task name - "Pool Bonding" holds
         the word pool. So only treat it as changing rooms when the room match
         is at least as strong as anything the current room could offer. */
      var currentTaskHit = currentRoom
        ? matchWithScore(seg, tasksForRoom(currentRoom).filter(function (t) { return !t.custom; }),
            function (t) { return t.name; })
        : {item: null, score: 0};

      var room = null;
      if (roomHit.item && (!currentTaskHit.item || roomHit.score >= currentTaskHit.score)) {
        room = roomHit.item;
        currentRoom = room;
      }

      if (!currentRoom) {
        commands.push({error: seg + '  (no room named yet)'});
        return;
      }

      /* A segment that is nothing but the room name is not also a task. */
      if (room) {
        var leftover = seg;
        keyWords(room).forEach(function (w) {
          leftover = leftover.split(w).join(' ');
        });
        if (!leftover.replace(/[^a-z0-9]/g, '')) { return; }
      }

      var available = tasksForRoom(currentRoom).filter(function (t) { return !t.custom; });
      var task = bestMatch(seg, available, function (t) { return t.name; });

      if (!task) {
        if (!room) {
          commands.push({error: seg});
          /* A segment with no number was probably meant to be a room name.
             Forget the current room so the items after it get flagged rather
             than quietly landing in the wrong place. */
          if (!/\d/.test(seg)) { currentRoom = null; }
        }
        return;
      }

      var roomForTasks = currentRoom;

      var qtyMatch = seg.match(/\b(\d+(?:\.\d+)?)\b/);
      commands.push({
        room: roomForTasks,
        task: task,
        qty: qtyMatch ? parseFloat(qtyMatch[1]) : 1,
        price: null
      });
    });

    return commands;
  }

  function renderDictatePreview(commands) {
    var box = document.getElementById('dictatePreview');
    var applyRow = document.getElementById('dictateApplyRow');
    box.innerHTML = '';

    var usable = commands.filter(function (c) { return !c.error; });

    if (!commands.length) {
      box.style.display = 'block';
      applyRow.style.display = 'none';
      box.textContent = 'Nothing recognised yet. Try naming the room first, then the items.';
      return;
    }

    commands.forEach(function (c) {
      var line = document.createElement('div');

      if (c.error) {
        line.className = 'dictate-line bad';
        line.textContent = 'Not understood: "' + c.error + '"';
      } else {
        line.className = 'dictate-line';
        var price = c.price !== null ? c.price
          : (c.task.type === 'length' || c.task.price === null ? null : c.task.price);
        var priceText = c.task.type === 'length'
          ? c.qty + ' ft'
          : c.qty + ' x ' + (price === null ? 'no price' : fmt(price));
        line.textContent = c.room + '  ->  ' + c.task.name.split(' - ')[0] + '   ' + priceText;
      }
      box.appendChild(line);
    });

    box.style.display = 'block';
    applyRow.style.display = usable.length ? 'flex' : 'none';
  }

  function applyDictation(commands) {
    var byRoom = {};
    commands.forEach(function (c) {
      if (c.error) { return; }
      if (!byRoom[c.room]) { byRoom[c.room] = []; }
      byRoom[c.room].push(c);
    });

    Object.keys(byRoom).forEach(function (roomName) {
      /* Reuse a room already on the quote rather than adding a second one. */
      var block = null;
      roomsContainer.querySelectorAll('.room-block').forEach(function (b) {
        if (!block && b.dataset.roomType === roomName) { block = b; }
      });
      if (!block) { block = addRoom(roomName); }

      var taskArea = block.querySelector('.task-area');
      var roomTasks = tasksForRoom(roomName);

      byRoom[roomName].forEach(function (c) {
        var row = addTask(block, taskArea, roomTasks);
        var picker = row.querySelector('.task-select');

        for (var i = 0; i < picker.options.length; i++) {
          if (picker.options[i].textContent === c.task.name) {
            picker.selectedIndex = i;
            break;
          }
        }
        picker.dispatchEvent(new Event('change'));

        if (c.price !== null) {
          var priceInput = row.querySelector('.price-input');
          if (priceInput) { priceInput.value = c.price; }
        }

        var qtyInput = row.querySelector('.qty-input');
        qtyInput.value = c.qty;
        qtyInput.dispatchEvent(new Event('input'));
      });
    });

    updateAll();
    commitHistory();
    saveDraft();
  }

  document.getElementById('dictateToggle').addEventListener('click', function () {
    var panel = document.getElementById('dictatePanel');
    var open = panel.style.display !== 'none';
    panel.style.display = open ? 'none' : 'block';
    this.textContent = open ? 'Dictate a quote' : 'Hide dictation';
    if (!open) { document.getElementById('dictateInput').focus(); }
  });

  document.getElementById('dictateReadBtn').addEventListener('click', function () {
    dictateParsed = parseDictation(document.getElementById('dictateInput').value);
    renderDictatePreview(dictateParsed);
  });

  document.getElementById('dictateClearBtn').addEventListener('click', function () {
    document.getElementById('dictateInput').value = '';
    document.getElementById('dictatePreview').style.display = 'none';
    document.getElementById('dictateApplyRow').style.display = 'none';
    dictateParsed = [];
  });

  document.getElementById('dictateApplyBtn').addEventListener('click', function () {
    applyDictation(dictateParsed);
    document.getElementById('dictateInput').value = '';
    document.getElementById('dictatePreview').style.display = 'none';
    document.getElementById('dictateApplyRow').style.display = 'none';
    dictateParsed = [];
  });

  document.getElementById('dictateCancelBtn').addEventListener('click', function () {
    document.getElementById('dictatePreview').style.display = 'none';
    document.getElementById('dictateApplyRow').style.display = 'none';
    dictateParsed = [];
  });

  /* ==========================================================================
     SIGNATURE

     Remembered on this device rather than stored per estimate, so it stays
     filled in from quote to quote. That also means your boss's iPad keeps
     his name instead of inheriting yours.
     ========================================================================== */

  var SIGNATURE_KEY = 'remodelQuoteSignature';
  var elPreparedBy = document.getElementById('preparedBy');

  function loadSignature() {
    var stored = null;
    try {
      stored = window.localStorage.getItem(SIGNATURE_KEY);
    } catch (e) { /* storage blocked */ }
    elPreparedBy.value = stored === null ? 'Jacob Friedman' : stored;
  }

  elPreparedBy.addEventListener('blur', function () {
    var tidied = capitalizeWords(elPreparedBy.value.trim());
    if (tidied !== elPreparedBy.value) { elPreparedBy.value = tidied; }
    try {
      window.localStorage.setItem(SIGNATURE_KEY, elPreparedBy.value);
    } catch (e) { /* storage blocked */ }
  });

  loadSignature();

  /* ==========================================================================
     PDF GENERATION
     ========================================================================== */

  /* mode 'office'    - every line item and price, for internal use
     mode 'homeowner' - the same scope of work, but only the final total */
  function buildPdf(mode) {
    tidyLetterhead();

    var showPrices = mode === 'office';

    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({unit:'pt', format:'letter'});
    var marginX = 40;
    var y = 50;

    var custName = elName.value;
    var custStreet = elStreet.value;
    var custCityStateZip = elCityStateZip.value;

    doc.setFont('helvetica','normal'); doc.setFontSize(9);

    var contractorName = elContractorName.value;
    var contractorPhone = elContractorPhone.value;
    var contractorEmail = elContractorEmail.value;
    if (contractorName) {
      doc.setFont('helvetica','bold'); doc.setFontSize(12);
      doc.text(contractorName, marginX, y);
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      y += 13;
    }
    if (contractorPhone) { doc.text(contractorPhone, marginX, y); y += 11; }
    if (contractorEmail) { doc.text(contractorEmail, marginX, y); y += 11; }
    if (contractorName || contractorPhone || contractorEmail) { y += 8; }

    if (custName) { doc.text(custName, marginX, y); y += 11; }
    if (custStreet) { doc.text(custStreet, marginX, y); y += 11; }
    if (custCityStateZip) { doc.text(custCityStateZip, marginX, y); y += 11; }
    y += 10;

    var pageBottom = doc.internal.pageSize.getHeight() - 45;
    var pageRight = doc.internal.pageSize.getWidth() - marginX;

    /* Stamp sits snug in the top right corner, in a narrow fixed column so
       it reads as a block rather than drifting across the page. Whichever
       side runs longer decides where the rest of the page begins. */
    var stamp = stampLines();
    if (stamp.length) {
      var stampW = 96;
      var stampL = pageRight - stampW;
      var padX = 6;
      var lineH = 9;
      var top = 42;
      var sy = top + 10;

      doc.setDrawColor(200, 200, 200);
      doc.setLineWidth(0.5);
      doc.roundedRect(stampL, top, stampW, stamp.length * lineH + 7, 2, 2);

      doc.setFontSize(7);
      stamp.forEach(function (pair) {
        doc.setTextColor(120, 120, 120);
        doc.text(pair[0], stampL + padX, sy);
        doc.setTextColor(0, 0, 0);
        doc.text(pair[1], pageRight - padX, sy, {align: 'right'});
        sy += lineH;
      });
      doc.setTextColor(0, 0, 0);
      doc.setFontSize(9);

      var stampBottom = top + stamp.length * lineH + 7;
      if (stampBottom > y) { y = stampBottom; }
    }

    y += 4;

    function newPageIfNeeded(needed) {
      if (y + (needed || 0) > pageBottom) {
        doc.addPage();
        y = 50;
      }
    }

    var t = computeTotals();

    if (!showPrices) {
      doc.setFont('helvetica','bold'); doc.setFontSize(10);
      doc.text('Scope of Work', marginX, y);
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      y += 15;
    }

    if (showPrices) {
      doc.text('Trips: ' + t.tripsQty + ' x ' + fmt(TRIP_RATE) + ' = ' + fmt(t.tripsTotal), marginX, y);
      y += 12;
      var pv = document.getElementById('stPermit').value;
      var permitLabel = pv === 'Y' ? 'Yes' : pv === 'N' ? 'No' : 'Not selected';
      doc.text('Permit: ' + permitLabel + ' - ' + fmt(t.permitCharge), marginX, y);
      y += 16;
    } else if (permitCharged()) {
      doc.text('Includes permit', marginX, y);
      y += 15;
    }

    roomsContainer.querySelectorAll('.room-block').forEach(function (b) {
      var rows = b.querySelectorAll('.task-row');
      if (!rows.length) { return; }

      newPageIfNeeded(30);
      doc.setFont('helvetica', 'bold');
      doc.text(b.querySelector('.room-name').value, marginX, y);
      if (showPrices) {
        doc.text(fmt(parseFloat(b.dataset.roomTotal) || 0), pageRight, y, {align:'right'});
      }
      doc.setFont('helvetica', 'normal');
      y += 12;

      rows.forEach(function (r) {
        newPageIfNeeded(0);
        var qtyText = r.dataset.printQty ? r.dataset.printQty + '  x  ' : '';
        doc.text('   ' + qtyText + (r.dataset.printName || ''), marginX, y);
        if (showPrices) {
          doc.text(fmt(parseFloat(r.dataset.taskTotal) || 0), pageRight, y, {align:'right'});
        }
        y += 11;
      });
      y += 7;
    });

    newPageIfNeeded(60);

    if (showPrices) {
      doc.text('Subtotal: ' + fmt(t.subtotal), marginX, y);
      y += 12;
      doc.text('3% of Subtotal: ' + fmt(t.threePct), marginX, y);
      y += 15;
    } else {
      y += 4;
      doc.setDrawColor(180,180,180);
      doc.line(marginX, y, pageRight, y);
      y += 15;
    }

    doc.setFont('helvetica','bold'); doc.setFontSize(11);
    doc.text('Total: ' + fmt(t.total), marginX, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(9);

    var preparedBy = elPreparedBy.value.trim();
    if (preparedBy) {
      y += 26;
      newPageIfNeeded(0);
      doc.setDrawColor(180, 180, 180);
      doc.setLineWidth(0.5);
      doc.line(marginX, y, marginX + 150, y);
      y += 11;
      doc.setFont('helvetica', 'italic'); doc.setFontSize(9);
      doc.text(preparedBy, marginX, y);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(7);
      doc.setTextColor(120, 120, 120);
      doc.text('Prepared by', marginX + 155, y);
      doc.setTextColor(0, 0, 0);
      doc.setFontSize(9);
    }

    var safeClient = (custName || 'quote').replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g,'');
    var fileName = safeClient + (showPrices ? '-office' : '-homeowner') + '.pdf';

    deliverPdf(doc, fileName);
  }

  /* On iPhone and iPad this opens the share sheet, which is where Print,
     Mail, Messages and Save to Files all live. autoPrint was the wrong tool
     there: iOS opens the PDF viewer but never fires the print dialog, so you
     end up staring at a preview with no way out.
     Desktop browsers do not support sharing files, so they get the print
     window instead, which is the equivalent one-step route to paper or PDF. */
  function deliverPdf(doc, fileName) {
    var blob = doc.output('blob');

    var file = null;
    try {
      file = new File([blob], fileName, {type: 'application/pdf'});
    } catch (e) { /* older browser with no File constructor */ }

    if (file && navigator.canShare && navigator.canShare({files: [file]})) {
      navigator.share({files: [file], title: fileName})
        .catch(function (err) {
          /* Cancelling the sheet is not a failure, so stay quiet on abort. */
          if (err && err.name !== 'AbortError') { openPrintWindow(blob, doc, fileName); }
        });
      return;
    }

    openPrintWindow(blob, doc, fileName);
  }

  function openPrintWindow(blob, doc, fileName) {
    var url = URL.createObjectURL(blob);
    var win = window.open(url, '_blank');

    if (!win) {
      /* Popup blocked, so hand over the file directly. */
      URL.revokeObjectURL(url);
      doc.save(fileName);
      return;
    }

    /* Give the PDF a moment to render before asking to print. */
    win.addEventListener('load', function () {
      setTimeout(function () {
        try { win.print(); } catch (e) { /* viewer has its own print button */ }
      }, 400);
    });
  }

  document.getElementById('printOfficeBtn').addEventListener('click', function () {
    buildPdf('office');
  });

  document.getElementById('printHomeownerBtn').addEventListener('click', function () {
    buildPdf('homeowner');
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    if (!confirm('Clear all fields and start over? Anything not saved to the list below will be gone.')) {
      return;
    }
    /* Set before clearing: unloading the page fires saveDraft, which would
       otherwise write the estimate straight back and undo the reset. */
    isResetting = true;
    clearTimeout(draftTimer);
    openEstimateId = null;
    try {
      window.localStorage.removeItem(DRAFT_KEY);
    } catch (e) { /* nothing to clear */ }
    location.reload();
  });

  /* ==========================================================================
     STARTUP

     Runs last, so every var above it exists. Restoring the draft before the
     history baseline means the first undo steps back to what was on screen,
     not to an empty form.
     ========================================================================== */

  refreshStampReadouts();
  restoreDraft();
  refreshStampReadouts();

  historyReady = true;
  lastState = snapshot();
  refreshUndoButtons();

})();
</script>

</body>
</html>
