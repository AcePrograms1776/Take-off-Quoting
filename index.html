<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remodel Quote Builder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#1b1b1b;
    --muted:#888;
    --paper:#fdfdfb;
    --page-bg:#1b2a4a;
    --accent:#f2b134;
    --line:#eee;
    --underline:#ccc;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:var(--page-bg);
    color:var(--ink);
    padding:24px 16px;
    display:flex;
    justify-content:center;
  }

  .sheet{
    width:100%; max-width:700px;
    background:var(--paper);
    border-radius:10px;
    padding:24px 26px 30px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
  }

  /* ---------- Letterhead fields (from the estimating pad) ---------- */
  .header-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:8px;}
  .header-grid.single{grid-template-columns:1fr;}

  .field-input{
    border:none; border-bottom:1px solid var(--underline);
    border-radius:0; padding:6px 2px; font-size:1rem; font-family:inherit;
    color:var(--ink); width:100%; background:transparent;
  }
  .field-input:focus{outline:none; border-bottom-color:var(--accent);}

  .header-gap{height:18px;}

  /* ---------- Trips / Permit rows ---------- */
  .item-row{
    display:flex; align-items:center; gap:12px;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .item-label{font-weight:600; min-width:3.75rem; color:var(--ink);}

  .qty-input{width:4rem; text-align:right;}

  .item-total{font-weight:600; min-width:5rem; text-align:right;}

  .permit-right{display:flex; align-items:center; gap:16px; margin-left:auto;}
  .toggle-group{display:flex; gap:8px;}
  .toggle-btn{
    border:1px solid var(--underline); background:transparent; color:var(--muted);
    padding:7px 18px; border-radius:4px; cursor:pointer; font-weight:600;
    font-size:0.85rem; font-family:inherit;
  }
  .toggle-btn:hover{border-color:var(--ink);}
  .toggle-btn.active{background:var(--accent); color:#1b1b1b; border-color:var(--accent);}

  /* ---------- Rooms ---------- */
  .room-block{
    border:1px solid var(--underline); border-radius:6px;
    padding:12px 14px; margin-top:14px;
  }
  .room-head{
    display:flex; align-items:center; gap:10px;
    padding-bottom:8px; border-bottom:1px solid var(--line);
  }
  .room-name{
    font-weight:700; font-size:1rem; font-family:inherit; color:var(--ink);
    border:none; border-bottom:1px dashed var(--underline); background:transparent;
    padding:2px 2px; min-width:0; flex:1;
  }
  .room-name:focus{outline:none; border-bottom:1px solid var(--accent);}
  .room-subtotal{margin-left:auto; font-weight:600;}
  .room-remove{
    background:none; border:none; color:var(--muted); cursor:pointer;
    font-size:0.95rem; padding:2px 4px;
  }
  .room-remove:hover{color:#b23;}
  .room-empty{color:var(--muted); font-size:0.85rem; padding:10px 0 4px;}

  .task-row{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:9px 0; border-bottom:1px solid var(--line);
  }
  .qty-unit{font-size:0.78rem; color:var(--muted);}
  .task-note{
    flex-basis:100%; font-size:0.78rem; color:var(--muted); padding-top:4px;
  }
  .task-note.warn{color:#b23;}
  .task-note:empty{display:none;}
  .custom-name{flex:1; min-width:0; font-size:0.9rem;}
  .custom-back{
    border:1px solid var(--underline); background:transparent; color:var(--muted);
    font-family:inherit; font-size:0.75rem; font-weight:600;
    padding:6px 8px; border-radius:4px; cursor:pointer; white-space:nowrap;
  }
  .custom-back:hover{border-color:var(--ink); color:var(--ink);}
  .scope-prompt{
    flex-basis:100%; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:8px 0 2px; font-size:0.78rem;
  }
  .scope-text{color:var(--muted); margin-right:auto;}
  .scope-btn{font-size:0.75rem; padding:6px 10px;}

  .task-select{flex:1; min-width:0; font-size:0.9rem;}
  .unit-price{
    font-size:0.78rem; color:var(--muted); white-space:nowrap;
    display:flex; align-items:center; gap:1px;
  }
  .price-input{
    width:3rem; border:none; border-bottom:1px dashed var(--underline);
    background:transparent; font-family:inherit; font-size:0.78rem;
    color:var(--ink); padding:2px 1px; text-align:right;
  }
  .price-input:focus{outline:none; border-bottom:1px solid var(--accent);}
  .each-label{margin-left:3px;}
  .add-task-bar{display:flex; margin-top:10px;}

  .add-room-bar{display:flex; align-items:center; gap:10px; margin-top:16px;}
  .room-picker{max-width:260px;}
  .btn-add{
    background:none; border:1px solid var(--underline); color:var(--ink);
    font-weight:600; font-size:0.85rem; font-family:inherit;
    padding:8px 14px; border-radius:4px; cursor:pointer; white-space:nowrap;
  }
  .btn-add:hover{border-color:var(--ink); background:#f4f2ec;}

  /* ---------- Summary ---------- */
  .divider{border-top:1px solid var(--line); margin:18px 0;}
  .summary-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0; border-bottom:1px solid var(--line); font-size:0.95rem;
  }
  .summary-row span:first-child{color:var(--muted);}
  .summary-row.total{border-bottom:none; border-top:2px solid var(--ink); margin-top:4px; padding-top:12px;}
  .summary-row.total span:first-child{font-weight:700; color:var(--ink); font-size:1rem;}
  .summary-row.total span:last-child{font-size:1.3rem; font-weight:700; color:var(--accent);}

  /* ---------- Actions ---------- */
  .actions{display:flex; align-items:center; gap:18px; margin-top:22px; flex-wrap:wrap;}
  .btn-primary{
    background:var(--accent); color:#1b1b1b; border:none; font-weight:700;
    padding:11px 20px; border-radius:5px; cursor:pointer; font-size:0.9rem; font-family:inherit;
  }
  .btn-primary:hover{background:#e0a02a;}
  .btn-secondary{
    background:transparent; color:var(--ink);
    border:1px solid var(--accent);
  }
  .btn-secondary:hover{background:#fdf4e2;}
  .btn-text{
    background:none; border:none; color:var(--muted); font-weight:600;
    cursor:pointer; font-size:0.9rem; font-family:inherit;
  }
  .btn-text:hover{color:var(--ink); text-decoration:underline;}

  /* Sized in px on purpose. If the stamp controls scaled with the text size
     setting, the -/+ buttons would move out from under your finger. */
  .stamp-block{
    margin-top:14px; padding-top:12px; border-top:1px solid var(--line);
    display:flex; flex-direction:column;
  }
  .stamp-line{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:7px 0; border-bottom:1px solid var(--line);
  }
  .stamp-line:last-child{border-bottom:none;}
  .st-label{font-size:13px; color:var(--muted); white-space:nowrap;}
  .st-label-r{margin-left:auto;}
  .st-num{
    -webkit-appearance:none; appearance:none;
    width:52px; min-width:52px; flex:none; height:34px;
    border:1px solid #d8d8d2; border-radius:6px; background:#fff;
    font-family:inherit; font-size:14px; color:var(--ink);
    text-align:center; padding:0; margin:0;
    font-variant-numeric:tabular-nums;
  }
  .st-num:focus{outline:none; border-color:var(--accent);}

  .st-money{
    font-size:13px; font-weight:600; color:var(--ink);
    font-variant-numeric:tabular-nums; white-space:nowrap; min-width:56px;
  }

  .yn-group{display:flex; flex:none; gap:5px;}
  .yn-btn{
    -webkit-appearance:none; appearance:none;
    border:1px solid #d8d8d2; background:#fff; color:var(--muted);
    font-family:inherit; font-size:13px; font-weight:600;
    width:44px; min-width:44px; flex:none; height:34px;
    padding:0; margin:0; border-radius:6px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .yn-btn:hover{border-color:var(--ink);}
  .yn-btn.active{background:var(--accent); border-color:var(--accent); color:#1b1b1b;}

  .st-select, .st-text{
    padding:6px 8px; font-size:14px; font-family:inherit; height:34px;
    border:1px solid #d8d8d2; border-radius:6px;
    background:#fff; color:var(--ink); min-width:110px; flex:1;
  }
  .st-select:focus, .st-text:focus{outline:none; border-color:var(--accent);}

  .stepper, .undo-pair{
    display:inline-flex; flex:none; align-items:stretch;
    border:1px solid #d8d8d2; border-radius:6px;
    background:#fff; height:34px;
  }
  .undo-pair{margin-left:auto;}
  .step-btn{
    -webkit-appearance:none; appearance:none;
    width:34px; min-width:34px; flex:none; height:100%;
    border:none; background:transparent; color:var(--ink);
    font-family:inherit; font-size:16px; line-height:1; cursor:pointer;
    padding:0; margin:0; text-align:center;
    display:flex; align-items:center; justify-content:center;
  }
  .stepper .step-btn:first-child, .undo-pair .step-btn:first-child{
    border-radius:5px 0 0 5px;
  }
  .stepper .step-btn:last-child, .undo-pair .step-btn:last-child{
    border-radius:0 5px 5px 0;
  }
  .step-btn:hover{background:#f4f2ec;}
  .step-btn:disabled{color:#c4c0b6; background:#f8f7f3; cursor:default;}
  .step-readout{
    width:34px; min-width:34px; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-variant-numeric:tabular-nums; color:var(--ink);
    border-left:1px solid #e4e1d8; border-right:1px solid #e4e1d8;
  }
  .undo-pair .step-btn:first-child{border-right:1px solid #e4e1d8;}


  /* ---------- Section labels ---------- */
  .block-label, .section-label{
    font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--muted); font-weight:700;
  }
  .block-label{margin:0 0 4px;}
  .block-label + .header-grid{margin-bottom:8px;}
  .header-grid + .block-label{margin-top:16px;}

  /* ---------- Saved estimates ---------- */
  .saved-head{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-bottom:10px;
  }
  .open-notice{
    font-size:0.8rem; color:var(--accent); font-weight:600;
    padding:2px 0 10px;
  }
  .saved-row{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .saved-row .btn-add{min-height:40px;}
  .btn-delete{
    display:block; width:100%; margin-top:12px;
    border:1px solid #d9b0b0; background:transparent; color:#b23;
    font-family:inherit; font-weight:600; font-size:0.85rem;
    padding:11px 14px; border-radius:4px; cursor:pointer;
  }
  .btn-delete:hover{background:#fbf1f1;}
  .btn-delete.armed{background:#b23; border-color:#b23; color:#fff;}
  .saved-info{flex:1; min-width:0;}
  .saved-name{
    font-weight:600; font-size:0.95rem;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .saved-meta{font-size:0.75rem; color:var(--muted); margin-top:2px;}
  .saved-total{font-weight:600; white-space:nowrap;}
  .saved-empty{font-size:0.85rem; color:var(--muted); padding:4px 0 8px;}
  .saved-detail{
    padding:8px 0 14px; border-bottom:1px solid var(--line);
    font-size:0.82rem;
  }
  .detail-line{
    display:flex; justify-content:space-between; gap:12px;
    color:var(--muted); padding:3px 0; white-space:pre;
  }
  .detail-line span:first-child{overflow:hidden; text-overflow:ellipsis;}
  .detail-room{
    display:flex; justify-content:space-between; gap:12px;
    font-weight:700; color:var(--ink); padding:8px 0 2px;
  }

  @media (max-width:560px){
    .header-grid{grid-template-columns:1fr;}
    .item-row{flex-wrap:wrap;}
    .permit-right{margin-left:0; width:100%; justify-content:space-between;}
  }

  @media print{
    body{background:#fff; padding:0;}
    .sheet{box-shadow:none; max-width:100%;}
    .actions, #addRoomBtn, .remove-row, .foot-note, .stamp-block{display:none !important;}
  }
</style>
</head>
<body>

<div class="sheet">

  <!-- Heading: same letterhead block as the estimating pad -->
  <div class="block-label">Contractor</div>
  <div class="header-grid">
    <input type="text" id="contractorName"  class="field-input" placeholder="Contractor name">
    <input type="tel"  id="contractorPhone" class="field-input" placeholder="Phone number">
  </div>
  <div class="header-grid single">
    <input type="email" id="contractorEmail" class="field-input" placeholder="Email address">
  </div>

  <div class="block-label">Customer</div>
  <div class="header-grid single">
    <input type="text" id="custName" class="field-input" placeholder="Customer name">
  </div>
  <div class="header-grid single">
    <input type="text" id="custStreet" class="field-input" placeholder="Street address &amp; house number">
  </div>
  <div class="header-grid single">
    <input type="text" id="custCityStateZip" class="field-input" placeholder="City, State ZIP">
  </div>
  <div class="stamp-block">
    <div class="stamp-line">
      <span class="st-label">Permit</span>
      <div class="yn-group" id="permitGroup">
        <button type="button" class="yn-btn" data-v="Y">Y</button>
        <button type="button" class="yn-btn" data-v="N">N</button>
      </div>
      <span class="st-money" id="permitMoney">$0.00</span>
      <span class="st-label st-label-r">FPL</span>
      <div class="yn-group" id="fplGroup">
        <button type="button" class="yn-btn" data-v="Y">Y</button>
        <button type="button" class="yn-btn" data-v="N">N</button>
      </div>
      <input type="hidden" id="stPermit" value="">
      <input type="hidden" id="stFpl" value="">
    </div>

    <div class="stamp-line">
      <span class="st-label">3%</span>
      <div class="yn-group" id="threeGroup">
        <button type="button" class="yn-btn" data-v="Y">Y</button>
        <button type="button" class="yn-btn" data-v="N">N</button>
      </div>
      <span class="st-label st-label-r">Terms</span>
      <select id="stTerms" class="st-select">
        <option value=""></option>
        <option>50/50</option>
        <option>25/50/25</option>
        <option value="Other">Other</option>
      </select>
      <input type="hidden" id="stThree" value="">
    </div>

    <div class="stamp-line" id="termsOtherWrap" style="display:none">
      <span class="st-label">Other terms</span>
      <input type="text" id="stTermsOther" class="st-text" placeholder="40/40/20">
    </div>

    <div class="stamp-line">
      <span class="st-label">Travel</span>
      <input type="text" inputmode="numeric" id="stTravel" class="st-num" value="" placeholder="0">
      <span class="st-money" id="travelMoney">$0.00</span>
      <span class="st-label st-label-r">Rev</span>
      <div class="stepper">
        <button type="button" class="step-btn" id="revMinus">&minus;</button>
        <span class="step-readout" id="revisionsReadout">0</span>
        <button type="button" class="step-btn" id="revPlus">+</button>
      </div>
      <input type="hidden" id="stRevisions" value="0">
    </div>

    <div class="stamp-line">
      <span class="st-label">Size</span>
      <div class="stepper">
        <button type="button" class="step-btn" id="textSmaller" aria-label="Smaller text">&minus;</button>
        <span class="step-readout" id="textLevel">16</span>
        <button type="button" class="step-btn" id="textBigger" aria-label="Bigger text">+</button>
      </div>
      <div class="undo-pair">
        <button type="button" class="step-btn" id="undoBtn" title="Undo" aria-label="Undo">&#8630;</button>
        <button type="button" class="step-btn" id="redoBtn" title="Redo" aria-label="Redo">&#8631;</button>
      </div>
    </div>
  </div>

  <div class="header-gap"></div>

  <div id="roomsContainer"></div>

  <div class="add-room-bar">
    <select id="roomPicker" class="field-input room-picker"></select>
    <button type="button" id="addRoomBtn" class="btn-add">+ Add Room</button>
  </div>

<div class="divider"></div>

  <div class="summary-row">
    <span>Subtotal</span>
    <span id="sumSubtotal">$0.00</span>
  </div>
  <div class="summary-row">
    <span>3% of Subtotal</span>
    <span id="sumThreePct">$0.00</span>
  </div>
  <div class="summary-row total">
    <span>Total</span>
    <span id="sumTotal">$0.00</span>
  </div>

  <div class="actions">
    <button type="button" id="printOfficeBtn" class="btn-primary">Office Copy</button>
    <button type="button" id="printHomeownerBtn" class="btn-primary btn-secondary">Homeowner Copy</button>
    <button type="button" id="resetBtn" class="btn-text">Reset form</button>
  </div>

  <div class="divider"></div>

  <div class="saved-head">
    <span class="section-label">Saved Estimates</span>
    <button type="button" id="updateBtn" class="btn-add" style="display:none">Update</button>
    <button type="button" id="saveBtn" class="btn-add">Save as new</button>
  </div>
  <div id="openNotice" class="open-notice" style="display:none"></div>
  <div id="savedList"></div>

</div>

<script>
(function(){

  /* ==========================================================================
     LETTERHEAD FIELDS — reused from the estimating pad.
     Formatting runs on "blur"/"change" (when you LEAVE a field), never on
     "input", so it doesn't interrupt voice dictation mid-word.
     ========================================================================== */

  function onFinish(el, formatter) {
    function apply() {
      var before = el.value;
      var after = formatter(before);
      if (after !== before) { el.value = after; }
    }
    el.addEventListener('blur', apply);
    el.addEventListener('change', apply);
  }

  function capitalizeWords(text) {
    return text.replace(/(^|\s)([a-z])/g, function (m, sep, letter) {
      return sep + letter.toUpperCase();
    });
  }

  function capitalizeFirst(text) {
    if (!text.length) { return text; }
    return text.charAt(0).toUpperCase() + text.slice(1);
  }

  function forceCaps(text) {
    return text.replace(/\bsrq\b/gi, 'SRQ').replace(/\bfl\b/gi, 'FL');
  }

  function formatEmail(text) {
    var t = text.trim().toLowerCase();
    t = t.replace(/\s*\b(at sign|at symbol|at)\b\s*/gi, '@');
    t = t.replace(/\s*\b(dot|period|point)\b\s*/gi, '.');
    t = t.replace(/\s*\b(underscore|under score)\b\s*/gi, '_');
    t = t.replace(/\s*\b(dash|hyphen|minus)\b\s*/gi, '-');
    t = t.replace(/\s*\b(plus)\b\s*/gi, '+');
    t = t.replace(/\s*@\s*/g, '@');
    t = t.replace(/\s*\.\s*/g, '.');
    t = t.replace(/\s+/g, '');
    t = t.replace(/[.,;:]+$/, '');
    t = t.replace(/\.{2,}/g, '.').replace(/@{2,}/g, '@');
    return capitalizeFirst(t);
  }

  function formatPhone(text) {
    var digits = text.replace(/\D/g, '');
    if (digits.length === 11 && digits.charAt(0) === '1') { digits = digits.slice(1); }
    digits = digits.slice(0, 10);
    if (digits.length > 6) { return digits.slice(0,3) + '-' + digits.slice(3,6) + '-' + digits.slice(6); }
    if (digits.length > 3) { return digits.slice(0,3) + '-' + digits.slice(3); }
    return digits;
  }

  /* Converts dictated number words into digits — e.g. "one two three" -> "123",
     "twenty three" -> "23", "four oh one" -> "401" — so a house number reads
     as an actual number, not the words that spell it out. */
  function wordsToNumber(text) {
    var ONES = {zero:0, oh:0, one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9};
    var TEENS = {ten:10, eleven:11, twelve:12, thirteen:13, fourteen:14, fifteen:15, sixteen:16, seventeen:17, eighteen:18, nineteen:19};
    var TENS = {twenty:20, thirty:30, forty:40, fifty:50, sixty:60, seventy:70, eighty:80, ninety:90};

    function clean(w) { return w.toLowerCase().replace(/[^a-z]/g, ''); }
    function isNumberWord(w) {
      var c = clean(w);
      return ONES.hasOwnProperty(c) || TEENS.hasOwnProperty(c) || TENS.hasOwnProperty(c) || c === 'hundred';
    }

    var words = text.split(/\s+/);
    var out = [];
    var i = 0;
    while (i < words.length) {
      if (words[i] && isNumberWord(words[i])) {
        var run = [];
        var j = i;
        while (j < words.length && words[j] && isNumberWord(words[j])) {
          run.push(clean(words[j]));
          j++;
        }
        var hasTensOrHundred = run.some(function (w) { return TENS.hasOwnProperty(w) || w === 'hundred'; });
        if (hasTensOrHundred) {
          var runningTotal = 0, current = 0;
          run.forEach(function (w) {
            if (ONES.hasOwnProperty(w)) { current += ONES[w]; }
            else if (TEENS.hasOwnProperty(w)) { current += TEENS[w]; }
            else if (TENS.hasOwnProperty(w)) { current += TENS[w]; }
            else if (w === 'hundred') { current = (current || 1) * 100; runningTotal += current; current = 0; }
          });
          out.push(String(runningTotal + current));
        } else if (run.length === 1) {
          var w0 = run[0];
          out.push(String(ONES.hasOwnProperty(w0) ? ONES[w0] : TEENS[w0]));
        } else {
          out.push(run.map(function (w) {
            return String(ONES.hasOwnProperty(w) ? ONES[w] : TEENS[w]);
          }).join(''));
        }
        i = j;
      } else {
        out.push(words[i]);
        i++;
      }

  function formatCityStateZip(text) {
    var t = text.trim();
    if (!t) { return t; }
    t = t.replace(/(\d)\s+(?=\d)/g, '$1');
    Object.keys(STATE_NAMES).forEach(function (name) {
      var re = new RegExp('(^|[\\s,])' + name + '(?=[\\s,]|$)', 'i');
      t = t.replace(re, '$1' + STATE_NAMES[name]);
    });
    t = forceCaps(t);
    var m = t.match(/^(.*?)[\s,]+([A-Za-z]{2})[\s,]+(\d{5}(?:-\d{4})?)\s*$/);
    if (m && STATE_CODES.indexOf(m[2].toUpperCase()) !== -1) {
      var cityRaw = m[1].trim();
      // Sarasota always displays as its SRQ shorthand; every other city just
      // gets its first letter (and each word) capitalized as normal.
      var cityOut = /^sarasota$/i.test(cityRaw) ? 'SRQ' : capitalizeWords(cityRaw);
      return cityOut + ', ' + m[2].toUpperCase() + '  ' + m[3];
    }
    return capitalizeFirst(t);
  }

  /* Accepts what people actually type: 1,200 or $1,200.50 or 1200.
     A plain type="number" field rejects a comma outright and reads as empty,
     which is how a priced line could silently come out at zero. */
  function parseMoney(text) {
    if (typeof text !== 'string') { text = String(text == null ? '' : text); }
    var cleaned = text.replace(/[^0-9.\-]/g, '');
    if (cleaned === '' || cleaned === '.' || cleaned === '-') { return NaN; }
    return parseFloat(cleaned);
  }

  function fmt(n) {

  function permitCharged() {
    return document.getElementById('stPermit').value === 'Y';

  function computeTotals() {
    var tripsQty = travelDays();
    var tripsTotal = tripsQty * TRIP_RATE;
    var permitCharge = permitCharged() ? PERMIT_FEE : 0;
    var rooms = roomsTotal();
    var subtotal = tripsTotal + permitCharge + rooms;
    var threePct = threePctApplies() ? subtotal * THREE_PCT : 0;

    return {
      tripsQty: tripsQty,
      tripsTotal: tripsTotal,
      permitCharge: permitCharge,
      rooms: rooms,
      subtotal: subtotal,
      threePct: threePct,
      total: subtotal + threePct
    };
  }

  var UC_MAX_FEET = 17;
  var UC_BASE_FIRST_FOOT = 830;
  var UC_PER_FOOT = 20;
  var UC_SECTION_FEET = 5;
  var UC_PER_EXTRA_SECTION = 40;
  var UC_TRANSFORMER_UPGRADE = 50;
  var UC_UPGRADE_AT_FEET = 10;

  function underCabinetPrice(feet) {
    var f = Math.ceil(feet);
    if (!f || f <= 0) {
      return {price:0, capped:false, upgraded:false, extraSections:0};
    }

    var capped = false;
    if (f > UC_MAX_FEET) { f = UC_MAX_FEET; capped = true; }

    var price = UC_BASE_FIRST_FOOT + UC_PER_FOOT * (f - 1);

    var extraSections = Math.ceil(f / UC_SECTION_FEET) - 1;
    price += extraSections * UC_PER_EXTRA_SECTION;

    var upgraded = f >= UC_UPGRADE_AT_FEET;
    if (upgraded) { price += UC_TRANSFORMER_UPGRADE; }

    return {
      price: price,
      capped: capped,
      upgraded: upgraded,
      extraSections: extraSections
    };
  }

    customName.style.display = 'none';
    customName.setAttribute('aria-label', 'Custom task name');

    var customBack = document.createElement('button');
    customBack.type = 'button';
    customBack.className = 'custom-back';
    customBack.textContent = 'List';
    customBack.style.display = 'none';
    customBack.setAttribute('aria-label', 'Back to the task list');
    customBack.addEventListener('click', function () {
      picker.selectedIndex = taskList.length > 1 ? 1 : 0;
      customName.value = '';
      loadTaskPrice();
    });

    var qty = document.createElement('input');
    qty.type = 'text';
    qty.setAttribute('inputmode', 'decimal');
    qty.className = 'field-input qty-input';
    qty.placeholder = '0';

    var qtyUnit = document.createElement('span');
    qtyUnit.className = 'qty-unit';

    var priceWrap = document.createElement('span');
    priceWrap.className = 'unit-price';

    var priceInput = document.createElement('input');
    priceInput.type = 'text';
    priceInput.setAttribute('inputmode', 'decimal');
    priceInput.className = 'price-input';
    priceInput.placeholder = '0';
    priceInput.setAttribute('aria-label', 'Price each');

    var eachLabel = document.createElement('span');
    eachLabel.className = 'each-label';
    eachLabel.textContent = 'each';

    priceWrap.appendChild(document.createTextNode('$'));
    priceWrap.appendChild(priceInput);
    priceWrap.appendChild(eachLabel);

    var total = document.createElement('span');
    total.className = 'item-total';

    var removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'room-remove';
    removeBtn.setAttribute('aria-label', 'Remove task');
    removeBtn.innerHTML = '&#10005;';
    removeBtn.addEventListener('click', function () {
      row.remove();
      recalcRoom(block);
    });

    var noteEl = document.createElement('div');
    noteEl.className = 'task-note';

    /* Shown only when a price is typed that differs from the set price. */
    var scopeEl = document.createElement('div');
    scopeEl.className = 'scope-prompt';
    scopeEl.style.display = 'none';

    var scopeText = document.createElement('span');
    scopeText.className = 'scope-text';

    var scopeAll = document.createElement('button');
    scopeAll.type = 'button';
    scopeAll.className = 'btn-add scope-btn';
    scopeAll.textContent = 'Change everywhere';

    var scopeOne = document.createElement('button');
    scopeOne.type = 'button';
    scopeOne.className = 'btn-add scope-btn';
    scopeOne.textContent = 'Only here';

    scopeEl.appendChild(scopeText);
    scopeEl.appendChild(scopeAll);
    scopeEl.appendChild(scopeOne);

    /* Recalculates this line from whatever price is currently in the box,
       so a one-off override only affects this line, not the saved price.
       Length-priced tasks use their own table instead. */
    function recalcTask() {
      var task = taskList[parseInt(picker.value, 10)];
      row.dataset.taskName = task.name;
      row.dataset.printName = task.custom
        ? (customName.value || 'Custom task')
        : (task.description || task.name);

      if (task.type === 'length') {
        var feet = parseMoney(qty.value) || 0;
        var result = underCabinetPrice(feet);
        row.dataset.printQty = feet ? feet + ' ft' : '';
        row.dataset.taskTotal = String(result.price);
        total.textContent = fmt(result.price);

        if (result.capped) {
          noteEl.className = 'task-note warn';
          noteEl.textContent = 'Over ' + UC_MAX_FEET + ' ft needs a second 96W transformer - price this run by hand.';
        } else {
          var bits = [];
          if (result.extraSections > 0) {
            bits.push(result.extraSections + ' extra ' + UC_SECTION_FEET + ' ft section' +
              (result.extraSections > 1 ? 's' : '') + ' at ' + fmt(UC_PER_EXTRA_SECTION));
          }
          if (result.upgraded) {
            bits.push(fmt(UC_TRANSFORMER_UPGRADE) + ' for the 96W transformer');
          }
          noteEl.className = 'task-note';
          noteEl.textContent = bits.length ? 'Includes ' + bits.join(' + ') : '';
        }
      } else {
        var price = parseMoney(priceInput.value);
        var n = parseMoney(qty.value) || 0;
        row.dataset.printQty = n ? String(n) : '';
        if (isNaN(price)) {
          row.dataset.taskTotal = '0';
          total.textContent = fmt(0);
        } else {
          var lineTotal = n * price;
          row.dataset.taskTotal = String(lineTotal);
          total.textContent = fmt(lineTotal);
        }
        noteEl.className = 'task-note';
        noteEl.textContent = '';
        updateScopePrompt(task);
      }
      recalcRoom(block);
    }

    /* Offers to push a changed price out to every other line using the same
       task, or keep it to this one line only. */
    function updateScopePrompt(task) {
      if (suppressScopePrompt || task.custom || task.type === 'length' || task.price === null) {
        scopeEl.style.display = 'none';
        return;
      }
      var typed = parseMoney(priceInput.value);
      if (isNaN(typed) || typed === task.price) {
        scopeEl.style.display = 'none';
        return;
      }
      scopeText.textContent = task.name + ' is set to ' + fmt(task.price) + '.';
      scopeEl.style.display = 'flex';
    }

    scopeAll.addEventListener('click', function () {
      var task = taskList[parseInt(picker.value, 10)];
      var typed = parseMoney(priceInput.value);
      if (isNaN(typed)) { return; }
      applyPriceEverywhere(task, typed);
      scopeEl.style.display = 'none';
    });

    scopeOne.addEventListener('click', function () {
      scopeEl.style.display = 'none';
    });

    /* Switching the task resets the price box back to that task's set price,
       and swaps the row between "per each" and "per foot" mode. */
    function loadTaskPrice() {
      var task = taskList[parseInt(picker.value, 10)];
      var isLength = task.type === 'length';

      customName.style.display = task.custom ? 'block' : 'none';
      customBack.style.display = task.custom ? 'inline-block' : 'none';
      picker.style.display = task.custom ? 'none' : 'block';
      priceWrap.style.display = isLength ? 'none' : 'flex';
      qtyUnit.textContent = isLength ? 'ft' : '';
      qty.setAttribute('aria-label', isLength ? 'Length in feet' : 'Quantity');

      if (!isLength) {
        priceInput.value = task.price === null ? '' : task.price;
      }
      scopeEl.style.display = 'none';
      recalcTask();
    }

    customName.addEventListener('input', recalcTask);

    picker.addEventListener('change', function () {
      loadTaskPrice();
      var task = taskList[parseInt(picker.value, 10)];
      if (task.custom && !isLoadingEstimate) { customName.focus(); }
    });
    priceInput.addEventListener('input', recalcTask);
    qty.addEventListener('input', recalcTask);

    row.appendChild(picker);
    row.appendChild(customName);
    row.appendChild(customBack);
    row.appendChild(qty);
    row.appendChild(qtyUnit);
    row.appendChild(priceWrap);
    row.appendChild(total);
    row.appendChild(removeBtn);
    row.appendChild(noteEl);
    row.appendChild(scopeEl);
    taskArea.appendChild(row);

    /* Start on the first real task, not on "Custom task...". */
    picker.selectedIndex = taskList.length > 1 ? 1 : 0;
    loadTaskPrice();
    return row;
  }

  /* Pushes a price change out to every line using this same task, and makes
     it the new set price so tasks added later pick it up too. */
  var suppressScopePrompt = false;
  var isLoadingEstimate = false;

  function applyPriceEverywhere(task, newPrice) {
    var oldPrice = task.price;

    /* Update every task object with this name that was on the old price.
       A same-named task at a different price (outdoor Switch at $165 versus
       interior at $125) is deliberately left alone. */
    ALL_TASK_OBJECTS.forEach(function (t) {
      if (t.name === task.name && t.price === oldPrice) { t.price = newPrice; }
    });

    suppressScopePrompt = true;
    document.querySelectorAll('.task-row').forEach(function (r) {
      if (r.dataset.taskName !== task.name) { return; }
      var pi = r.querySelector('.price-input');
      if (!pi) { return; }
      var current = parseMoney(pi.value);
      /* Leave alone any line you deliberately set to something else. */
      if (pi.value === '' || current === oldPrice) {
        pi.value = newPrice;
        pi.dispatchEvent(new Event('input'));
      }
    });
    suppressScopePrompt = false;
  }

  function recalcRoom(block) {
    var sum = 0;
    block.querySelectorAll('.task-row').forEach(function (r) {
      sum += parseFloat(r.dataset.taskTotal) || 0;
    });
    block.dataset.roomTotal = String(sum);
    block.querySelector('.room-subtotal').textContent = fmt(sum);
    updateAll();
  }

  function roomsTotal() {
    if (!roomsContainer) { return 0; }
    var sum = 0;
    roomsContainer.querySelectorAll('.room-block').forEach(function (b) {
      sum += parseFloat(b.dataset.roomTotal) || 0;
    });
    return sum;
  }

  /* ==========================================================================
     TEXT SIZE

     Every size in the stylesheet is in rem, so changing the root font size
     scales the whole page at once. Remembered between visits.
     ========================================================================== */

  var TEXT_SIZES = [10, 12, 14, 16, 18];
  var TEXT_SIZE_KEY = 'remodelQuoteTextSize';
  var textSizeIndex = 3;   // 16px

  function applyTextSize() {
    document.documentElement.style.fontSize = TEXT_SIZES[textSizeIndex] + 'px';

    document.getElementById('textLevel').textContent = TEXT_SIZES[textSizeIndex];
    document.getElementById('textSmaller').disabled = textSizeIndex === 0;
    document.getElementById('textBigger').disabled = textSizeIndex === TEXT_SIZES.length - 1;

    try {
      window.localStorage.setItem(TEXT_SIZE_KEY, String(textSizeIndex));
    } catch (e) { /* fine, it just will not be remembered */ }
  }

  try {
    var storedSize = parseInt(window.localStorage.getItem(TEXT_SIZE_KEY), 10);
    if (!isNaN(storedSize) && storedSize >= 0 && storedSize < TEXT_SIZES.length) {
      textSizeIndex = storedSize;
    }
  } catch (e) { /* no stored preference */ }

  applyTextSize();

  document.getElementById('textSmaller').addEventListener('click', function () {
    if (textSizeIndex > 0) { textSizeIndex--; applyTextSize(); }
  });

  document.getElementById('textBigger').addEventListener('click', function () {
    if (textSizeIndex < TEXT_SIZES.length - 1) { textSizeIndex++; applyTextSize(); }
  });

  /* ==========================================================================
     SAVED ESTIMATES

     Stored in this browser only, on this device. Saving on your phone does
     not put it on your boss's phone. The PDF is still the shareable copy.
     ========================================================================== */

  var STORAGE_KEY = 'remodelQuoteEstimates';
  var savedListEl = document.getElementById('savedList');

  function storageAvailable() {
    try {
      var probe = '__probe__';
      window.localStorage.setItem(probe, '1');
      window.localStorage.removeItem(probe);
      return true;
    } catch (e) {
      return false;
    }
  }

  function readSaved() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function writeSaved(list) {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      return true;
    } catch (e) {
      return false;
    }
  }

  /* Reads the whole form into a plain object. */
  function collectEstimate() {
    var rooms = [];
    roomsContainer.querySelectorAll('.room-block').forEach(function (b) {
      var tasks = [];
      b.querySelectorAll('.task-row').forEach(function (r) {
        var picker = r.querySelector('.task-select');
        var priceInput = r.querySelector('.price-input');
        var customEl = r.querySelector('.custom-name');
        tasks.push({
          task: picker.options[picker.selectedIndex].textContent,
          customName: customEl ? customEl.value : '',
          qty: r.querySelector('.qty-input').value,
          price: priceInput ? priceInput.value : '',
          lineTotal: parseFloat(r.dataset.taskTotal) || 0
        });
      });
      rooms.push({
        name: b.querySelector('.room-name').value,
        type: b.dataset.roomType || b.querySelector('.room-name').value,
        tasks: tasks,
        roomTotal: parseFloat(b.dataset.roomTotal) || 0
      });
    });

    var stamp = {};
    STAMP_FIELDS.forEach(function (id) {
      stamp[id] = document.getElementById(id).value;
    });

    return {
      id: String(Date.now()),
      savedAt: new Date().toISOString(),
      stamp: stamp,
      contractorName: document.getElementById('contractorName').value,
      contractorPhone: document.getElementById('contractorPhone').value,
      contractorEmail: elContractorEmail.value,
      custName: elName.value,
      custStreet: elStreet.value,
      custCityStateZip: elCityStateZip.value,
      trips: String(travelDays()),
      permit: permitCharged() ? 'yes' : (document.getElementById('stPermit').value === 'N' ? 'no' : null),
      rooms: rooms,
      total: computeTotals().total
    };
  }

  /* Rebuilds the whole form from a saved object. */
  function applyEstimate(e) {
    isLoadingEstimate = true;

    STAMP_FIELDS.forEach(function (id) {
      document.getElementById(id).value = (e.stamp && e.stamp[id]) || (id === 'stTravel' || id === 'stRevisions' ? '0' : '');
    });
    refreshStampReadouts();
    document.getElementById('contractorName').value = e.contractorName || '';
    document.getElementById('contractorPhone').value = e.contractorPhone || '';
    elContractorEmail.value = e.contractorEmail || e.custEmail || '';
    elName.value = e.custName || '';
    elStreet.value = e.custStreet || '';
    elCityStateZip.value = e.custCityStateZip || '';

    /* Older saves kept trips and permit outside the stamp block. If the stamp
       fields did not carry them, fall back to those values. */
    if (!(e.stamp && e.stamp.stTravel) && e.trips) {
      document.getElementById('stTravel').value = e.trips;
    }
    if (!(e.stamp && e.stamp.stPermit) && e.permit) {
      document.getElementById('stPermit').value = e.permit === 'yes' ? 'Y' : 'N';
    }
    refreshStampReadouts();

    roomsContainer.innerHTML = '';

    (e.rooms || []).forEach(function (r) {
      var roomType = r.type || r.name;
      var block = addRoom(roomType);
      block.querySelector('.room-name').value = r.name;
      var taskArea = block.querySelector('.task-area');
      var roomTasks = tasksForRoom(roomType);

      (r.tasks || []).forEach(function (t) {
        var row = addTask(block, taskArea, roomTasks);
        var picker = row.querySelector('.task-select');

        for (var i = 0; i < picker.options.length; i++) {
          if (picker.options[i].textContent === t.task) {
            picker.selectedIndex = i;
            break;
          }
        }
        /* Changing the task resets the price, so set the price afterwards. */
        picker.dispatchEvent(new Event('change'));

        var customEl = row.querySelector('.custom-name');
        if (customEl && t.customName) { customEl.value = t.customName; }

        var priceInput = row.querySelector('.price-input');
        if (priceInput && t.price !== '') { priceInput.value = t.price; }

        var qtyInput = row.querySelector('.qty-input');
        qtyInput.value = t.qty;
        qtyInput.dispatchEvent(new Event('input'));
      });
    });

    isLoadingEstimate = false;
    updateAll();
    window.scrollTo(0, 0);
  }

  function renderSavedList() {
    savedListEl.innerHTML = '';

    if (!storageAvailable()) {
      var warn = document.createElement('div');
      warn.className = 'saved-empty';
      warn.textContent = 'Saving is not available in this browser view. It works on the live site.';
      savedListEl.appendChild(warn);
      return;
    }

    var list = readSaved();
    if (!list.length) {
      var empty = document.createElement('div');
      empty.className = 'saved-empty';
      empty.textContent = 'No saved estimates yet.';
      savedListEl.appendChild(empty);
      return;
    }

    list.forEach(function (e) {
      var wrap = document.createElement('div');

      var row = document.createElement('div');
      row.className = 'saved-row';

      var info = document.createElement('div');
      info.className = 'saved-info';

      var nameEl = document.createElement('div');
      nameEl.className = 'saved-name';
      nameEl.textContent = e.custName || 'Untitled estimate';

      var roomCount = (e.rooms || []).length;
      var taskCount = (e.rooms || []).reduce(function (n, r) {
        return n + (r.tasks || []).length;
      }, 0);

      var meta = document.createElement('div');
      meta.className = 'saved-meta';
      var when = new Date(e.savedAt);
      meta.textContent = when.toLocaleDateString() + '  ' +
        when.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) +
        '  -  ' + roomCount + ' room' + (roomCount === 1 ? '' : 's') +
        ', ' + taskCount + ' task' + (taskCount === 1 ? '' : 's');

      info.appendChild(nameEl);
      info.appendChild(meta);

      var totalEl = document.createElement('span');
      totalEl.className = 'saved-total';
      totalEl.textContent = fmt(e.total || 0);

      /* Tap to see everything the save is holding. */
      var detail = document.createElement('div');
      detail.className = 'saved-detail';
      detail.style.display = 'none';

      var detailBtn = document.createElement('button');
      detailBtn.type = 'button';
      detailBtn.className = 'btn-add';
      detailBtn.textContent = 'Details';
      detailBtn.addEventListener('click', function () {
        var open = detail.style.display !== 'none';
        detail.style.display = open ? 'none' : 'block';
        detailBtn.textContent = open ? 'Details' : 'Hide';
      });

      var openBtn = document.createElement('button');
      openBtn.type = 'button';
      openBtn.className = 'btn-add';
      openBtn.textContent = 'Open';
      openBtn.addEventListener('click', function () {
        if (confirm('Open "' + (e.custName || 'Untitled') + '"? This replaces what is on screen now.')) {
          applyEstimate(e);
          setOpenEstimate(e.id, e.custName);
        }
      });

      var delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'btn-delete';
      delBtn.textContent = 'Delete this estimate';

      var armed = false;
      var armTimer = null;
      delBtn.addEventListener('click', function () {
        if (!armed) {
          armed = true;
          delBtn.textContent = 'Tap again to confirm';
          delBtn.classList.add('armed');
          armTimer = setTimeout(function () {
            armed = false;
            delBtn.textContent = 'Delete this estimate';
            delBtn.classList.remove('armed');
          }, 4000);
          return;
        }
        clearTimeout(armTimer);
        writeSaved(readSaved().filter(function (x) { return x.id !== e.id; }));
        if (openEstimateId === e.id) { setOpenEstimate(null); }
        renderSavedList();
      });

      /* Build the detail body: trips, permit, then every room and task. */
      function detailLine(label, value, cls) {
        var d = document.createElement('div');
        d.className = cls || 'detail-line';
        var l = document.createElement('span');
        l.textContent = label;
        var v = document.createElement('span');
        v.textContent = value;
        d.appendChild(l);
        d.appendChild(v);
        return d;
      }

      var trips = parseFloat(e.trips) || 0;
      detail.appendChild(detailLine('Trips  x' + trips, fmt(trips * TRIP_RATE)));
      detail.appendChild(detailLine(
        'Permit  ' + (e.permit === 'yes' ? 'Yes' : e.permit === 'no' ? 'No' : '-'),
        fmt(e.permit === 'yes' ? PERMIT_FEE : 0)
      ));

      (e.rooms || []).forEach(function (r) {
        detail.appendChild(detailLine(r.name, fmt(r.roomTotal || 0), 'detail-room'));
        (r.tasks || []).forEach(function (t) {
          var qtyText = t.qty ? t.qty + ' x ' : '';
          detail.appendChild(detailLine('    ' + qtyText + t.task, fmt(t.lineTotal || 0)));
        });
      });

      if (!(e.rooms || []).length) {
        var none = document.createElement('div');
        none.className = 'detail-line';
        none.textContent = 'No rooms in this estimate.';
        detail.appendChild(none);
      }

      detail.appendChild(delBtn);

      row.appendChild(info);
      row.appendChild(totalEl);
      row.appendChild(detailBtn);
      row.appendChild(openBtn);

      wrap.appendChild(row);
      wrap.appendChild(detail);
      savedListEl.appendChild(wrap);
    });
  }

  /* Which saved estimate is on screen, so Update overwrites that one instead
     of piling up a new copy every time. Null means this is fresh work. */
  var openEstimateId = null;

  function setOpenEstimate(id, name) {
    openEstimateId = id;
    var btn = document.getElementById('updateBtn');
    var notice = document.getElementById('openNotice');

    if (id) {
      btn.style.display = 'inline-block';
      notice.style.display = 'block';
      notice.textContent = 'Editing "' + (name || 'Untitled') + '"';
    } else {
      btn.style.display = 'none';
      notice.style.display = 'none';
    }
  }

  document.getElementById('updateBtn').addEventListener('click', function () {
    tidyLetterhead();
    if (!openEstimateId) { return; }

    var list = readSaved();
    var idx = -1;
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === openEstimateId) { idx = i; break; }
    }
    if (idx === -1) {
      alert('That estimate is no longer in the list. Use "Save as new" instead.');
      setOpenEstimate(null);
      return;
    }

    var updated = collectEstimate();
    updated.id = openEstimateId;          // keep its place in the list
    updated.savedAt = new Date().toISOString();
    list[idx] = updated;

    if (writeSaved(list)) {
      renderSavedList();
      setOpenEstimate(openEstimateId, updated.custName);
      flashButton(this, 'Updated');
    } else {
      alert('Could not save - storage may be full. Try deleting an old estimate.');
    }
  });

  function flashButton(btn, message) {
    var original = btn.textContent;
    btn.textContent = message;
    setTimeout(function () { btn.textContent = original; }, 1400);
  }

  document.getElementById('saveBtn').addEventListener('click', function () {
    tidyLetterhead();

    if (!storageAvailable()) {
      alert('This browser will not let the page save. Try the live site, or download the PDF instead.');
      return;
    }

    var list = readSaved();
    var fresh = collectEstimate();
    list.unshift(fresh);
    if (list.length > 50) { list = list.slice(0, 50); }

    if (writeSaved(list)) {
      renderSavedList();
      setOpenEstimate(fresh.id, fresh.custName);
      flashButton(this, 'Saved');
    } else {
      alert('Could not save - storage may be full. Try deleting an old estimate.');
    }
  });

  renderSavedList();

  /* ==========================================================================
     AUTO-SAVE OF WORK IN PROGRESS

     Separate from the Saved Estimates list below. This quietly keeps whatever
     is on screen, so closing the tab, switching apps, or the phone going to
     sleep does not lose the estimate. Restored automatically next visit.
     ========================================================================== */

  var DRAFT_KEY = 'remodelQuoteDraft';
  var draftTimer = null;

  function hasAnyContent(d) {
    return !!(d.custName || d.custStreet || d.contractorName ||
      (d.trips && d.trips !== '0') || d.permit ||
      (d.rooms && d.rooms.length));
  }

  function saveDraft() {
    if (isLoadingEstimate) { return; }
    try {
      var d = collectEstimate();
      if (!hasAnyContent(d)) { return; }
      d.openId = openEstimateId;
      window.localStorage.setItem(DRAFT_KEY, JSON.stringify(d));
    } catch (e) { /* storage blocked or full - nothing else to do */ }
  }

  /* Batched so typing does not write on every keystroke. */
  function queueDraftSave() {
    clearTimeout(draftTimer);
    draftTimer = setTimeout(saveDraft, 600);
  }

  document.addEventListener('input', queueDraftSave);
  document.addEventListener('change', queueDraftSave);
  document.addEventListener('click', queueDraftSave);

  /* Write immediately when the app is backgrounded or closed, since a
     pending timer would never get the chance to fire. */
  window.addEventListener('pagehide', saveDraft);
  window.addEventListener('beforeunload', saveDraft);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') { saveDraft(); }
  });

  function restoreDraft() {
    var raw;
    try {
      raw = window.localStorage.getItem(DRAFT_KEY);
    } catch (e) { return; }
    if (!raw) { return; }
    try {
      var d = JSON.parse(raw);
      if (hasAnyContent(d)) {
        applyEstimate(d);
        if (d.openId) { setOpenEstimate(d.openId, d.custName); }
      }
    } catch (e) { /* unreadable draft, leave the form blank */ }
  }

  /* Draft restore and history init run at the very end of the script, once
     STAMP_FIELDS and the history variables actually exist. */

  /* ==========================================================================
     STAMP FIELDS

     What used to get stamped on a paper estimate. Blank ones are left off the
     printed page so the block stays tight.

     Note: PERMIT and 3% are NOT inputs here. This tool already has a Permit
     Yes/No control that drives the $500, and always charges the 3%, so those
     two print from the real numbers rather than from a second set of boxes
     that could disagree with them.
     ========================================================================== */

  var STAMP_FIELDS = ['stPermit', 'stFpl', 'stThree', 'stTerms', 'stTermsOther', 'stTravel', 'stRevisions'];

  /* Y/N toggles. Tapping the button already lit clears it back to blank, so a
     field can still be left off the printed stamp. */
  function wireToggle(groupId, fieldId, onChange) {
    var group = document.getElementById(groupId);
    var field = document.getElementById(fieldId);

    group.querySelectorAll('.yn-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        field.value = field.value === btn.dataset.v ? '' : btn.dataset.v;
        paintToggle(groupId, fieldId);
        if (onChange) { onChange(field.value); }
        queueDraftSave();
        commitHistory();
      });
    });
  }

  function paintToggle(groupId, fieldId) {
    var v = document.getElementById(fieldId).value;
    document.getElementById(groupId).querySelectorAll('.yn-btn').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.v === v && v !== '');
    });
  }

  function paintAllToggles() {
    paintToggle('permitGroup', 'stPermit');
    paintToggle('fplGroup', 'stFpl');
    paintToggle('threeGroup', 'stThree');
  }

  /* The Permit toggle and the Permit Yes/No row are the same setting shown
     twice, so each updates the other. The 3% toggle really does control the
     charge: blank or Y charges it, N leaves it off. */
  wireToggle('permitGroup', 'stPermit', updateAll);
  wireToggle('fplGroup', 'stFpl');
  wireToggle('threeGroup', 'stThree', updateAll);

  function threePctApplies() {
    return document.getElementById('stThree').value !== 'N';
  }

  function toggleTermsOther() {
    var other = document.getElementById('stTerms').value === 'Other';
    document.getElementById('termsOtherWrap').style.display = other ? 'flex' : 'none';
  }
  function stepNum(id, direction) {
    var el = document.getElementById(id);
    var v = parseInt(el.value, 10);
    if (isNaN(v)) { v = 0; }
    v += direction;
    if (v < 0) { v = 0; }
    if (v > 99) { v = 99; }
    el.value = v;
    refreshStampReadouts();
    updateAll();
    queueDraftSave();
    commitHistory();
  }

  function refreshStampReadouts() {
    document.getElementById('revisionsReadout').textContent =
      document.getElementById('stRevisions').value || '0';
    paintAllToggles();
    toggleTermsOther();
  }

  /* Travel days is typed. Keep it to digits and refresh the money as you go. */
  document.getElementById('stTravel').addEventListener('input', function () {
    var cleaned = this.value.replace(/[^0-9]/g, '');
    if (cleaned !== this.value) { this.value = cleaned; }
    updateAll();
  });
  document.getElementById('revMinus').addEventListener('click', function () { stepNum('stRevisions', -1); });
  document.getElementById('revPlus').addEventListener('click', function () { stepNum('stRevisions', 1); });
  document.getElementById('stTerms').addEventListener('change', toggleTermsOther);

  /* Label/value pairs for the printed page, skipping anything left blank. */
  function stampLines() {
    var out = [];

    [['stPermit', 'PERMIT'], ['stFpl', 'FPL'], ['stThree', '3%']]
      .forEach(function (pair) {
        var v = document.getElementById(pair[0]).value;
        if (v) { out.push([pair[1], v]); }
      });

    var terms = document.getElementById('stTerms').value;
    if (terms === 'Other') {
      var custom = document.getElementById('stTermsOther').value.trim();
      if (custom) { out.push(['TERMS', custom]); }
    } else if (terms) {
      out.push(['TERMS', terms]);
    }

    var travel = parseInt(document.getElementById('stTravel').value, 10) || 0;
    if (travel > 0) { out.push(['TRAVEL DAYS', String(travel)]); }

    var revs = parseInt(document.getElementById('stRevisions').value, 10) || 0;
    if (revs > 0) { out.push(['REVISIONS', String(revs)]); }

    return out;
  }

  /* ==========================================================================
     UNDO / REDO

     A snapshot is the whole estimate, not one field, so undo restores every
     room, task, price and letterhead field together. collectEstimate and
     applyEstimate already do exactly that, so history rides on top of them.
     ========================================================================== */

  var UNDO_LIMIT = 60;
  var undoStack = [];
  var redoStack = [];
  var lastState = null;
  var historyTimer = null;
  var historyReady = false;

  function snapshot() {
    var s = collectEstimate();
    delete s.id;
    delete s.savedAt;
    return s;
  }

  function sameState(a, b) {
    if (!a || !b) { return false; }
    return JSON.stringify(a) === JSON.stringify(b);
  }

  function commitHistory() {
    if (!historyReady || isLoadingEstimate) { return; }
    if (historyTimer) { clearTimeout(historyTimer); historyTimer = null; }

    var now = snapshot();
    if (lastState && !sameState(lastState, now)) {
      undoStack.push(lastState);
      if (undoStack.length > UNDO_LIMIT) { undoStack.shift(); }
      redoStack = [];
    }
    lastState = now;
    refreshUndoButtons();
  }

  /* Waits for a pause so a burst of typing is one step, not twenty. */
  function scheduleHistory() {
    if (!historyReady || isLoadingEstimate) { return; }
    if (historyTimer) { clearTimeout(historyTimer); }
    historyTimer = setTimeout(commitHistory, 600);
  }

  function undo() {
    commitHistory();
    if (!undoStack.length) { return; }
    redoStack.push(snapshot());
    var previous = undoStack.pop();
    applyEstimate(previous);
    refreshStampReadouts();
    lastState = previous;
    saveDraft();
    refreshUndoButtons();
  }

  function redo() {
    if (!redoStack.length) { return; }
    undoStack.push(snapshot());
    var next = redoStack.pop();
    applyEstimate(next);
    refreshStampReadouts();
    lastState = next;
    saveDraft();
    refreshUndoButtons();
  }

  function refreshUndoButtons() {
    document.getElementById('undoBtn').disabled = !undoStack.length;
    document.getElementById('redoBtn').disabled = !redoStack.length;
  }

  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('redoBtn').addEventListener('click', redo);

  document.addEventListener('input', scheduleHistory);
  document.addEventListener('change', scheduleHistory);
  document.addEventListener('click', function (e) {
    /* A button press is a finished action, so close the step at once. */
    if (e.target.closest('button') && !e.target.closest('.undo-pair')) {
      setTimeout(commitHistory, 0);
    }
  });

  /* ==========================================================================
     PDF GENERATION
     ========================================================================== */

  /* mode 'office'    - every line item and price, for internal use
     mode 'homeowner' - the same scope of work, but only the final total */
  function buildPdf(mode) {
    tidyLetterhead();

    var showPrices = mode === 'office';

    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({unit:'pt', format:'letter'});
    var marginX = 40;
    var y = 50;

    var custName = elName.value;
    var custStreet = elStreet.value;
    var custCityStateZip = elCityStateZip.value;

    doc.setFont('helvetica','normal'); doc.setFontSize(9);

    var contractorName = elContractorName.value;
    var contractorPhone = elContractorPhone.value;
    var contractorEmail = elContractorEmail.value;
    if (contractorName) {
      doc.setFont('helvetica','bold'); doc.setFontSize(12);
      doc.text(contractorName, marginX, y);
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      y += 13;
    }
    if (contractorPhone) { doc.text(contractorPhone, marginX, y); y += 11; }
    if (contractorEmail) { doc.text(contractorEmail, marginX, y); y += 11; }
    if (contractorName || contractorPhone || contractorEmail) { y += 8; }

    if (custName) { doc.text(custName, marginX, y); y += 11; }
    if (custStreet) { doc.text(custStreet, marginX, y); y += 11; }
    if (custCityStateZip) { doc.text(custCityStateZip, marginX, y); y += 11; }
    y += 10;

    var pageBottom = doc.internal.pageSize.getHeight() - 45;
    var pageRight = doc.internal.pageSize.getWidth() - marginX;
    var contentW = pageRight - marginX;

    /* Stamp sits top right, starting level with the letterhead. Whichever
       side runs longer decides where the rest of the page begins. */
    var stamp = stampLines();
    if (stamp.length) {
      var sy = 50;
      var stampX = marginX + contentW * 0.62;
      doc.setFontSize(8);
      stamp.forEach(function (pair) {
        doc.text(pair[0], stampX, sy);
        doc.text(pair[1], pageRight, sy, {align:'right'});
        sy += 10;
      });
      doc.setFontSize(9);
      if (sy > y) { y = sy; }
    }

    y += 4;

    function newPageIfNeeded(needed) {
      if (y + (needed || 0) > pageBottom) {
        doc.addPage();
        y = 50;
      }
    }

    var t = computeTotals();

    if (!showPrices) {
      doc.setFont('helvetica','bold'); doc.setFontSize(10);
      doc.text('Scope of Work', marginX, y);
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      y += 15;
    }

    if (showPrices) {
      doc.text('Trips: ' + t.tripsQty + ' x ' + fmt(TRIP_RATE) + ' = ' + fmt(t.tripsTotal), marginX, y);
      y += 12;
      var pv = document.getElementById('stPermit').value;
      var permitLabel = pv === 'Y' ? 'Yes' : pv === 'N' ? 'No' : 'Not selected';
      doc.text('Permit: ' + permitLabel + ' - ' + fmt(t.permitCharge), marginX, y);
      y += 16;
    } else if (permitCharged()) {
      doc.text('Includes permit', marginX, y);
      y += 15;
    }

    roomsContainer.querySelectorAll('.room-block').forEach(function (b) {
      var rows = b.querySelectorAll('.task-row');
      if (!rows.length) { return; }

      newPageIfNeeded(30);
      doc.setFont('helvetica', 'bold');
      doc.text(b.querySelector('.room-name').value, marginX, y);
      if (showPrices) {
        doc.text(fmt(parseFloat(b.dataset.roomTotal) || 0), pageRight, y, {align:'right'});
      }
      doc.setFont('helvetica', 'normal');
      y += 12;

      rows.forEach(function (r) {
        newPageIfNeeded(0);
        var qtyText = r.dataset.printQty ? r.dataset.printQty + '  x  ' : '';
        doc.text('   ' + qtyText + (r.dataset.printName || ''), marginX, y);
        if (showPrices) {
          doc.text(fmt(parseFloat(r.dataset.taskTotal) || 0), pageRight, y, {align:'right'});
        }
        y += 11;
      });
      y += 7;
    });

    newPageIfNeeded(60);

    if (showPrices) {
      doc.text('Subtotal: ' + fmt(t.subtotal), marginX, y);
      y += 12;
      doc.text('3% of Subtotal: ' + fmt(t.threePct), marginX, y);
      y += 15;
    } else {
      y += 4;
      doc.setDrawColor(180,180,180);
      doc.line(marginX, y, pageRight, y);
      y += 15;
    }

    doc.setFont('helvetica','bold'); doc.setFontSize(11);
    doc.text('Total: ' + fmt(t.total), marginX, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(9);

    var safeClient = (custName || 'quote').replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g,'');
    var fileName = safeClient + (showPrices ? '-office' : '-homeowner') + '.pdf';

    deliverPdf(doc, fileName);
  }

  /* On iPhone and iPad this opens the share sheet, which is where Print,
     Mail, Messages and Save to Files all live. autoPrint was the wrong tool
     there: iOS opens the PDF viewer but never fires the print dialog, so you
     end up staring at a preview with no way out.
     Desktop browsers do not support sharing files, so they get the print
     window instead, which is the equivalent one-step route to paper or PDF. */
  function deliverPdf(doc, fileName) {
    var blob = doc.output('blob');

    var file = null;
    try {
      file = new File([blob], fileName, {type: 'application/pdf'});
    } catch (e) { /* older browser with no File constructor */ }

    if (file && navigator.canShare && navigator.canShare({files: [file]})) {
      navigator.share({files: [file], title: fileName})
        .catch(function (err) {
          /* Cancelling the sheet is not a failure, so stay quiet on abort. */
          if (err && err.name !== 'AbortError') { openPrintWindow(blob, doc, fileName); }
        });
      return;
    }

    openPrintWindow(blob, doc, fileName);
  }

  function openPrintWindow(blob, doc, fileName) {
    var url = URL.createObjectURL(blob);
    var win = window.open(url, '_blank');

    if (!win) {
      /* Popup blocked, so hand over the file directly. */
      URL.revokeObjectURL(url);
      doc.save(fileName);
      return;
    }

    /* Give the PDF a moment to render before asking to print. */
    win.addEventListener('load', function () {
      setTimeout(function () {
        try { win.print(); } catch (e) { /* viewer has its own print button */ }
      }, 400);
    });
  }

  document.getElementById('printOfficeBtn').addEventListener('click', function () {
    buildPdf('office');
  });

  document.getElementById('printHomeownerBtn').addEventListener('click', function () {
    buildPdf('homeowner');
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    if (confirm('Clear all fields and start over? Anything not saved to the list below will be gone.')) {
      try {
        window.localStorage.removeItem(DRAFT_KEY);
      } catch (e) { /* nothing to clear */ }
      openEstimateId = null;
      location.reload();
    }
  });

  /* ==========================================================================
     STARTUP

     Runs last, so every var above it exists. Restoring the draft before the
     history baseline means the first undo steps back to what was on screen,
     not to an empty form.
     ========================================================================== */

  refreshStampReadouts();
  restoreDraft();
  refreshStampReadouts();

  historyReady = true;
  lastState = snapshot();
  refreshUndoButtons();

})();
</script>

</body>
</html>
